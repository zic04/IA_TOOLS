<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where read-only and forbidden routes act during a capture">
  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="d-arrow" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="d-box" x="20" y="40" width="200" height="180" rx="10"/>
  <text class="d-title" x="120" y="66" text-anchor="middle">Plan entry</text>
  <text class="d-small" x="120" y="88" text-anchor="middle">route, actions, zones</text>
  <rect class="d-danger" x="40" y="120" width="160" height="78" rx="8"/>
  <text class="d-title" x="120" y="146" text-anchor="middle">capture.forbidden</text>
  <text class="d-small" x="120" y="166" text-anchor="middle">matching route:</text>
  <text class="d-small" x="120" y="184" text-anchor="middle">never opened (exit 1)</text>

  <rect class="d-box" x="300" y="40" width="250" height="180" rx="10"/>
  <text class="d-title" x="425" y="66" text-anchor="middle">Headless browser</text>
  <text class="d-small" x="425" y="88" text-anchor="middle">with your session</text>
  <rect class="d-brand" x="320" y="104" width="210" height="44" rx="8"/>
  <text class="d-text" x="425" y="131" text-anchor="middle">GET, HEAD, OPTIONS: sent</text>
  <rect class="d-warn" x="320" y="158" width="210" height="44" rx="8"/>
  <text class="d-text" x="425" y="185" text-anchor="middle">POST, PUT, DELETE…: aborted</text>

  <rect class="d-box" x="630" y="40" width="250" height="180" rx="10"/>
  <text class="d-title" x="755" y="66" text-anchor="middle">Application server</text>
  <text class="d-small" x="755" y="88" text-anchor="middle">renders the page it receives</text>
  <rect class="d-danger" x="650" y="130" width="210" height="58" rx="8"/>
  <text class="d-text" x="755" y="155" text-anchor="middle">writes while rendering</text>
  <text class="d-small" x="755" y="175" text-anchor="middle">out of the browser's reach</text>

  <path class="d-line" d="M220 126H296" marker-end="url(#sf-arrow)"/>
  <text class="d-small" x="258" y="116" text-anchor="middle">opens</text>
  <path class="d-line" d="M530 126H626" marker-end="url(#sf-arrow)"/>
  <path class="d-dashed" d="M530 180H600"/>
  <text class="d-small" x="565" y="206" text-anchor="middle">blocked</text>
  <text class="d-small" x="450" y="248" text-anchor="middle">Read-only stops the writes the browser sends; only forbidden routes stop the writes the server makes on a GET.</text>
</svg>
