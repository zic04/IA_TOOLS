<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Une requête à travers les cinq mécanismes de sécurité d'Acme Orders : fournisseur d'identité, middleware, droits, filtre de périmètre et journal d'audit">
  <defs>
    <marker id="ese-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ese-arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow-brand" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <!-- 1. Fournisseur d'identité -->
  <rect class="d-box" x="140" y="14" width="210" height="56" rx="10"/>
  <text class="d-title" x="245" y="40" text-anchor="middle">Fournisseur d'identité</text>
  <text class="d-small" x="245" y="58" text-anchor="middle">connexion OIDC</text>

  <!-- La requête, de gauche à droite -->
  <rect class="d-box" x="10" y="124" width="120" height="60" rx="10"/>
  <text class="d-title" x="70" y="150" text-anchor="middle">Navigateur</text>
  <text class="d-small" x="70" y="170" text-anchor="middle">cache des boutons</text>

  <rect class="d-brand" x="160" y="124" width="170" height="60" rx="10"/>
  <text class="d-title" x="245" y="150" text-anchor="middle">Middleware</text>
  <text class="d-small" x="245" y="170" text-anchor="middle">middleware.ts</text>

  <rect class="d-brand" x="360" y="124" width="170" height="60" rx="10"/>
  <text class="d-title" x="445" y="150" text-anchor="middle">Droits</text>
  <text class="d-small" x="445" y="170" text-anchor="middle">requirePermission()</text>

  <rect class="d-brand" x="560" y="124" width="150" height="60" rx="10"/>
  <text class="d-title" x="635" y="150" text-anchor="middle">Périmètre</text>
  <text class="d-small" x="635" y="170" text-anchor="middle">scopeWhere()</text>

  <rect class="d-info" x="740" y="124" width="150" height="60" rx="10"/>
  <text class="d-title" x="815" y="150" text-anchor="middle">Base de données</text>
  <text class="d-small" x="815" y="170" text-anchor="middle">PostgreSQL</text>

  <path class="d-line-brand" d="M130 154H157" marker-end="url(#ese-arrow-brand)"/>
  <path class="d-line-brand" d="M330 154H357" marker-end="url(#ese-arrow-brand)"/>
  <path class="d-line-brand" d="M530 154H557" marker-end="url(#ese-arrow-brand)"/>
  <path class="d-line-brand" d="M710 154H737" marker-end="url(#ese-arrow-brand)"/>

  <!-- Pas de session : direction le fournisseur d'identité -->
  <path class="d-line" d="M245 124V73" marker-end="url(#ese-arrow)"/>
  <text class="d-small" x="256" y="102">pas de session : connexion</text>

  <!-- 5. Journal d'audit -->
  <rect class="d-info" x="345" y="232" width="200" height="56" rx="10"/>
  <text class="d-title" x="445" y="256" text-anchor="middle">Journal d'audit</text>
  <text class="d-small" x="445" y="274" text-anchor="middle">audit_log, chaque écriture</text>
  <path class="d-line" d="M445 184V229" marker-end="url(#ese-arrow)"/>
  <text class="d-small" x="456" y="212">écrit</text>

  <!-- L'écart -->
  <text class="d-small" x="635" y="206" text-anchor="middle">ne s'applique pas aux</text>
  <text class="d-small" x="635" y="220" text-anchor="middle">décisions de validation (C2)</text>

  <!-- Numéros des mécanismes, comme dans « En bref » -->
  <circle class="d-solid" cx="140" cy="14" r="10"/><text class="d-white" x="140" y="18.5" text-anchor="middle">1</text>
  <circle class="d-solid" cx="160" cy="124" r="10"/><text class="d-white" x="160" y="128.5" text-anchor="middle">2</text>
  <circle class="d-solid" cx="360" cy="124" r="10"/><text class="d-white" x="360" y="128.5" text-anchor="middle">3</text>
  <circle class="d-solid" cx="560" cy="124" r="10"/><text class="d-white" x="560" y="128.5" text-anchor="middle">4</text>
  <circle class="d-solid" cx="345" cy="232" r="10"/><text class="d-white" x="345" y="236.5" text-anchor="middle">5</text>
</svg>
