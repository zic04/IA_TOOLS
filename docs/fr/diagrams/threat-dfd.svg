<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flux de données et frontières de confiance qu'ils traversent : navigateur vers application, application vers base de données, application vers le fournisseur de paiement">
  <defs>
    <marker id="td-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="d-box" x="30" y="130" width="160" height="60" rx="8"/>
  <text class="d-title" x="110" y="156" text-anchor="middle">Navigateur</text>
  <text class="d-small" x="110" y="174" text-anchor="middle">cookie de session</text>

  <line class="d-dashed" x1="230" y1="20" x2="230" y2="340"/>
  <text class="d-small" x="238" y="34">Frontière 1</text>

  <rect class="d-brand" x="330" y="130" width="200" height="60" rx="10"/>
  <text class="d-title" x="430" y="156" text-anchor="middle">Application</text>
  <text class="d-small" x="430" y="174" text-anchor="middle">serveur Next.js</text>

  <line class="d-dashed" x1="650" y1="20" x2="650" y2="340"/>
  <text class="d-small" x="658" y="34">Frontière 2</text>

  <rect class="d-info" x="710" y="60" width="160" height="60" rx="8"/>
  <text class="d-title" x="790" y="86" text-anchor="middle">Base de données</text>
  <text class="d-small" x="790" y="104" text-anchor="middle">sécurité au niveau ligne</text>

  <rect class="d-info" x="710" y="200" width="160" height="60" rx="8"/>
  <text class="d-title" x="790" y="226" text-anchor="middle">Fournisseur de paiement</text>
  <text class="d-small" x="790" y="244" text-anchor="middle">jetons de carte seulement</text>

  <path class="d-line-brand" d="M190 160H327" marker-end="url(#td-arrow)"/>
  <path class="d-line" d="M530 145L707 95" marker-end="url(#td-arrow)"/>
  <path class="d-line" d="M530 175L707 225" marker-end="url(#td-arrow)"/>
</svg>
