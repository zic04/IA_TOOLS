<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les quatre niveaux de maturité, chacun construit sur le précédent">
  <rect class="d-box-2" x="20" y="170" width="200" height="60" rx="8"/>
  <text class="d-title" x="120" y="196" text-anchor="middle">1 · Squelette</text>
  <text class="d-small" x="120" y="216" text-anchor="middle">build OK ; sections entamées</text>
  <rect class="d-box" x="240" y="125" width="200" height="105" rx="8"/>
  <text class="d-title" x="340" y="151" text-anchor="middle">2 · Utilisateur</text>
  <text class="d-small" x="340" y="171" text-anchor="middle">chaque écran trouvé,</text>
  <text class="d-small" x="340" y="188" text-anchor="middle">annoté</text>
  <rect class="d-brand" x="460" y="80" width="200" height="150" rx="8"/>
  <text class="d-title" x="560" y="106" text-anchor="middle">3 · Complet</text>
  <text class="d-small" x="560" y="126" text-anchor="middle">écrit, couvert, typé,</text>
  <text class="d-small" x="560" y="143" text-anchor="middle">conforme ; build strict</text>
  <rect class="d-solid" x="680" y="35" width="200" height="195" rx="8"/>
  <text class="d-white" x="780" y="61" text-anchor="middle">4 · Reprise</text>
  <text class="d-white" x="780" y="83" text-anchor="middle">architecture, parcours,</text>
  <text class="d-white" x="780" y="103" text-anchor="middle">diagnostic,</text>
  <text class="d-white" x="780" y="123" text-anchor="middle">constats, preuves</text>
  <text class="d-small" x="20" y="30">Un niveau est atteint quand ses critères</text>
  <text class="d-small" x="20" y="48">et ceux de tous les niveaux inférieurs sont remplis.</text>
</svg>
