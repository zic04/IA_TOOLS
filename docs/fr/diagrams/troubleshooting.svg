<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Du code de sortie à la première vérification et à la sous-page">
  <defs>
    <marker id="tr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="d-arrow" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="d-solid" x="20" y="95" width="150" height="60" rx="10"/>
  <text class="d-white" x="95" y="122" text-anchor="middle">Une commande</text>
  <text class="d-white" x="95" y="142" text-anchor="middle">a échoué</text>

  <rect class="d-warn" x="230" y="20" width="300" height="62" rx="8"/>
  <text class="d-title" x="380" y="45" text-anchor="middle">Code de sortie 1 : contenu</text>
  <text class="d-small" x="380" y="66" text-anchor="middle">une page, un lien, une légende, une capture</text>
  <rect class="d-info" x="230" y="94" width="300" height="62" rx="8"/>
  <text class="d-title" x="380" y="119" text-anchor="middle">Code de sortie 2 : usage</text>
  <text class="d-small" x="380" y="140" text-anchor="middle">une option, une clé, un plan</text>
  <rect class="d-danger" x="230" y="168" width="300" height="62" rx="8"/>
  <text class="d-title" x="380" y="193" text-anchor="middle">Code de sortie 3 : environnement</text>
  <text class="d-small" x="380" y="214" text-anchor="middle">kit, navigateur, application, session</text>

  <rect class="d-box" x="570" y="20" width="310" height="62" rx="8"/>
  <text class="d-title" x="725" y="45" text-anchor="middle">doc-kit build --draft</text>
  <text class="d-small" x="725" y="66" text-anchor="middle">puis : Problèmes de build et de rédaction</text>
  <rect class="d-box" x="570" y="94" width="310" height="62" rx="8"/>
  <text class="d-title" x="725" y="119" text-anchor="middle">la ligne → du message</text>
  <text class="d-small" x="725" y="140" text-anchor="middle">puis : Configuration, Ligne de commande</text>
  <rect class="d-box" x="570" y="168" width="310" height="62" rx="8"/>
  <text class="d-title" x="725" y="193" text-anchor="middle">doc-kit doctor</text>
  <text class="d-small" x="725" y="214" text-anchor="middle">puis : Problèmes de capture et de session</text>

  <path class="d-line" d="M170 115L226 51" marker-end="url(#tr-arrow)"/>
  <path class="d-line" d="M170 125H226" marker-end="url(#tr-arrow)"/>
  <path class="d-line" d="M170 135L226 199" marker-end="url(#tr-arrow)"/>
  <path class="d-line" d="M530 51H566" marker-end="url(#tr-arrow)"/>
  <path class="d-line" d="M530 125H566" marker-end="url(#tr-arrow)"/>
  <path class="d-line" d="M530 199H566" marker-end="url(#tr-arrow)"/>
</svg>
