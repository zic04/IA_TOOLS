<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Acme Orders en production : l'application conteneur, ses données derrière des points d'accès privés, les tâches planifiées et les services hors du groupe de ressources, avec les douze flux numérotés">
  <defs>
    <marker id="ear-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ear-arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow-brand" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <!-- Hors du groupe, en haut -->
  <rect class="d-box" x="165" y="10" width="190" height="50" rx="8"/>
  <text class="d-title" x="260" y="31" text-anchor="middle">Relais de messagerie</text>
  <text class="d-small" x="260" y="49" text-anchor="middle">SMTP, organisation</text>
  <rect class="d-box" x="370" y="10" width="205" height="50" rx="8"/>
  <text class="d-title" x="472.5" y="31" text-anchor="middle">Fournisseur d'identité</text>
  <text class="d-small" x="472.5" y="49" text-anchor="middle">OIDC, équipe identité</text>
  <rect class="d-box" x="590" y="10" width="185" height="50" rx="8"/>
  <text class="d-title" x="682.5" y="31" text-anchor="middle">Registre d'images</text>
  <text class="d-small" x="682.5" y="49" text-anchor="middle">équipe plateforme</text>

  <!-- Le groupe de ressources -->
  <rect class="d-box-2" x="200" y="90" width="510" height="360" rx="14"/>
  <text class="d-small" x="215" y="420">Points d'accès privés : flux 5, 6 et 7</text>
  <text class="d-small" x="215" y="438">Groupe de ressources rg-acme-orders-prd</text>

  <!-- Application conteneur -->
  <rect class="d-brand" x="220" y="120" width="230" height="120" rx="10"/>
  <text class="d-title" x="335" y="168" text-anchor="middle">Application conteneur</text>
  <text class="d-small" x="335" y="188" text-anchor="middle">acme-orders-prd-app</text>
  <text class="d-small" x="335" y="206" text-anchor="middle">Serveur Next.js, 2 réplicas</text>

  <!-- Tâches planifiées -->
  <rect class="d-warn" x="212" y="290" width="126" height="60" rx="8"/>
  <text class="d-title" x="275" y="312" text-anchor="middle">Planificateur</text>
  <text class="d-small" x="275" y="328" text-anchor="middle">factures, retards</text>
  <text class="d-small" x="275" y="342" text-anchor="middle">et archivage</text>
  <rect class="d-danger" x="346" y="290" width="104" height="60" rx="8"/>
  <text class="d-title" x="398" y="312" text-anchor="middle">Relances</text>
  <text class="d-small" x="398" y="328" text-anchor="middle">déclencheur</text>
  <text class="d-small" x="398" y="342" text-anchor="middle">absent (C1)</text>

  <!-- Données, secrets, supervision -->
  <rect class="d-info" x="540" y="115" width="160" height="48" rx="8"/>
  <text class="d-title" x="620" y="135" text-anchor="middle">PostgreSQL</text>
  <text class="d-small" x="620" y="153" text-anchor="middle">commandes et audit</text>
  <rect class="d-info" x="540" y="175" width="160" height="48" rx="8"/>
  <text class="d-title" x="620" y="195" text-anchor="middle">Stockage</text>
  <text class="d-small" x="620" y="213" text-anchor="middle">PDF des factures</text>
  <rect class="d-violet" x="540" y="235" width="160" height="48" rx="8"/>
  <text class="d-title" x="620" y="255" text-anchor="middle">Coffre de secrets</text>
  <text class="d-small" x="620" y="273" text-anchor="middle">6 secrets</text>
  <rect class="d-box" x="540" y="295" width="160" height="48" rx="8"/>
  <text class="d-title" x="620" y="315" text-anchor="middle">Supervision</text>
  <text class="d-small" x="620" y="333" text-anchor="middle">journaux, télémétrie</text>
  <rect class="d-danger" x="540" y="380" width="160" height="48" rx="8"/>
  <text class="d-title" x="620" y="400" text-anchor="middle">Règle d'alerte</text>
  <text class="d-small" x="620" y="418" text-anchor="middle">tâches en échec (P4)</text>
  <path class="d-line" d="M620 343V377" marker-end="url(#ear-arrow)"/>

  <!-- Hors du groupe, à gauche et à droite -->
  <rect class="d-box" x="10" y="130" width="160" height="50" rx="8"/>
  <text class="d-title" x="90" y="151" text-anchor="middle">Utilisateurs</text>
  <text class="d-small" x="90" y="169" text-anchor="middle">navigateur, HTTPS</text>
  <rect class="d-box" x="10" y="250" width="160" height="50" rx="8"/>
  <text class="d-title" x="90" y="271" text-anchor="middle">Partenaires</text>
  <text class="d-small" x="90" y="289" text-anchor="middle">entrepôt, banque</text>
  <rect class="d-box" x="740" y="380" width="150" height="48" rx="8"/>
  <text class="d-title" x="815" y="400" text-anchor="middle">Exploitation</text>
  <text class="d-small" x="815" y="418" text-anchor="middle">boîte de l'équipe</text>

  <!-- Flux -->
  <path class="d-line-brand" d="M170 155H217" marker-end="url(#ear-arrow-brand)"/>
  <path class="d-line" d="M420 120L452 64" marker-end="url(#ear-arrow)"/>
  <path class="d-line" d="M335 120L310 64" marker-end="url(#ear-arrow)"/>
  <path class="d-line" d="M630 60L445 118" marker-end="url(#ear-arrow)"/>
  <path class="d-line" d="M450 139H537" marker-end="url(#ear-arrow)"/>
  <path class="d-line" d="M450 172L537 199" marker-end="url(#ear-arrow)"/>
  <path class="d-line" d="M450 205L537 259" marker-end="url(#ear-arrow)"/>
  <path class="d-line" d="M450 236L537 319" marker-end="url(#ear-arrow)"/>
  <path class="d-line" d="M300 290V243" marker-end="url(#ear-arrow)"/>
  <path class="d-dashed" d="M420 290V243" marker-end="url(#ear-arrow)"/>
  <path class="d-line-brand" d="M170 275L217 228" marker-end="url(#ear-arrow-brand)"/>
  <path class="d-dashed" d="M700 404H737" marker-end="url(#ear-arrow)"/>

  <!-- Numéros des flux (voir le tableau des flux) -->
  <circle class="d-solid" cx="194" cy="155" r="10"/><text class="d-white" x="194" y="159.5" text-anchor="middle">1</text>
  <circle class="d-solid" cx="436" cy="92" r="10"/><text class="d-white" x="436" y="96.5" text-anchor="middle">2</text>
  <circle class="d-solid" cx="322" cy="92" r="10"/><text class="d-white" x="322" y="96.5" text-anchor="middle">3</text>
  <circle class="d-solid" cx="537" cy="89" r="10"/><text class="d-white" x="537" y="93.5" text-anchor="middle">4</text>
  <circle class="d-solid" cx="494" cy="139" r="10"/><text class="d-white" x="494" y="143.5" text-anchor="middle">5</text>
  <circle class="d-solid" cx="494" cy="185" r="10"/><text class="d-white" x="494" y="189.5" text-anchor="middle">6</text>
  <circle class="d-solid" cx="494" cy="232" r="10"/><text class="d-white" x="494" y="236.5" text-anchor="middle">7</text>
  <circle class="d-solid" cx="494" cy="277" r="10"/><text class="d-white" x="494" y="281.5" text-anchor="middle">8</text>
  <circle class="d-solid" cx="300" cy="266" r="10"/><text class="d-white" x="300" y="270.5" text-anchor="middle">9</text>
  <circle class="d-solid" cx="420" cy="266" r="10"/><text class="d-white" x="420" y="270.5" text-anchor="middle">10</text>
  <circle class="d-solid" cx="194" cy="251" r="10"/><text class="d-white" x="194" y="255.5" text-anchor="middle">11</text>
  <circle class="d-solid" cx="719" cy="404" r="10"/><text class="d-white" x="719" y="408.5" text-anchor="middle">12</text>
</svg>
