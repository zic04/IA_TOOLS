<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Où agissent la lecture seule et les routes interdites pendant une capture">
  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="d-arrow" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="d-box" x="20" y="40" width="200" height="180" rx="10"/>
  <text class="d-title" x="120" y="66" text-anchor="middle">Entrée du plan</text>
  <text class="d-small" x="120" y="88" text-anchor="middle">route, actions, zones</text>
  <rect class="d-danger" x="35" y="120" width="170" height="78" rx="8"/>
  <text class="d-title" x="120" y="146" text-anchor="middle">capture.forbidden</text>
  <text class="d-small" x="120" y="166" text-anchor="middle">route concernée :</text>
  <text class="d-small" x="120" y="184" text-anchor="middle">jamais ouverte (code 1)</text>

  <rect class="d-box" x="300" y="40" width="250" height="180" rx="10"/>
  <text class="d-title" x="425" y="66" text-anchor="middle">Navigateur sans interface</text>
  <text class="d-small" x="425" y="88" text-anchor="middle">avec votre session</text>
  <rect class="d-brand" x="310" y="104" width="230" height="44" rx="8"/>
  <text class="d-text" x="425" y="131" text-anchor="middle">GET, HEAD, OPTIONS : envoyées</text>
  <rect class="d-warn" x="310" y="158" width="230" height="44" rx="8"/>
  <text class="d-text" x="425" y="185" text-anchor="middle">POST, PUT, DELETE… : annulées</text>

  <rect class="d-box" x="630" y="40" width="250" height="180" rx="10"/>
  <text class="d-title" x="755" y="66" text-anchor="middle">Serveur de l'application</text>
  <text class="d-small" x="755" y="88" text-anchor="middle">produit la page demandée</text>
  <rect class="d-danger" x="650" y="130" width="210" height="58" rx="8"/>
  <text class="d-text" x="755" y="155" text-anchor="middle">écrit pendant le rendu</text>
  <text class="d-small" x="755" y="175" text-anchor="middle">hors de portée du navigateur</text>

  <path class="d-line" d="M220 126H296" marker-end="url(#sf-arrow)"/>
  <text class="d-small" x="258" y="116" text-anchor="middle">ouvre</text>
  <path class="d-line" d="M540 126H626" marker-end="url(#sf-arrow)"/>
  <path class="d-dashed" d="M540 180H600"/>
  <text class="d-small" x="570" y="206" text-anchor="middle">bloquées</text>
  <text class="d-small" x="450" y="248" text-anchor="middle">La lecture seule bloque les écritures du navigateur ; seules les routes interdites empêchent celles du serveur sur un GET.</text>
</svg>
