# Azure Pipelines for doc-kit. Create a pipeline from this file (Pipelines › New pipeline › Existing YAML file).
#
# (a) The kit's own CI (below): unit, snapshot and end-to-end tests on Linux, Windows and macOS.
# (b) An example for a DOCUMENTATION PROJECT (commented, at the end of the file): build, check and audit the site,
#     then publish it as a pipeline artifact. It never captures: captures need a person who signs in, and a session
#     is a secret that does not belong in a pipeline. The images are committed with the content.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

strategy:
  matrix:
    linux_node20:
      imageName: ubuntu-latest
      nodeVersion: 20.x
    linux_node22:
      imageName: ubuntu-latest
      nodeVersion: 22.x
    windows_node20:
      imageName: windows-latest
      nodeVersion: 20.x
    macos_node20:
      imageName: macOS-latest
      nodeVersion: 20.x

pool:
  vmImage: $(imageName)

steps:
  - task: NodeTool@0
    displayName: Node $(nodeVersion)
    inputs:
      versionSpec: $(nodeVersion)

  - script: npm ci --ignore-scripts
    displayName: Install the kit's dependencies

  - script: npx playwright install --with-deps chromium
    displayName: Install Chromium for Playwright

  - script: npm test
    displayName: Unit and snapshot tests
    env:
      # Optional: the private list of terms that must never appear in the kit (alternatives separated by |), kept
      # in a secret pipeline variable. Without it, the neutrality test is skipped.
      DOC_KIT_FORBIDDEN_TERMS: $(DOC_KIT_FORBIDDEN_TERMS)

  - script: npm run test:e2e
    displayName: End-to-end tests (headless Chromium, demo app on a free port)

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# (b) Example for a documentation project — a pipeline of the APPLICATION's repository, which holds the
#     documentation in docs/manual/ (created by `doc-kit init`).
#
# The project depends on the kit through "doc-kit": "file:<path>" in docs/manual/package.json. With two checkouts,
# Azure Pipelines puts each repository in its own folder under $(Build.SourcesDirectory): the application in
# `<application repository name>/`, the kit in `doc-kit/`. docs/manual/package.json must then say
# "file:../../../doc-kit".
