# GitHub Actions for doc-kit. Copy this file to .github/workflows/ to use it.
#
# (a) The kit's own CI (below): unit, snapshot and end-to-end tests on Linux, Windows and macOS.
# (b) An example for a DOCUMENTATION PROJECT (commented, at the end of the file): build, check and audit the site,
#     then publish it as an artifact. It never captures: captures need a person who signs in, and a session is a
#     secret that does not belong in a pipeline. The images are committed with the content.

name: doc-kit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the kit's dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Unit and snapshot tests
        run: npm test
        env:
          # Optional: the private list of terms that must never appear in the kit (one regular expression per
          # alternative, separated by |). Without it, the neutrality test is skipped.
          DOC_KIT_FORBIDDEN_TERMS: ${{ secrets.DOC_KIT_FORBIDDEN_TERMS }}

      - name: End-to-end tests (headless Chromium, demo app on a free port)
        run: npm run test:e2e

# ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────
