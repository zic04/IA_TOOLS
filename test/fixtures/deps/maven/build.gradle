plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
}

ext {
    jacksonVersion = '2.16.1'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.2.1')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.14.0'
    api 'com.google.guava:guava:33.0.0-jre'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    runtimeOnly 'org.postgresql:postgresql:42.7.1'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'io.micrometer:micrometer-core:1.+'
    implementation project(':orders-model')
    implementation libs.spring.web
    implementation files('libs/legacy.jar')
    // implementation 'org.example:commented-out:1.0'
    /* testImplementation 'org.example:block-commented:1.0' */
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
    testImplementation('org.mockito:mockito-core:5.8.0') {
        exclude group: 'net.bytebuddy'
    }
    // a URL in a string is no comment
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' // http://example.com/x
}
