[project]
name = "acme-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["starlette>=0.40", "httpx>=0.27", "pyjwt>=2.8"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Pinned to what uv's own cache holds, so that --offline resolves without the network.
constraint-dependencies = ["fastapi==0.115.6", "starlette==0.41.3", "pydantic==2.10.4", "pydantic-core==2.27.2", "annotated-types==0.7.0", "typing-extensions==4.15.0", "anyio==4.13.0", "idna==3.20", "httpx==0.28.1", "httpcore==1.0.9", "h11==0.16.0", "certifi==2026.10.19", "pyjwt==2.9.0", "cryptography==45.0.7", "cffi==2.0.0", "pycparser==3.0", "openpyxl==3.1.5", "et-xmlfile==2.0.0", "pytest==8.3.4", "pluggy==1.6.0", "iniconfig==2.3.0", "packaging==26.2", "colorama==0.4.6", "click==8.4.1", "redis==5.2.1", "python-dateutil==2.9.0.post0", "six==1.17.0"]

[[tool.uv.index]]
name = "corp"
url = "https://pypi.corp.example/simple"
default = true
