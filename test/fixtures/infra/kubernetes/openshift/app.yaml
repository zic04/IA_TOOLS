apiVersion: v1
kind: List
items:
  - apiVersion: apps.openshift.io/v1
    kind: DeploymentConfig
    metadata:
      name: storefront
    spec:
      replicas: 2
      template:
        spec:
          containers:
            - name: web
              image: registry.example.test/shop/storefront:latest
              ports:
                - containerPort: 8080
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: storefront
    spec:
      to:
        kind: Service
        name: storefront
      tls:
        termination: edge
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: storefront-public
    spec:
      tls: []
      rules:
        - host: shop.example.test
---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: agents
parameters:
  - name: AGENT_KEY
    value: "template-value-never-kept"
objects:
  - apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: log-agent
    spec:
      template:
        spec:
          containers:
            - name: agent
              image: fluent/fluent-bit:3.0
              securityContext:
                runAsNonRoot: false
