apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: report
              image: ghcr.io/acme/report
              securityContext:
                privileged: true
          restartPolicy: OnFailure
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: shop-staging
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: production
spec:
  template:
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: seed
          image: ghcr.io/acme/seed:2.0.0
          securityContext:
            runAsUser: 1001
      restartPolicy: Never
