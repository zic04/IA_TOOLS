# The shop on one machine.
x-common: &common
  restart: unless-stopped

services:
  api:
    <<: *common
    build: ./api
    image: ghcr.io/acme/shop-api:1.4.2
    user: "1000:1000"
    ports:
      - "8080:80"
      - "127.0.0.1:9229:9229/tcp"
      - target: 443
        published: 8443
    environment:
      DATABASE_URL: "compose-value-never-kept"
      LOG_LEVEL: debug
    env_file: .env
    deploy:
      replicas: 2
  web:
    image: nginx:1.25-alpine
    user: root
    ports: ["80"]
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=compose-password-never-kept
      - POSTGRES_DB
    volumes:
      - db-data:/var/lib/postgresql/data
  worker:
    build:
      context: ./worker
    privileged: true
  # mailer:
  #   image: mailhog/mailhog-commented-out-never-read

volumes:
  db-data:
networks:
  front:
  back:
    driver: bridge
secrets:
  db_password:
    file: ./secrets/db_password.txt
configs:
  nginx_conf:
    file: ./nginx.conf
