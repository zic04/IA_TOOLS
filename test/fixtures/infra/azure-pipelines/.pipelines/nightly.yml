schedules:
  - cron: "30 1 * * 1-5"
    displayName: Weekdays
    always: true

variables:
  REPORT_BUCKET: shop-reports
  API_KEY: do-not-keep-api

jobs:
  - job: Report
    container:
      image: python:3.12-slim
    steps:
      - script: python report.py
  - deployment: Publish
    environment:
      name: qa.reports
    strategy:
      runOnce:
        deploy:
          steps:
            - script: ./publish.sh
