e (\u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span>) ; la recherche ne restreint rien de plus.\u003c/p>\n\u003c/dd>\u003c/div>\u003c/dl>\u003c/div>\u003cdiv class=\"comportement\" data-kind=\"filter\">\u003cdiv class=\"comportement-tete\">\u003cspan class=\"comportement-glyphe\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 5h16l-6 7.5V19l-4 2v-8.5L4 5Z\"/>\u003c/svg>\u003c/span>\u003cdiv class=\"comportement-nom\">\u003cspan class=\"comportement-type\">B-02 · Filtre\u003c/span>\u003ch3 id=\"b-02\">Filtrer par statut et par date\u003ca class=\"ancre\" href=\"#/features/track-orders~b-02\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003c/div>\u003cspan class=\"comportement-bilan\">\u003cspan class=\"pastille-etat renseignee\">8 rubriques renseignées\u003c/span>\u003c/span>\u003c/div>\u003cdl class=\"rubriques\">\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Critères\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>\u003cstrong>Status\u003c/strong> : All, Open, Shipped ou Cancelled, comparé tel quel ; \u003cstrong>Date\u003c/strong> : un jour, jamais une période.\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Combinaison\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>les critères s&#39;additionnent (toutes les conditions à la fois), entre eux et avec la recherche par client.\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Par défaut\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>\u003cstrong>All\u003c/strong> et aucune date : toutes les commandes sont affichées.\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Déclenchement\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>dès qu&#39;une valeur change.\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Remise à zéro\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>choisir \u003cstrong>All\u003c/strong> et effacer la date ; il n&#39;y a pas de bouton pour cela.\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Conservation\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>non : les filtres sont perdus quand on quitte la page.\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Effet\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>les trois chiffres au-dessus de la liste suivent les filtres (\u003ca class=\"puce regle\" href=\"#/features/rules~br-03\" title=\"Les chiffres du jour suivent les filtres en cours\">BR-03\u003c/a>).\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Aucun résultat\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>le tableau reste vide, sans message.\u003c/p>\n\u003c/dd>\u003c/div>\u003c/dl>\u003c/div>\u003ch2 id=\"regles-de-gestion\">Règles de gestion\u003ca class=\"ancre\" href=\"#/features/track-orders~regles-de-gestion\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ca class=\"puce regle\" href=\"#/features/rules~br-01\" title=\"Une commande est Ouverte, Expédiée ou Annulée\">BR-01\u003c/a> limite un statut à trois valeurs ; \u003ca class=\"puce regle\" href=\"#/features/rules~br-03\" title=\"Les chiffres du jour suivent les filtres en cours\">BR-03\u003c/a> régit les chiffres au-dessus du tableau.\u003c/p>\n\u003ch2 id=\"messages\">Messages\u003ca class=\"ancre\" href=\"#/features/track-orders~messages\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Sans objet — la liste n&#39;affiche aucun message propre : un résultat vide laisse le tableau vide et les chiffres à 0.\u003c/p>\n\u003ch2 id=\"droits-par-action\">Droits par action\u003ca class=\"ancre\" href=\"#/features/track-orders~droits-par-action\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Action\u003c/th>\n\u003cth>Droit\u003c/th>\n\u003cth>Condition\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Voir la liste, rechercher et filtrer\u003c/td>\n\u003ctd>\u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span>\u003c/td>\n\u003ctd>Connecté ; une personne non connectée est renvoyée vers la page de connexion\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ouvrir une commande\u003c/td>\n\u003ctd>\u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"criteres-d-acceptation\">Critères d&#39;acceptation\u003ca class=\"ancre\" href=\"#/features/track-orders~criteres-d-acceptation\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"scenario\">\u003cdiv class=\"scenario-tete\">\u003cspan class=\"scenario-n\" aria-hidden=\"true\">1\u003c/span>\u003cp class=\"scenario-titre\">Une partie du nom d'un client\u003c/p>\u003cspan class=\"scenario-liens\">\u003ca class=\"puce lien-recit\" href=\"#/features/track-orders~us-02\" title=\"Retrouver les commandes d'un client\">US-02\u003c/a>\u003ca class=\"puce lien-comportement\" href=\"#/features/track-orders~b-01\" title=\"Trouver une commande par client\">B-01\u003c/a>\u003c/span>\u003c/div>\u003cul class=\"gherkin\">\u003cli class=\"soit\">\u003cspan class=\"mot\">Soit\u003c/span>\u003cspan class=\"pas\">les commandes de « Northwind Bistro » (#1041 et #1045)\u003c/span>\u003c/li>\u003cli class=\"quand\">\u003cspan class=\"mot\">Quand\u003c/span>\u003cspan class=\"pas\">je saisis « north » dans \u003cstrong>Customer\u003c/strong>\u003c/span>\u003c/li>\u003cli class=\"alors\">\u003cspan class=\"mot\">Alors\u003c/span>\u003cspan class=\"pas\">il ne reste que les commandes #1041 et #1045\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"scenario\">\u003cdiv class=\"scenario-tete\">\u003cspan class=\"scenario-n\" aria-hidden=\"true\">2\u003c/span>\u003cp class=\"scenario-titre\">Les accents comptent\u003c/p>\u003cspan class=\"scenario-liens\">\u003ca class=\"puce lien-recit\" href=\"#/features/track-orders~us-02\" title=\"Retrouver les commandes d'un client\">US-02\u003c/a>\u003ca class=\"puce lien-comportement\" href=\"#/features/track-orders~b-01\" title=\"Trouver une commande par client\">B-01\u003c/a>\u003c/span>\u003c/div>\u003cul class=\"gherkin\">\u003cli class=\"soit\">\u003cspan class=\"mot\">Soit\u003c/span>\u003cspan class=\"pas\">la commande de « Blue Harbor Café » (#1042)\u003c/span>\u003c/li>\u003cli class=\"quand\">\u003cspan class=\"mot\">Quand\u003c/span>\u003cspan class=\"pas\">je saisis « cafe » dans \u003cstrong>Customer\u003c/strong>\u003c/span>\u003c/li>\u003cli class=\"alors\">\u003cspan class=\"mot\">Alors\u003c/span>\u003cspan class=\"pas\">aucune commande n&#39;est affichée\u003c/span>\u003c/li>\u003cli class=\"et\">\u003cspan class=\"mot\">Et\u003c/span>\u003cspan class=\"pas\">les trois chiffres affichent 0\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"scenario\">\u003cdiv class=\"scenario-tete\">\u003cspan class=\"scenario-n\" aria-hidden=\"true\">3\u003c/span>\u003cp class=\"scenario-titre\">Statut et date ensemble\u003c/p>\u003cspan class=\"scenario-liens\">\u003ca class=\"puce lien-recit\" href=\"#/features/track-orders~us-01\" title=\"Filtrer par statut\">US-01\u003c/a>\u003ca class=\"puce lien-comportement\" href=\"#/features/track-orders~b-02\" title=\"Filtrer par statut et par date\">B-02\u003c/a>\u003c/span>\u003c/div>\u003cul class=\"gherkin\">\u003cli class=\"soit\">\u003cspan class=\"mot\">Soit\u003c/span>\u003cspan class=\"pas\">trois commandes ouvertes, dont deux du 15 janvier 2026\u003c/span>\u003c/li>\u003cli class=\"quand\">\u003cspan class=\"mot\">Quand\u003c/span>\u003cspan class=\"pas\">je choisis le \u003cstrong>Status\u003c/strong> « Open » et la date du 15 janvier 2026\u003c/span>\u003c/li>\u003cli class=\"alors\">\u003cspan class=\"mot\">Alors\u003c/span>\u003cspan class=\"pas\">il reste deux lignes : #1041 et #1042\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"scenario\">\u003cdiv class=\"scenario-tete\">\u003cspan class=\"scenario-n\" aria-hidden=\"true\">4\u003c/span>\u003cp class=\"scenario-titre\">Les chiffres suivent le filtre\u003c/p>\u003cspan class=\"scenario-liens\">\u003ca class=\"puce lien-recit\" href=\"#/features/track-orders~us-03\" title=\"Lire les chiffres de ce que je vois\">US-03\u003c/a>\u003ca class=\"puce lien-comportement\" href=\"#/features/track-orders~b-02\" title=\"Filtrer par statut et par date\">B-02\u003c/a>\u003c/span>\u003c/div>\u003cul class=\"gherkin\">\u003cli class=\"soit\">\u003cspan class=\"mot\">Soit\u003c/span>\u003cspan class=\"pas\">le \u003cstrong>Status\u003c/strong> « Shipped »\u003c/span>\u003c/li>\u003cli class=\"alors\">\u003cspan class=\"mot\">Alors\u003c/span>\u003cspan class=\"pas\">\u003cstrong>orders\u003c/strong> affiche 2 et \u003cstrong>total\u003c/strong> affiche 3 600,00 $\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003ch2 id=\"limites\">Limites\u003ca class=\"ancre\" href=\"#/features/track-orders~limites\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>Les filtres ne sont conservés nulle part une fois la page quittée : en revenant à la liste, on repart de \u003cstrong>All\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"questions-ouvertes\">Questions ouvertes\u003ca class=\"ancre\" href=\"#/features/track-orders~questions-ouvertes\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Que voit un membre de l&#39;équipe quand les commandes ne peuvent pas être chargées ?\u003c/strong> Le product owner.\u003c/li>\n\u003c/ul>\n","toc":[{"id":"a-quoi-ca-sert","title":"À quoi ça sert","level":2},{"id":"qui-l-utilise","title":"Qui l'utilise","level":2},{"id":"user-stories","title":"User stories","level":2},{"id":"us-01","title":"US-01 · Filtrer par statut","level":3},{"id":"us-02","title":"US-02 · Retrouver les commandes d'un client","level":3},{"id":"us-03","title":"US-03 · Lire les chiffres de ce que je vois","level":3},{"id":"parcours-principal","title":"Parcours principal","level":2},{"id":"comportements","title":"Comportements","level":2},{"id":"b-01","title":"Trouver une commande par client","level":3},{"id":"b-02","title":"Filtrer par statut et par date","level":3},{"id":"regles-de-gestion","title":"Règles de gestion","level":2},{"id":"messages","title":"Messages","level":2},{"id":"droits-par-action","title":"Droits par action","level":2},{"id":"criteres-d-acceptation","title":"Critères d'acceptation","level":2},{"id":"limites","title":"Limites","level":2},{"id":"questions-ouvertes","title":"Questions ouvertes","level":2}],"captures":0,"space":"product","verified":{"version":"1.4.0","date":"2026-10-02"}},"features/approve-order":{"id":"features/approve-order","title":"Approuver une commande","menuTitle":"Approuver une commande","summary":"Ouvrir la chaîne d'approbation d'une commande pour que les approbateurs soient prévenus.","section":"features","group":"Approuver une commande","level":1,"routes":[],"permissions":["orders:read","orders:approve"],"html":"\u003ch2 id=\"a-quoi-ca-sert\">À quoi ça sert\u003ca class=\"ancre\" href=\"#/features/approve-order~a-quoi-ca-sert\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003cstrong>Approuver une commande\u003c/strong> donne à chaque commande une piste d&#39;approbation : le lien \u003cstrong>Approval chain\u003c/strong> sur la page d&#39;une commande. La première fois que quelqu&#39;un l&#39;ouvre, Acme Orders crée la chaîne et prévient les approbateurs ; l&#39;ouvrir de nouveau ne fait que l&#39;afficher.\u003c/p>\n\u003ch2 id=\"qui-l-utilise\">Qui l&#39;utilise\u003ca class=\"ancre\" href=\"#/features/approve-order~qui-l-utilise\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Rôle\u003c/th>\n\u003cth>Ce qu&#39;il en fait\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Membre de l&#39;équipe\u003c/strong>\u003c/td>\n\u003ctd>Ouvre une commande et suit son lien \u003cstrong>Approval chain\u003c/strong>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"user-stories\">User stories\u003ca class=\"ancre\" href=\"#/features/approve-order~user-stories\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"recit\">\u003cdiv class=\"recit-tete\">\u003ch3 id=\"us-04\">US-04 · Lancer l'approbation d'une commande\u003ca class=\"ancre\" href=\"#/features/approve-order~us-04\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003cspan class=\"recit-etiquettes\">\u003cspan class=\"puce role\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"8\" r=\"4\"/>\u003cpath d=\"M4 21a8 8 0 0 1 16 0\"/>\u003c/svg>Membre de l'équipe\u003c/span>\u003cspan class=\"puce version\">depuis 1.0\u003c/span>\u003cspan class=\"puce criteres\">2 critères\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"recit-corps\">\u003cp>En tant que \u003cstrong>membre de l&#39;équipe\u003c/strong>, je veux ouvrir la chaîne d&#39;approbation d&#39;une commande afin que ses approbateurs soient prévenus qu&#39;elle les attend.\u003c/p>\n\u003c/div>\u003c/div>\u003ch2 id=\"parcours-principal\">Parcours principal\u003ca class=\"ancre\" href=\"#/features/approve-order~parcours-principal\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003col class=\"etapes\">\n\u003cli>Un \u003cstrong>membre de l&#39;équipe\u003c/strong> ouvre \u003ca href=\"#/use/orders/detail\">le détail d&#39;une commande\u003c/a>.\u003c/li>\n\u003cli>Il suit le lien \u003cstrong>Approval chain\u003c/strong>.\u003c/li>\n\u003cli>Acme Orders crée la chaîne de cette commande et prévient les approbateurs (\u003ca class=\"puce regle\" href=\"#/features/rules~br-02\" title=\"Ouvrir la chaîne d'approbation d'une commande la crée\">BR-02\u003c/a>).\u003c/li>\n\u003cli>Le membre de l&#39;équipe voit la chaîne ; une visite ultérieure affiche la même chaîne, inchangée.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"comportements\">Comportements\u003ca class=\"ancre\" href=\"#/features/approve-order~comportements\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"comportement\" data-kind=\"notification\">\u003cdiv class=\"comportement-tete\">\u003cspan class=\"comportement-glyphe\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9Z\"/>\u003cpath d=\"M10.3 21a1.9 1.9 0 0 0 3.4 0\"/>\u003c/svg>\u003c/span>\u003cdiv class=\"comportement-nom\">\u003cspan class=\"comportement-type\">B-03 · Notification\u003c/span>\u003ch3 id=\"b-03\">Prévenir les approbateurs\u003ca class=\"ancre\" href=\"#/features/approve-order~b-03\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003c/div>\u003cspan class=\"comportement-bilan\">\u003cspan class=\"pastille-etat renseignee\">3 rubriques renseignées\u003c/span>\u003cspan class=\"pastille-etat a-confirmer\">2 à confirmer\u003c/span>\u003c/span>\u003c/div>\u003cdl class=\"rubriques\">\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Événement déclencheur\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>la première ouverture du lien \u003cstrong>Approval chain\u003c/strong> d&#39;une commande (\u003ca class=\"puce regle\" href=\"#/features/rules~br-02\" title=\"Ouvrir la chaîne d'approbation d'une commande la crée\">BR-02\u003c/a>).\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Destinataires\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>les approbateurs de la commande.\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique a-confirmer\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.3-2.5 2.3M12 16.5h.01\"/>\u003c/svg>Canal\u003cspan class=\"sr-only\"> (à confirmer)\u003c/span>\u003c/dt>\u003cdd>\u003cp>inconnu — l&#39;application n&#39;indique pas comment les approbateurs sont prévenus.\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique a-confirmer\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.3-2.5 2.3M12 16.5h.01\"/>\u003c/svg>Contenu\u003cspan class=\"sr-only\"> (à confirmer)\u003c/span>\u003c/dt>\u003cdd>\u003cp>inconnu — que dit la notification, et renvoie-t-elle vers la commande ?\u003c/p>\n\u003c/dd>\u003c/div>\u003cdiv class=\"rubrique renseignee\">\u003cdt>\u003csvg class=\"ico etat\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/>\u003c/svg>Délai\u003cspan class=\"sr-only\"> (renseignée)\u003c/span>\u003c/dt>\u003cdd>\u003cp>immédiat, à la création de la chaîne ; rouvrir le lien n&#39;envoie rien.\u003c/p>\n\u003c/dd>\u003c/div>\u003c/dl>\u003c/div>\u003ch2 id=\"regles-de-gestion\">Règles de gestion\u003ca class=\"ancre\" href=\"#/features/approve-order~regles-de-gestion\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ca class=\"puce regle\" href=\"#/features/rules~br-02\" title=\"Ouvrir la chaîne d'approbation d'une commande la crée\">BR-02\u003c/a> est l&#39;unique règle que cette fonctionnalité existe pour appliquer.\u003c/p>\n\u003ch2 id=\"messages\">Messages\u003ca class=\"ancre\" href=\"#/features/approve-order~messages\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Message\u003c/th>\n\u003cth>Quand il apparaît\u003c/th>\n\u003cth>Que faire\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>« The approval chain of this order was created … »\u003c/td>\n\u003ctd>Sur la page \u003cstrong>Approval chain\u003c/strong>\u003c/td>\n\u003ctd>Rien : les approbateurs ont été prévenus\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"droits-par-action\">Droits par action\u003ca class=\"ancre\" href=\"#/features/approve-order~droits-par-action\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Action\u003c/th>\n\u003cth>Droit\u003c/th>\n\u003cth>Condition\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ouvrir la commande\u003c/td>\n\u003ctd>\u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span>\u003c/td>\n\u003ctd>Connecté\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ouvrir son \u003cstrong>Approval chain\u003c/strong>\u003c/td>\n\u003ctd>\u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:approve\u003c/span>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"criteres-d-acceptation\">Critères d&#39;acceptation\u003ca class=\"ancre\" href=\"#/features/approve-order~criteres-d-acceptation\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"scenario\">\u003cdiv class=\"scenario-tete\">\u003cspan class=\"scenario-n\" aria-hidden=\"true\">1\u003c/span>\u003cp class=\"scenario-titre\">La première ouverture crée la chaîne\u003c/p>\u003cspan class=\"scenario-liens\">\u003ca class=\"puce lien-recit\" href=\"#/features/approve-order~us-04\" title=\"Lancer l'approbation d'une commande\">US-04\u003c/a>\u003ca class=\"puce lien-comportement\" href=\"#/features/approve-order~b-03\" title=\"Prévenir les approbateurs\">B-03\u003c/a>\u003c/span>\u003c/div>\u003cul class=\"gherkin\">\u003cli class=\"soit\">\u003cspan class=\"mot\">Soit\u003c/span>\u003cspan class=\"pas\">la commande #1041, sans chaîne d&#39;approbation pour l&#39;instant\u003c/span>\u003c/li>\u003cli class=\"quand\">\u003cspan class=\"mot\">Quand\u003c/span>\u003cspan class=\"pas\">un membre de l&#39;équipe suit son lien \u003cstrong>Approval chain\u003c/strong>\u003c/span>\u003c/li>\u003cli class=\"alors\">\u003cspan class=\"mot\">Alors\u003c/span>\u003cspan class=\"pas\">la chaîne est créée\u003c/span>\u003c/li>\u003cli class=\"et\">\u003cspan class=\"mot\">Et\u003c/span>\u003cspan class=\"pas\">les approbateurs sont prévenus\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"scenario\">\u003cdiv class=\"scenario-tete\">\u003cspan class=\"scenario-n\" aria-hidden=\"true\">2\u003c/span>\u003cp class=\"scenario-titre\">Une seconde ouverture ne change rien\u003c/p>\u003cspan class=\"scenario-liens\">\u003ca class=\"puce lien-recit\" href=\"#/features/approve-order~us-04\" title=\"Lancer l'approbation d'une commande\">US-04\u003c/a>\u003ca class=\"puce lien-comportement\" href=\"#/features/approve-order~b-03\" title=\"Prévenir les approbateurs\">B-03\u003c/a>\u003c/span>\u003c/div>\u003cul class=\"gherkin\">\u003cli class=\"soit\">\u003cspan class=\"mot\">Soit\u003c/span>\u003cspan class=\"pas\">la commande #1041, dont la chaîne existe déjà\u003c/span>\u003c/li>\u003cli class=\"quand\">\u003cspan class=\"mot\">Quand\u003c/span>\u003cspan class=\"pas\">un membre de l&#39;équipe suit de nouveau le lien\u003c/span>\u003c/li>\u003cli class=\"alors\">\u003cspan class=\"mot\">Alors\u003c/span>\u003cspan class=\"pas\">la même chaîne est affichée, et personne n&#39;est prévenu une seconde fois\u003c/span>\u003c/li>\u003c/ul>\u003c/div>\u003ch2 id=\"limites\">Limites\u003ca class=\"ancre\" href=\"#/features/approve-order~limites\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>Ouvrir le lien suffit : un simple coup d&#39;œil, l&#39;aperçu d&#39;un lien partagé ou un outil automatisé qui le suit crée aussi la chaîne et prévient les approbateurs, que ce soit voulu ou non (\u003ca href=\"#/secure/api-surface~les-routes\">la surface de l&#39;API\u003c/a> le décrit plus précisément pour l&#39;équipe de reprise).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"questions-ouvertes\">Questions ouvertes\u003ca class=\"ancre\" href=\"#/features/approve-order~questions-ouvertes\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Comment les approbateurs sont-ils prévenus, et que dit la notification ?\u003c/strong> Le product owner.\u003c/li>\n\u003c/ul>\n","toc":[{"id":"a-quoi-ca-sert","title":"À quoi ça sert","level":2},{"id":"qui-l-utilise","title":"Qui l'utilise","level":2},{"id":"user-stories","title":"User stories","level":2},{"id":"us-04","title":"US-04 · Lancer l'approbation d'une commande","level":3},{"id":"parcours-principal","title":"Parcours principal","level":2},{"id":"comportements","title":"Comportements","level":2},{"id":"b-03","title":"Prévenir les approbateurs","level":3},{"id":"regles-de-gestion","title":"Règles de gestion","level":2},{"id":"messages","title":"Messages","level":2},{"id":"droits-par-action","title":"Droits par action","level":2},{"id":"criteres-d-acceptation","title":"Critères d'acceptation","level":2},{"id":"limites","title":"Limites","level":2},{"id":"questions-ouvertes","title":"Questions ouvertes","level":2}],"captures":0,"space":"product","verified":{"version":"1.4.0","date":"2026-10-02"},"topic":[{"id":"secure/api-surface","anchor":"les-routes"}]},"features/rules":{"id":"features/rules","title":"Règles de gestion","menuTitle":"Règles de gestion","summary":"Les règles communes à plusieurs fonctionnalités, définies une fois et citées partout.","section":"features","group":"Règles et rôles","level":1,"routes":[],"permissions":[],"html":"\u003ch2 id=\"comment-lire-cette-page\">Comment lire cette page\u003ca class=\"ancre\" href=\"#/features/rules~comment-lire-cette-page\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Une règle est définie une seule fois, ici, car chacune des règles ci-dessous sert à plusieurs pages. Partout\nailleurs, elle est seulement citée, avec \u003ccode>[[rule BR-02]]\u003c/code>, jamais redéfinie. Une règle qui ne concernerait qu&#39;une\nseule fonctionnalité serait définie sur la fiche de cette fonctionnalité.\u003c/p>\n\u003ch2 id=\"les-regles\">Les règles\u003ca class=\"ancre\" href=\"#/features/rules~les-regles\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"regle\">\u003ch3 id=\"br-01\">BR-01 · Une commande est Ouverte, Expédiée ou Annulée\u003ca class=\"ancre\" href=\"#/features/rules~br-01\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003cp>Une commande porte exactement un des trois statuts, affiché sous forme de pastille colorée : \u003cstrong>Ouverte\u003c/strong>,\n\u003cstrong>Expédiée\u003c/strong> ou \u003cstrong>Annulée\u003c/strong>. Il n&#39;existe pas de quatrième statut dans cette version d&#39;Acme Orders.\u003c/p>\n\u003cp>\u003cstrong>Exemple.\u003c/strong> \u003cstrong>Étant donné\u003c/strong> la liste des commandes, \u003cstrong>quand\u003c/strong> vous filtrez par statut, \u003cstrong>alors\u003c/strong> les trois choix\nproposés sont \u003cstrong>Ouverte\u003c/strong>, \u003cstrong>Expédiée\u003c/strong> et \u003cstrong>Annulée\u003c/strong>, et rien d&#39;autre.\u003c/p>\n\u003c/div>\u003cdiv class=\"regle\">\u003ch3 id=\"br-02\">BR-02 · Ouvrir la chaîne d'approbation d'une commande la crée\u003ca class=\"ancre\" href=\"#/features/rules~br-02\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003cp>La chaîne d&#39;approbation d&#39;une commande n&#39;existe pas tant que personne ne l&#39;a ouverte pour la première fois. Ouvrir\nle lien \u003cstrong>Chaîne d&#39;approbation\u003c/strong>, quelle que soit la personne connectée, crée la chaîne et prévient les\napprobateurs, même pour un simple coup d&#39;œil.\u003c/p>\n\u003cp>\u003cstrong>Exemple.\u003c/strong> \u003cstrong>Étant donné\u003c/strong> une commande dont la page d&#39;approbation n&#39;a jamais été ouverte, \u003cstrong>quand\u003c/strong> quelqu&#39;un\nsuit le lien \u003cstrong>Chaîne d&#39;approbation\u003c/strong>, \u003cstrong>alors\u003c/strong> la chaîne est créée et les approbateurs sont prévenus, que ce\nsoit voulu ou non.\u003c/p>\n\u003c/div>\u003cdiv class=\"regle\">\u003ch3 id=\"br-03\">BR-03 · Les chiffres du jour suivent les filtres en cours\u003ca class=\"ancre\" href=\"#/features/rules~br-03\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003cp>Les trois chiffres au-dessus du tableau des commandes (\u003cstrong>commandes\u003c/strong>, \u003cstrong>ouvertes\u003c/strong>, \u003cstrong>total\u003c/strong>) sont calculés sur\nles commandes actuellement affichées, une fois les filtres de statut, de client et de date appliqués, et non sur\ntoutes les commandes qu&#39;Acme Orders contient.\u003c/p>\n\u003cp>\u003cstrong>Exemple.\u003c/strong> \u003cstrong>Étant donné\u003c/strong> six commandes dans la liste, \u003cstrong>quand\u003c/strong> vous filtrez le statut sur \u003cstrong>Ouverte\u003c/strong>,\n\u003cstrong>alors\u003c/strong> le chiffre \u003cstrong>total\u003c/strong> additionne seulement les commandes ouvertes affichées, pas les six.\u003c/p>\n\u003c/div>\u003ch2 id=\"les-regles-par-fonctionnalite\">Les règles par fonctionnalité\u003ca class=\"ancre\" href=\"#/features/rules~les-regles-par-fonctionnalite\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Id\u003c/th>\u003cth>Règle\u003c/th>\u003cth>Définie dans\u003c/th>\u003cth>Citée par\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#/features/rules~br-01\">BR-01\u003c/a>\u003c/td>\u003ctd>Une commande est Ouverte, Expédiée ou Annulée\u003c/td>\u003ctd>\u003ca href=\"#/features/rules\">Règles de gestion\u003c/a>\u003c/td>\u003ctd>F-01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/features/rules~br-02\">BR-02\u003c/a>\u003c/td>\u003ctd>Ouvrir la chaîne d'approbation d'une commande la crée\u003c/td>\u003ctd>\u003ca href=\"#/features/rules\">Règles de gestion\u003c/a>\u003c/td>\u003ctd>F-02, risks/findings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/features/rules~br-03\">BR-03\u003c/a>\u003c/td>\u003ctd>Les chiffres du jour suivent les filtres en cours\u003c/td>\u003ctd>\u003ca href=\"#/features/rules\">Règles de gestion\u003c/a>\u003c/td>\u003ctd>use/orders, F-01\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2 id=\"regles-retirees\">Règles retirées\u003ca class=\"ancre\" href=\"#/features/rules~regles-retirees\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Aucune pour l&#39;instant : Acme Orders n&#39;a retiré aucune règle de gestion depuis la rédaction de cette page.\u003c/p>\n","toc":[{"id":"comment-lire-cette-page","title":"Comment lire cette page","level":2},{"id":"les-regles","title":"Les règles","level":2},{"id":"br-01","title":"BR-01 · Une commande est Ouverte, Expédiée ou Annulée","level":3},{"id":"br-02","title":"BR-02 · Ouvrir la chaîne d'approbation d'une commande la crée","level":3},{"id":"br-03","title":"BR-03 · Les chiffres du jour suivent les filtres en cours","level":3},{"id":"les-regles-par-fonctionnalite","title":"Les règles par fonctionnalité","level":2},{"id":"regles-retirees","title":"Règles retirées","level":2}],"captures":0,"space":"product","verified":{"version":"1.4.0","date":"2026-10-02"}},"features/roles":{"id":"features/roles","title":"Rôles et droits","menuTitle":"Rôles et droits","summary":"Les rôles livrés avec Acme Orders, et qui peut faire quoi.","section":"features","group":"Règles et rôles","level":1,"routes":[],"permissions":[],"html":"\u003ch2 id=\"en-bref\">En bref\u003ca class=\"ancre\" href=\"#/features/roles~en-bref\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Les fiches fonctionnalité d&#39;Acme Orders décrivent deux rôles, \u003cstrong>Membre de l&#39;équipe\u003c/strong> et \u003cstrong>Approbateur\u003c/strong> : un membre\nde l&#39;équipe devient approbateur par addition de droits. La version de démonstration ci-dessous ne les vérifie pas\n(voir la note sous « Qui peut faire quoi ») ; une version de production appliquerait les droits nommés sur chaque\nfiche fonctionnalité.\u003c/p>\n\u003ch2 id=\"les-roles\">Les rôles\u003ca class=\"ancre\" href=\"#/features/roles~les-roles\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Membre de l&#39;équipe\u003c/strong> : se connecte et utilise \u003ca href=\"#/features/track-orders\">Suivre les commandes\u003c/a> : lit la liste, la\nfiltre, ouvre une commande.\u003c/li>\n\u003cli>\u003cstrong>Approbateur\u003c/strong> : tout ce que peut faire un membre de l&#39;équipe, plus \u003ca href=\"#/features/approve-order\">Approuver une commande\u003c/a> :\nouvrir la \u003cstrong>Chaîne d&#39;approbation\u003c/strong> d&#39;une commande.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"qui-peut-faire-quoi\">Qui peut faire quoi\u003ca class=\"ancre\" href=\"#/features/roles~qui-peut-faire-quoi\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fonctionnalité\u003c/th>\u003cth>orders:read\u003c/th>\u003cth>orders:approve\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#/features/track-orders\">Suivre les commandes\u003c/a>\u003c/td>\u003ctd>\u003cspan class=\"sr-only\">Autorisé\u003c/span>✔\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/features/approve-order\">Approuver une commande\u003c/a>\u003c/td>\u003ctd>\u003cspan class=\"sr-only\">Autorisé\u003c/span>✔\u003c/td>\u003ctd>\u003cspan class=\"sr-only\">Autorisé\u003c/span>✔\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"encadre note\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4M12 8h.01\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Non appliqué dans cette démo\u003c/div>\u003cp>Le tableau ci-dessus est le modèle visé. La version de démonstration vérifie seulement que quelqu&#39;un est\nconnecté, pas le rôle qu&#39;il détient : aujourd&#39;hui, toute personne connectée peut ouvrir une \u003cstrong>Chaîne\nd&#39;approbation\u003c/strong> (\u003ca href=\"#/secure/api-surface\">la surface de l&#39;API\u003c/a> décrit cet écart pour l&#39;équipe de reprise).\u003c/p>\n\u003c/div>\u003c/aside>\n\u003ch2 id=\"responsabilites\">Responsabilités\u003ca class=\"ancre\" href=\"#/features/roles~responsabilites\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders ne garde aucune trace de qui a approuvé quoi au-delà de la chaîne elle-même : la démo ne distingue pas\nla décision d&#39;un approbateur de celle de n&#39;importe qui ouvrant le même lien.\u003c/p>\n\u003ch2 id=\"comment-obtenir-un-role\">Comment obtenir un rôle\u003ca class=\"ancre\" href=\"#/features/roles~comment-obtenir-un-role\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Sans objet : cette démo n&#39;a pas d&#39;écran d&#39;administration des utilisateurs. N&#39;importe quelle adresse e-mail et\nn&#39;importe quel mot de passe connectent au même unique compte de démonstration.\u003c/p>\n","toc":[{"id":"en-bref","title":"En bref","level":2},{"id":"les-roles","title":"Les rôles","level":2},{"id":"qui-peut-faire-quoi","title":"Qui peut faire quoi","level":2},{"id":"responsabilites","title":"Responsabilités","level":2},{"id":"comment-obtenir-un-role","title":"Comment obtenir un rôle","level":2}],"captures":0,"space":"product","verified":{"version":"1.4.0","date":"2026-10-02"}},"secure/access-ownership":{"id":"secure/access-ownership","title":"Accès et propriété","menuTitle":"Accès et propriété","summary":"À qui appartiennent le dépôt, l'hébergement et le secret de session.","section":"operate","group":"Propriété et API","level":1,"routes":[],"permissions":[],"html":"\u003ch2 id=\"en-bref\">En bref\u003ca class=\"ancre\" href=\"#/secure/access-ownership~en-bref\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders est une démo : elle n&#39;a ni déploiement en production ni équipe identifiée. Le tableau ci-dessous montre\nà quoi ressemblerait une vraie passation de ce code, rempli dans la mesure où le code lui-même répond.\u003c/p>\n\u003ch2 id=\"qui-possede-quoi\">Qui possède quoi\u003ca class=\"ancre\" href=\"#/secure/access-ownership~qui-possede-quoi\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Actif\u003c/th>\n\u003cth>Propriétaire\u003c/th>\n\u003cth>Où\u003c/th>\n\u003cth>Comment le transmettre\u003c/th>\n\u003cth>Statut\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Dépôt\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Là où le dépôt de ce kit est cloné\u003c/td>\n\u003ctd>Transférer le dépôt ou ajouter un copropriétaire\u003c/td>\n\u003ctd>Propriétaire inconnu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hébergement\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Aucun : \u003ccode>node serve.mjs\u003c/code> ne tourne que sur une machine locale\u003c/td>\n\u003ctd>Sans objet, aucun hébergeur de production n&#39;existe\u003c/td>\n\u003ctd>Propriétaire inconnu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Jeton de session\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>En mémoire seulement (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:35\u003c/code>\u003c/span>), perdu à chaque redémarrage\u003c/td>\n\u003ctd>Rien à renouveler : il est aléatoire et jamais conservé\u003c/td>\n\u003ctd>Connu\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Données de démo (\u003ccode>data.json\u003c/code>)\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Versionnées avec le dépôt\u003c/td>\n\u003ctd>Modifier le fichier, ou appeler \u003ccode>POST /api/demo/reset\u003c/code>\u003c/td>\n\u003ctd>Connu\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"secrets-et-ou-ils-vivent\">Secrets et où ils vivent\u003ca class=\"ancre\" href=\"#/secure/access-ownership~secrets-et-ou-ils-vivent\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders ne détient aucun secret à renouveler : il n&#39;y a ni clé d&#39;API, ni mot de passe, ni clé de signature dans le\ncode. La seule valeur propre à une session est le jeton de session aléatoire (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:35\u003c/code>\u003c/span>), conservé\ndans une \u003ccode>Map\u003c/code> en mémoire du serveur et jamais écrit sur disque (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:21\u003c/code>\u003c/span>).\u003c/p>\n\u003ch2 id=\"proprietaires-inconnus\">Propriétaires inconnus\u003ca class=\"ancre\" href=\"#/secure/access-ownership~proprietaires-inconnus\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>Dépôt et hébergement : une démo n&#39;a pas d&#39;équipe à nommer ; un vrai déploiement indiquerait ici une personne ou une\néquipe, avant que le reste de cette page ait un sens.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"checklist-de-passation\">Checklist de passation\u003ca class=\"ancre\" href=\"#/secure/access-ownership~checklist-de-passation\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003col class=\"etapes\">\n\u003cli>\u003cstrong>Clonez le dépôt\u003c/strong> et lancez \u003ccode>node serve.mjs\u003c/code> pour vérifier qu&#39;il démarre toujours.\u003c/li>\n\u003cli>\u003cstrong>Décidez qui en est propriétaire\u003c/strong> : même une démo gagne à avoir un mainteneur nommé.\u003c/li>\n\u003cli>\u003cstrong>Lisez \u003ca href=\"#/secure/api-surface\">la surface de l&#39;API\u003c/a>\u003c/strong> avant de l&#39;exposer au-delà d&#39;une machine locale : aujourd&#39;hui,\nrien ne vérifie qui a le droit de faire quoi.\u003c/li>\n\u003c/ol>\n","toc":[{"id":"en-bref","title":"En bref","level":2},{"id":"qui-possede-quoi","title":"Qui possède quoi","level":2},{"id":"secrets-et-ou-ils-vivent","title":"Secrets et où ils vivent","level":2},{"id":"proprietaires-inconnus","title":"Propriétaires inconnus","level":2},{"id":"checklist-de-passation","title":"Checklist de passation","level":2}],"captures":0,"space":"admin","verified":{"version":"1.4.0","date":"2026-10-02"}},"maintain/architecture":{"id":"maintain/architecture","title":"L'architecture d'Acme Orders","menuTitle":"Architecture","summary":"Les trois blocs d'Acme Orders et la façon dont ils communiquent.","section":"maintain","group":"Technique","level":1,"routes":[],"permissions":[],"html":"\u003ch2 id=\"vue-d-ensemble\">Vue d&#39;ensemble\u003ca class=\"ancre\" href=\"#/maintain/architecture~vue-d-ensemble\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders se compose de trois blocs : le navigateur, l&#39;API et la base de données. L&#39;API REST relie les deux\npremiers.\u003c/p>\n\u003cfigure class=\"schema\">\u003csvg viewBox=\"0 0 900 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Le circuit d'une commande\">\n  \u003cdefs>\u003cmarker id=\"fl-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\">\u003cpath class=\"d-arrow\" d=\"M0 0 10 5 0 10z\"/>\u003c/marker>\u003c/defs>\n  \u003crect class=\"d-box\" x=\"20\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"130\" y=\"76\" text-anchor=\"middle\">Navigateur\u003c/text>\n  \u003ctext class=\"d-small\" x=\"130\" y=\"98\" text-anchor=\"middle\">application monopage\u003c/text>\n  \u003crect class=\"d-brand\" x=\"340\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"450\" y=\"76\" text-anchor=\"middle\">API des commandes\u003c/text>\n  \u003ctext class=\"d-text\" x=\"450\" y=\"98\" text-anchor=\"middle\">REST, JSON\u003c/text>\n  \u003crect class=\"d-info\" x=\"660\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"770\" y=\"86\" text-anchor=\"middle\">Base de données\u003c/text>\n  \u003cpath class=\"d-line\" d=\"M240 80H336\" marker-end=\"url(#fl-arrow)\"/>\n  \u003cpath class=\"d-line-brand\" d=\"M560 80H656\" marker-end=\"url(#fl-arrow)\"/>\n\u003c/svg>\u003cfigcaption>Le parcours d'une commande\u003c/figcaption>\u003c/figure>\u003caside class=\"encadre mecanisme\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Comment ça marche\u003c/div>\u003cp>Chaque requête du navigateur passe par l&#39;API, qui lit ou écrit dans la base de données.\u003c/p>\n\u003c/div>\u003c/aside>\n\u003ch2 id=\"le-lancer-en-local\">Le lancer en local\u003ca class=\"ancre\" href=\"#/maintain/architecture~le-lancer-en-local\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">npm ci\nnpm run dev\n\u003c/code>\u003c/pre>\n\u003caside class=\"encadre recette\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Vérifier l&#39;installation\u003c/div>\u003cp>Ouvrez \u003ccode>http:/\u003cwbr>/\u003cwbr>localhost:3000/\u003cwbr>api/\u003cwbr>v1/\u003cwbr>health\u003c/code> : la réponse doit être \u003ccode>ok\u003c/code>.\u003c/p>\n\u003c/div>\u003c/aside>\n","toc":[{"id":"vue-d-ensemble","title":"Vue d'ensemble","level":2},{"id":"le-lancer-en-local","title":"Le lancer en local","level":2}],"captures":0,"space":"develop","verified":{"version":"1.4.0","date":"2026-10-02"}},"secure/api-surface":{"id":"secure/api-surface","title":"La surface de l'API","menuTitle":"Surface de l'API","summary":"Chaque route, qui peut l'appeler, et les failles.","section":"secure","group":"Propriété et API","level":1,"routes":[],"permissions":[],"html":"\u003ch2 id=\"en-bref\">En bref\u003ca class=\"ancre\" href=\"#/secure/api-surface~en-bref\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders répond sur une douzaine de routes ; quatre d&#39;entre elles ne vérifient jamais qui les appelle. Il n&#39;y a\njamais qu&#39;un seul compte de démo, donc l&#39;isolation entre locataires ne s&#39;applique pas — mais l&#39;isolation entre rôles,\nelle, s&#39;applique, et rien ne la vérifie aujourd&#39;hui.\u003c/p>\n\u003ch2 id=\"les-routes\">Les routes\u003ca class=\"ancre\" href=\"#/secure/api-surface~les-routes\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>doc-kit facts --source api\u003c/code> ne trouve rien : Acme Orders répond par des comparaisons directes de chaînes sur le\nchemin de la requête (\u003ccode>serve.mjs\u003c/code>) plutôt que par un routeur que l&#39;adaptateur sait analyser ; le tableau ci-dessous a\ndonc été entièrement complété à la main à partir du code. Il n&#39;y a pas d&#39;isolation entre locataires à vérifier : la\ndémo n&#39;a qu&#39;un seul compte.\u003c/p>\n\u003cdiv class=\"tableau\" data-generated=\"facts\">\u003ctable data-generated=\"facts\">\u003ccaption>api · au 2026-10-21 · commit ddfb01e\u003c/caption>\u003cthead>\u003ctr>\u003cth>Méthode\u003c/th>\u003cth>Route\u003c/th>\u003cth>Fichier\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Méthode\u003c/th>\n\u003cth>Route\u003c/th>\n\u003cth>Authentification\u003c/th>\n\u003cth>Rôle\u003c/th>\n\u003cth>Preuve\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>Aucune\u003c/td>\n\u003ctd>Publique\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:41\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>Aucune\u003c/td>\n\u003ctd>Publique\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:33\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/api/me\u003c/code>\u003c/td>\n\u003ctd>Cookie de session\u003c/td>\n\u003ctd>Connecté\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:52\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/api/orders\u003c/code>\u003c/td>\n\u003ctd>Cookie de session\u003c/td>\n\u003ctd>Connecté\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:54\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/api/orders/[id]\u003c/code>\u003c/td>\n\u003ctd>Cookie de session\u003c/td>\n\u003ctd>Connecté\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:55\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003ccode>/api/settings\u003c/code>\u003c/td>\n\u003ctd>Cookie de session\u003c/td>\n\u003ctd>Connecté\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:49\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/orders/[id]/approval\u003c/code>\u003c/td>\n\u003ctd>Cookie de session\u003c/td>\n\u003ctd>Connecté — écrit à l&#39;affichage\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:59\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003ccode>/api/demo/reset\u003c/code>\u003c/td>\n\u003ctd>Aucune\u003c/td>\n\u003ctd>Publique\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:40\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"regles-d-acces-a-la-base-de-donnees\">Règles d&#39;accès à la base de données\u003ca class=\"ancre\" href=\"#/secure/api-surface~regles-d-acces-a-la-base-de-donnees\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\" data-generated=\"facts\">\u003ctable data-generated=\"facts\">\u003ccaption>db · au 2026-10-21 · commit ddfb01e\u003c/caption>\u003cthead>\u003ctr>\u003cth>Table\u003c/th>\u003cth>Sécurité au niveau ligne\u003c/th>\u003cth>Politiques\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Il n&#39;y a pas de base de données : Acme Orders garde tout dans un seul objet en mémoire, initialisé depuis\n\u003ccode>data.json\u003c/code> et abandonné au redémarrage (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:22\u003c/code>\u003c/span>). Aucune sécurité au niveau des lignes ne\ns&#39;applique, car aucune ligne ne survit à un redémarrage.\u003c/p>\n\u003ch2 id=\"routes-publiques\">Routes publiques\u003ca class=\"ancre\" href=\"#/secure/api-surface~routes-publiques\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Route\u003c/th>\n\u003cth>Pourquoi elle est publique\u003c/th>\n\u003cth>Preuve\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>GET\u003c/code>/\u003ccode>POST\u003c/code> \u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>La page de connexion elle-même\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:41\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET\u003c/code> \u003ccode>/style.css\u003c/code>, \u003ccode>/app.js\u003c/code>\u003c/td>\n\u003ctd>Ressources statiques, nécessaires avant la connexion\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:43\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST\u003c/code> \u003ccode>/api/demo/reset\u003c/code>\u003c/td>\n\u003ctd>Commodité pour \u003ccode>capture.setup\u003c/code> ; réinitialise les données de démo, rien de plus\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:40\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"manques\">Manques\u003ca class=\"ancre\" href=\"#/secure/api-surface~manques\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/risks/findings~c1-aucun-controle-d-acces\">C1\u003c/a> — le seul contrôle est « quelqu&#39;un est-il connecté »\n(\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:46\u003c/code>\u003c/span>) ; aucune route ne distingue \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span> de \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:approve\u003c/span>.\u003c/li>\n\u003cli>\u003ca href=\"#/risks/findings~i1-ouvrir-la-chaine-d-approbation-ecrit-lors-d-un-get\">I1\u003c/a> — \u003ccode>GET /orders/[id]/approval\u003c/code> écrit à\nl&#39;affichage (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:59\u003c/code>\u003c/span>), et la page d&#39;une commande la précharge automatiquement\n(\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>app.js:16\u003c/code>\u003c/span>).\u003c/li>\n\u003c/ul>\n","toc":[{"id":"en-bref","title":"En bref","level":2},{"id":"les-routes","title":"Les routes","level":2},{"id":"regles-d-acces-a-la-base-de-donnees","title":"Règles d'accès à la base de données","level":2},{"id":"routes-publiques","title":"Routes publiques","level":2},{"id":"manques","title":"Manques","level":2}],"captures":0,"space":"develop","verified":{"version":"1.4.0","date":"2026-10-02"},"topic":[{"id":"features/approve-order"}]},"risks/findings":{"id":"risks/findings","title":"Constats","menuTitle":"Constats","summary":"Trois constats, revérifiés dans le code : un critique, un important, un mineur.","section":"risks","group":"Constats","level":1,"routes":[],"permissions":[],"html":"\u003ch2 id=\"comment-lire-cette-page\">Comment lire cette page\u003ca class=\"ancre\" href=\"#/risks/findings~comment-lire-cette-page\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Voici la liste de travail de qui reprend Acme Orders : les écarts constatés dans la version 1.4.0, revérifiés\ndirectement dans \u003ccode>serve.mjs\u003c/code> et dans les fichiers de \u003ccode>public/\u003c/code>. Il n&#39;existe pas de déploiement en production : aucun\nconstat ici ne vient d&#39;ailleurs que du code.\u003c/p>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Gravité\u003c/th>\n\u003cth>Définition\u003c/th>\n\u003cth>Nombre\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Critique\u003c/strong>\u003c/td>\n\u003ctd>Un risque actuel pour la sécurité des données ou pour la promesse centrale du produit ; à traiter avant toute autre modification\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Important\u003c/strong>\u003c/td>\n\u003ctd>Un vrai défaut, un contournement possible ou une fonctionnalité cassée ; à planifier rapidement\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Mineur\u003c/strong>\u003c/td>\n\u003ctd>Dette, incohérence ou réglage sans effet ; à traiter au fil de l&#39;eau\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Les constats sont numérotés \u003cstrong>C\u003c/strong> (critique), \u003cstrong>I\u003c/strong> (important) et \u003cstrong>M\u003c/strong> (mineur). Un numéro ne change jamais : un\nnouveau constat prend le prochain numéro libre de sa famille.\u003c/p>\n\u003ch2 id=\"l-essentiel-en-une-minute\">L&#39;essentiel en une minute\u003ca class=\"ancre\" href=\"#/risks/findings~l-essentiel-en-une-minute\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003col class=\"etapes\">\n\u003cli>\u003cstrong>Ajoutez un contrôle de rôle\u003c/strong> : aujourd&#39;hui, toute personne connectée peut utiliser toutes les fonctionnalités d&#39;Acme Orders (C1).\u003c/li>\n\u003cli>\u003cstrong>Cessez d&#39;écrire lors d&#39;un GET\u003c/strong> : ouvrir un lien ne doit jamais créer de données (I1).\u003c/li>\n\u003cli>\u003cstrong>Branchez le réglage du thème, ou supprimez-le\u003c/strong> : il est enregistré mais n&#39;a aucun effet (M1).\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"constats\">Constats\u003ca class=\"ancre\" href=\"#/risks/findings~constats\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003ch3 id=\"c1-aucun-controle-d-acces\">C1 — Aucun contrôle d&#39;accès\u003ca class=\"ancre\" href=\"#/risks/findings~c1-aucun-controle-d-acces\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Constat\u003c/strong> : le seul contrôle avant toute action est « quelqu&#39;un est-il connecté » (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:46\u003c/code>\u003c/span>) ; rien\nne vérifie ce que cette personne a le droit de faire. \u003ca class=\"puce fonctionnalite\" href=\"#/features/approve-order\" title=\"Approuver une commande\">F-02\u003c/a> présente \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:approve\u003c/span> comme une\npermission distincte de \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span>, mais le serveur ne les distingue jamais.\u003c/p>\n\u003cp>\u003cstrong>Impact\u003c/strong> : toute personne connectée peut lire toutes les commandes, modifier le profil, et ouvrir — donc créer — la\nchaîne d&#39;approbation de n&#39;importe quelle commande. La page \u003ca href=\"#/features/roles\">rôles et permissions\u003c/a> décrit le modèle\nqu&#39;Acme Orders n&#39;applique pas encore.\u003c/p>\n\u003cp>\u003cstrong>Recommandation\u003c/strong> : rattacher un rôle à chaque session (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:36\u003c/code>\u003c/span>) et le vérifier avant chaque\naction, en commençant par \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:approve\u003c/span>.\u003c/p>\n\u003cp>Responsable : Mainteneurs de la démo · Décision : Corriger · Statut : Ouvert · Échéance : —\u003c/p>\n\u003ch3 id=\"i1-ouvrir-la-chaine-d-approbation-ecrit-lors-d-un-get\">I1 — Ouvrir la chaîne d&#39;approbation écrit lors d&#39;un GET\u003ca class=\"ancre\" href=\"#/risks/findings~i1-ouvrir-la-chaine-d-approbation-ecrit-lors-d-un-get\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Constat\u003c/strong> : consulter \u003ccode>/orders/&lt;id&gt;/approval\u003c/code> crée la chaîne d&#39;approbation de la commande et enregistre une\nécriture, que la visite soit volontaire ou non (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:59\u003c/code>\u003c/span>). La page d&#39;une commande précharge même\ncette route en arrière-plan dès son chargement (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>order.html:22\u003c/code>\u003c/span>, \u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>app.js:16\u003c/code>\u003c/span>) : la chaîne est donc\ncréée avant que quiconque ait cliqué sur quoi que ce soit.\u003c/p>\n\u003cp>\u003cstrong>Impact\u003c/strong> : un aperçu de lien, un robot d&#39;indexation, ou la capture en lecture seule de doc-kit lui-même (bloquée\nuniquement parce que cette route est déclarée dans \u003ccode>capture.forbidden\u003c/code>) peuvent déclencher la même écriture.\n\u003ca class=\"puce regle\" href=\"#/features/rules~br-02\" title=\"Ouvrir la chaîne d'approbation d'une commande la crée\">BR-02\u003c/a> décrit cela comme un comportement métier voulu, mais une requête GET qui crée des données reste un\nrisque pour quiconque transmet le lien.\u003c/p>\n\u003cp>\u003cstrong>Recommandation\u003c/strong> : créer la chaîne lors de la soumission de la commande, et non à l&#39;ouverture du lien ; faire de la\npage d&#39;approbation une simple lecture.\u003c/p>\n\u003cp>Responsable : Mainteneurs de la démo · Décision : Corriger · Statut : Ouvert · Échéance : —\u003c/p>\n\u003ch3 id=\"m1-le-reglage-du-theme-n-a-aucun-effet\">M1 — Le réglage du thème n&#39;a aucun effet\u003ca class=\"ancre\" href=\"#/risks/findings~m1-le-reglage-du-theme-n-a-aucun-effet\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Constat\u003c/strong> : \u003cstrong>Réglages → Thème\u003c/strong> propose Clair, Sombre et Système, et le choix est enregistré\n(\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>app.js:55\u003c/code>\u003c/span>). Rien ne le relit : \u003ccode>app.js:51\u003c/code> se contente d&#39;écrire la valeur enregistrée dans la liste\ndéroulante, et \u003ccode>style.css\u003c/code> ne définit aucune variante sombre.\u003c/p>\n\u003cp>\u003cstrong>Impact\u003c/strong> : aucun hormis la confusion — le réglage semble devoir changer la page, et ne le fait pas.\u003c/p>\n\u003cp>\u003cstrong>Recommandation\u003c/strong> : soit implémenter une variante sombre de \u003ccode>style.css\u003c/code>, soit retirer le réglage tant qu&#39;il n&#39;en\nexiste pas.\u003c/p>\n\u003cp>Responsable : Mainteneurs de la démo · Décision : Accepter · Statut : Ouvert · Échéance : —\u003c/p>\n\u003ch2 id=\"ce-qui-n-a-pas-pu-etre-verifie\">Ce qui n&#39;a pas pu être vérifié\u003ca class=\"ancre\" href=\"#/risks/findings~ce-qui-n-a-pas-pu-etre-verifie\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>Si un vrai déploiement d&#39;Acme Orders serait placé derrière un proxy inverse ou un répartiteur de charge : cette démo\nne tourne jamais qu&#39;avec \u003ccode>node serve.mjs\u003c/code> sur une machine locale.\u003c/li>\n\u003c/ul>\n","toc":[{"id":"comment-lire-cette-page","title":"Comment lire cette page","level":2},{"id":"l-essentiel-en-une-minute","title":"L'essentiel en une minute","level":2},{"id":"constats","title":"Constats","level":2},{"id":"c1-aucun-controle-d-acces","title":"C1 — Aucun contrôle d'accès","level":3},{"id":"i1-ouvrir-la-chaine-d-approbation-ecrit-lors-d-un-get","title":"I1 — Ouvrir la chaîne d'approbation écrit lors d'un GET","level":3},{"id":"m1-le-reglage-du-theme-n-a-aucun-effet","title":"M1 — Le réglage du thème n'a aucun effet","level":3},{"id":"ce-qui-n-a-pas-pu-etre-verifie","title":"Ce qui n'a pas pu être vérifié","level":2}],"captures":0,"space":"develop","verified":{"version":"1.4.0","date":"2026-10-02"}}},"order":["use/orders","use/orders/detail","use/settings","features/track-orders","features/approve-order","features/rules","features/roles","secure/access-ownership","maintain/architecture","secure/api-surface","risks/findings"],"search":[{"p":"use/orders","a":null,"t":"La liste des commandes","x":"Les filtres, le résumé d'une commande et le bouton Nouvelle commande."},{"p":"use/orders","a":"a-quoi-ca-sert","t":"À quoi ça sert","x":"La liste des commandes est la première page affichée après la connexion. Elle résume les commandes du jour et donne accès à toutes les fonctions par le menu Orders › All orders ( /orders ). Une nouvelle commande reçoit le statut Open ; une commande annulée, Cancelled . Astuce La recherche s'ouvre aussi au clavier : Ctrl + K ."},{"p":"use/orders","a":"comment-ca-marche","t":"Comment ça marche","x":"La liste est chargée depuis l'API à l'ouverture de la page. Le Résumé des commandes suit toujours les trois filtres placés au-dessus, et non toutes les commandes de la liste ( BR-03 ) : resserrez les filtres, et les chiffres du jour se resserrent avec eux."},{"p":"use/orders","a":"l-ecran","t":"L'écran","x":"Commandes · liste Visite guidée · 3 étapes Agrandir 1 2 3 1 Filtres : statut, client et date ; ils sont conservés jusqu'à la déconnexion. 2 Résumé des commandes : les chiffres du jour, recalculés à chaque ouverture de la page. 3 Nouvelle commande : crée une commande ; voir les réglages ."},{"p":"use/orders","a":"exemple","t":"Exemple","x":""},{"p":"use/orders","a":"exemple-2","t":"Exemple","x":""},{"p":"use/orders","a":"exemple-2-2","t":"Exemple","x":"Réglage Valeur Effet Adresse de l'API https:/ / orders. example. org/ api/ v1/ orders? status= open Origine des données Thème Clair · Sombre Couleurs de l'interface"},{"p":"use/orders","a":"dans-cette-partie","t":"Dans cette partie","x":"Le détail d'une commande"},{"p":"use/orders","a":"pieges-et-limites-a-connaitre","t":"Pièges et limites à connaître","x":"Commandes en attente de livraison Une commande en attente de livraison reste dans la liste tant que chaque ligne n'a pas été expédiée."},{"p":"use/orders","a":"droits-requis","t":"Droits requis","x":"Droits requis Voir la liste : orders:read ."},{"p":"use/orders/detail","a":null,"t":"Le détail d'une commande","x":"Ce qui change une fois la commande créée."},{"p":"use/orders/detail","a":"ce-qui-change","t":"Ce qui change","x":"Commandes Réglages Des commandes aux réglages À savoir La poignée se déplace aussi avec les flèches gauche et droite du clavier. Données de démonstration Les chiffres affichés ne sont pas réels."},{"p":"use/settings","a":null,"t":"Les réglages du profil","x":"Modifier son profil et l'enregistrer."},{"p":"use/settings","a":"a-quoi-ca-sert","t":"À quoi ça sert","x":"Le profil contient votre nom, votre langue et votre thème. Cette page utilise les graphies françaises de la syntaxe, acceptées au même titre que les autres. Astuce Clair, Sombre et Système sont enregistrés dans votre profil, mais cette démo ne change pas encore réellement les couleurs de la page."},{"p":"use/settings","a":"l-ecran","t":"L'écran","x":"Réglages · profil Visite guidée · 2 étapes Agrandir 1 2 1 Profil : nom, langue et thème. 2 Enregistrer : applique les modifications."},{"p":"use/settings","a":"pas-a-pas","t":"Pas à pas","x":"Ouvrez Settings . Modifiez le Profil . Cliquez sur Enregistrer ."},{"p":"use/settings","a":"reference-de-chaque-reglage","t":"Référence de chaque réglage","x":"Réglage Contrôle Valeurs · défaut Effet Langue Liste English · Français Langue de l'interface Thème Interrupteur Clair · Sombre · Système Couleurs Aucune validation Un nom vide est enregistré tel quel : la démo ne le vérifie pas."},{"p":"use/settings","a":"droits-requis","t":"Droits requis","x":"Droits requis Enregistrer : settings:write ; statut Open ; raccourci Ctrl + S ."},{"p":"features/track-orders","a":null,"t":"Suivre les commandes","x":"Filtrer la liste des commandes et ouvrir une commande pour voir son statut."},{"p":"features/track-orders","a":"a-quoi-ca-sert","t":"À quoi ça sert","x":"Suivre les commandes est la première chose que voit un membre de l'équipe après sa connexion : la liste complète des commandes, restreinte par statut, client ou date, avec au-dessus les chiffres de ce qui est affiché et un accès au détail de chaque commande."},{"p":"features/track-orders","a":"qui-l-utilise","t":"Qui l'utilise","x":"Rôle Ce qu'il en fait Membre de l'équipe Trouve une commande, suit celles qui sont ouvertes, et ouvre une commande pour vérifier son statut."},{"p":"features/track-orders","a":"user-stories","t":"User stories","x":""},{"p":"features/track-orders","a":"us-01","t":"US-01 · Filtrer par statut","x":"Membre de l'équipe depuis 1.0 1 critère En tant que membre de l'équipe , je veux filtrer les commandes par statut afin de traiter d'abord les commandes ouvertes."},{"p":"features/track-orders","a":"us-02","t":"US-02 · Retrouver les commandes d'un client","x":"Membre de l'équipe depuis 1.0 2 critères En tant que membre de l'équipe , je veux saisir une partie du nom d'un client afin de retrouver ses commandes sans faire défiler la liste."},{"p":"features/track-orders","a":"us-03","t":"US-03 · Lire les chiffres de ce que je vois","x":"Membre de l'équipe depuis 1.2 1 critère En tant que membre de l'équipe , je veux que les chiffres au-dessus de la liste suivent mes filtres afin de connaître le volume de ce que je regarde."},{"p":"features/track-orders","a":"parcours-principal","t":"Parcours principal","x":"Un membre de l'équipe ouvre la liste des commandes : toutes les commandes sont affichées, dans l'ordre où l'application les envoie. Il saisit une partie du nom d'un client dans Customer , ou choisit un Status ou une Date , seuls ou ensemble. La liste et les trois chiffres au-dessus ( orders , open , total ) suivent à chaque changement, sans bouton à actionner ( BR-03 ). Il ouvre une commande depuis la liste pour en voir le détail ."},{"p":"features/track-orders","a":"comportements","t":"Comportements","x":"B-01 · Recherche"},{"p":"features/track-orders","a":"b-01","t":"Trouver une commande par client","x":"10 rubriques renseignées 1 à confirmer Où (renseignée) le champ Customer , « Search a customer… », dans le panneau Filters à côté de la liste. Champs cherchés (renseignée) le nom du client uniquement : ni le numéro de commande, ni le montant, ni le statut. Correspondance (renseignée) le nom doit contenir le texte saisi, quelle que soit la casse ; les accents comptent : « cafe » ne trouve pas « Blue Harbor Café ». Plusieurs mots (renseignée) le texte est cherché tel quel, comme une seule expression : « harbor café » trouve « Blue Harbor Café », « café harbor » ne trouve rien. Déclenchement (renseignée) à chaque frappe, dès le premier caractère ; les espaces aux deux extrémités sont ignorés. Filtres associés (renseignée) avec Status et Date : une commande doit remplir toutes les conditions à la fois. Ordre des résultats (sans objet) sans objet — l'ordre d'envoi de l'application est conservé ; aucune colonne ne trie la liste. Pagination (sans objet) sans objet — toutes les commandes reçues sont affichées, sans limite. Aucun résultat (renseignée) le tableau reste vide, sans message ; les trois chiffres affichent 0. Erreurs (à confirmer) inconnu — que voit un membre de l'équipe quand les commandes ne peuvent pas être chargées ? Rien de particulier n'est affiché. Droits (renseignée) toute personne connectée, qui voit la liste ( orders:read ) ; la recherche ne restreint rien de plus. B-02 · Filtre"},{"p":"features/track-orders","a":"b-02","t":"Filtrer par statut et par date","x":"8 rubriques renseignées Critères (renseignée) Status : All, Open, Shipped ou Cancelled, comparé tel quel ; Date : un jour, jamais une période. Combinaison (renseignée) les critères s'additionnent (toutes les conditions à la fois), entre eux et avec la recherche par client. Par défaut (renseignée) All et aucune date : toutes les commandes sont affichées. Déclenchement (renseignée) dès qu'une valeur change. Remise à zéro (renseignée) choisir All et effacer la date ; il n'y a pas de bouton pour cela. Conservation (renseignée) non : les filtres sont perdus quand on quitte la page. Effet (renseignée) les trois chiffres au-dessus de la liste suivent les filtres ( BR-03 ). Aucun résultat (renseignée) le tableau reste vide, sans message."},{"p":"features/track-orders","a":"regles-de-gestion","t":"Règles de gestion","x":"BR-01 limite un statut à trois valeurs ; BR-03 régit les chiffres au-dessus du tableau."},{"p":"features/track-orders","a":"messages","t":"Messages","x":"Sans objet — la liste n'affiche aucun message propre : un résultat vide laisse le tableau vide et les chiffres à 0."},{"p":"features/track-orders","a":"droits-par-action","t":"Droits par action","x":"Action Droit Condition Voir la liste, rechercher et filtrer orders:read Connecté ; une personne non connectée est renvoyée vers la page de connexion Ouvrir une commande orders:read —"},{"p":"features/track-orders","a":"criteres-d-acceptation","t":"Critères d'acceptation","x":"1 Une partie du nom d'un client US-02 B-01 Soit les commandes de « Northwind Bistro » (#1041 et #1045) Quand je saisis « north » dans Customer Alors il ne reste que les commandes #1041 et #1045 2 Les accents comptent US-02 B-01 Soit la commande de « Blue Harbor Café » (#1042) Quand je saisis « cafe » dans Customer Alors aucune commande n'est affichée Et les trois chiffres affichent 0 3 Statut et date ensemble US-01 B-02 Soit trois commandes ouvertes, dont deux du 15 janvier 2026 Quand je choisis le Status « Open » et la date du 15 janvier 2026 Alors il reste deux lignes : #1041 et #1042 4 Les chiffres suivent le filtre US-03 B-02 Soit le Status « Shipped » Alors orders affiche 2 et total affiche 3 600,00 $"},{"p":"features/track-orders","a":"limites","t":"Limites","x":"Les filtres ne sont conservés nulle part une fois la page quittée : en revenant à la liste, on repart de All ."},{"p":"features/track-orders","a":"questions-ouvertes","t":"Questions ouvertes","x":"Que voit un membre de l'équipe quand les commandes ne peuvent pas être chargées ? Le product owner."},{"p":"features/approve-order","a":null,"t":"Approuver une commande","x":"Ouvrir la chaîne d'approbation d'une commande pour que les approbateurs soient prévenus."},{"p":"features/approve-order","a":"a-quoi-ca-sert","t":"À quoi ça sert","x":"Approuver une commande donne à chaque commande une piste d'approbation : le lien Approval chain sur la page d'une commande. La première fois que quelqu'un l'ouvre, Acme Orders crée la chaîne et prévient les approbateurs ; l'ouvrir de nouveau ne fait que l'afficher."},{"p":"features/approve-order","a":"qui-l-utilise","t":"Qui l'utilise","x":"Rôle Ce qu'il en fait Membre de l'équipe Ouvre une commande et suit son lien Approval chain ."},{"p":"features/approve-order","a":"user-stories","t":"User stories","x":""},{"p":"features/approve-order","a":"us-04","t":"US-04 · Lancer l'approbation d'une commande","x":"Membre de l'équipe depuis 1.0 2 critères En tant que membre de l'équipe , je veux ouvrir la chaîne d'approbation d'une commande afin que ses approbateurs soient prévenus qu'elle les attend."},{"p":"features/approve-order","a":"parcours-principal","t":"Parcours principal","x":"Un membre de l'équipe ouvre le détail d'une commande . Il suit le lien Approval chain . Acme Orders crée la chaîne de cette commande et prévient les approbateurs ( BR-02 ). Le membre de l'équipe voit la chaîne ; une visite ultérieure affiche la même chaîne, inchangée."},{"p":"features/approve-order","a":"comportements","t":"Comportements","x":"B-03 · Notification"},{"p":"features/approve-order","a":"b-03","t":"Prévenir les approbateurs","x":"3 rubriques renseignées 2 à confirmer Événement déclencheur (renseignée) la première ouverture du lien Approval chain d'une commande ( BR-02 ). Destinataires (renseignée) les approbateurs de la commande. Canal (à confirmer) inconnu — l'application n'indique pas comment les approbateurs sont prévenus. Contenu (à confirmer) inconnu — que dit la notification, et renvoie-t-elle vers la commande ? Délai (renseignée) immédiat, à la création de la chaîne ; rouvrir le lien n'envoie rien."},{"p":"features/approve-order","a":"regles-de-gestion","t":"Règles de gestion","x":"BR-02 est l'unique règle que cette fonctionnalité existe pour appliquer."},{"p":"features/approve-order","a":"messages","t":"Messages","x":"Message Quand il apparaît Que faire « The approval chain of this order was created … » Sur la page Approval chain Rien : les approbateurs ont été prévenus"},{"p":"features/approve-order","a":"droits-par-action","t":"Droits par action","x":"Action Droit Condition Ouvrir la commande orders:read Connecté Ouvrir son Approval chain orders:approve —"},{"p":"features/approve-order","a":"criteres-d-acceptation","t":"Critères d'acceptation","x":"1 La première ouverture crée la chaîne US-04 B-03 Soit la commande #1041, sans chaîne d'approbation pour l'instant Quand un membre de l'équipe suit son lien Approval chain Alors la chaîne est créée Et les approbateurs sont prévenus 2 Une seconde ouverture ne change rien US-04 B-03 Soit la commande #1041, dont la chaîne existe déjà Quand un membre de l'équipe suit de nouveau le lien Alors la même chaîne est affichée, et personne n'est prévenu une seconde fois"},{"p":"features/approve-order","a":"limites","t":"Limites","x":"Ouvrir le lien suffit : un simple coup d'œil, l'aperçu d'un lien partagé ou un outil automatisé qui le suit crée aussi la chaîne et prévient les approbateurs, que ce soit voulu ou non ( la surface de l'API le décrit plus précisément pour l'équipe de reprise)."},{"p":"features/approve-order","a":"questions-ouvertes","t":"Questions ouvertes","x":"Comment les approbateurs sont-ils prévenus, et que dit la notification ? Le product owner."},{"p":"features/rules","a":null,"t":"Règles de gestion","x":"Les règles communes à plusieurs fonctionnalités, définies une fois et citées partout."},{"p":"features/rules","a":"comment-lire-cette-page","t":"Comment lire cette page","x":"Une règle est définie une seule fois, ici, car chacune des règles ci-dessous sert à plusieurs pages. Partout ailleurs, elle est seulement citée, avec [[rule BR-02]] , jamais redéfinie. Une règle qui ne concernerait qu'une seule fonctionnalité serait définie sur la fiche de cette fonctionnalité."},{"p":"features/rules","a":"les-regles","t":"Les règles","x":""},{"p":"features/rules","a":"br-01","t":"BR-01 · Une commande est Ouverte, Expédiée ou Annulée","x":"Une commande porte exactement un des trois statuts, affiché sous forme de pastille colorée : Ouverte , Expédiée ou Annulée . Il n'existe pas de quatrième statut dans cette version d'Acme Orders. Exemple. Étant donné la liste des commandes, quand vous filtrez par statut, alors les trois choix proposés sont Ouverte , Expédiée et Annulée , et rien d'autre."},{"p":"features/rules","a":"br-02","t":"BR-02 · Ouvrir la chaîne d'approbation d'une commande la crée","x":"La chaîne d'approbation d'une commande n'existe pas tant que personne ne l'a ouverte pour la première fois. Ouvrir le lien Chaîne d'approbation , quelle que soit la personne connectée, crée la chaîne et prévient les approbateurs, même pour un simple coup d'œil. Exemple. Étant donné une commande dont la page d'approbation n'a jamais été ouverte, quand quelqu'un suit le lien Chaîne d'approbation , alors la chaîne est créée et les approbateurs sont prévenus, que ce soit voulu ou non."},{"p":"features/rules","a":"br-03","t":"BR-03 · Les chiffres du jour suivent les filtres en cours","x":"Les trois chiffres au-dessus du tableau des commandes ( commandes , ouvertes , total ) sont calculés sur les commandes actuellement affichées, une fois les filtres de statut, de client et de date appliqués, et non sur toutes les commandes qu'Acme Orders contient. Exemple. Étant donné six commandes dans la liste, quand vous filtrez le statut sur Ouverte , alors le chiffre total additionne seulement les commandes ouvertes affichées, pas les six."},{"p":"features/rules","a":"les-regles-par-fonctionnalite","t":"Les règles par fonctionnalité"
