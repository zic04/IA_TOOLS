,"x":"Id Règle Définie dans Citée par BR-01 Une commande est Ouverte, Expédiée ou Annulée Règles de gestion F-01 BR-02 Ouvrir la chaîne d'approbation d'une commande la crée Règles de gestion F-02, risks/findings BR-03 Les chiffres du jour suivent les filtres en cours Règles de gestion use/orders, F-01"},{"p":"features/rules","a":"regles-retirees","t":"Règles retirées","x":"Aucune pour l'instant : Acme Orders n'a retiré aucune règle de gestion depuis la rédaction de cette page."},{"p":"features/roles","a":null,"t":"Rôles et droits","x":"Les rôles livrés avec Acme Orders, et qui peut faire quoi."},{"p":"features/roles","a":"en-bref","t":"En bref","x":"Les fiches fonctionnalité d'Acme Orders décrivent deux rôles, Membre de l'équipe et Approbateur : un membre de l'équipe devient approbateur par addition de droits. La version de démonstration ci-dessous ne les vérifie pas (voir la note sous « Qui peut faire quoi ») ; une version de production appliquerait les droits nommés sur chaque fiche fonctionnalité."},{"p":"features/roles","a":"les-roles","t":"Les rôles","x":"Membre de l'équipe : se connecte et utilise Suivre les commandes : lit la liste, la filtre, ouvre une commande. Approbateur : tout ce que peut faire un membre de l'équipe, plus Approuver une commande : ouvrir la Chaîne d'approbation d'une commande."},{"p":"features/roles","a":"qui-peut-faire-quoi","t":"Qui peut faire quoi","x":"Fonctionnalité orders:read orders:approve Suivre les commandes Autorisé ✔ Approuver une commande Autorisé ✔ Autorisé ✔ Non appliqué dans cette démo Le tableau ci-dessus est le modèle visé. La version de démonstration vérifie seulement que quelqu'un est connecté, pas le rôle qu'il détient : aujourd'hui, toute personne connectée peut ouvrir une Chaîne d'approbation ( la surface de l'API décrit cet écart pour l'équipe de reprise)."},{"p":"features/roles","a":"responsabilites","t":"Responsabilités","x":"Acme Orders ne garde aucune trace de qui a approuvé quoi au-delà de la chaîne elle-même : la démo ne distingue pas la décision d'un approbateur de celle de n'importe qui ouvrant le même lien."},{"p":"features/roles","a":"comment-obtenir-un-role","t":"Comment obtenir un rôle","x":"Sans objet : cette démo n'a pas d'écran d'administration des utilisateurs. N'importe quelle adresse e-mail et n'importe quel mot de passe connectent au même unique compte de démonstration."},{"p":"secure/access-ownership","a":null,"t":"Accès et propriété","x":"À qui appartiennent le dépôt, l'hébergement et le secret de session."},{"p":"secure/access-ownership","a":"en-bref","t":"En bref","x":"Acme Orders est une démo : elle n'a ni déploiement en production ni équipe identifiée. Le tableau ci-dessous montre à quoi ressemblerait une vraie passation de ce code, rempli dans la mesure où le code lui-même répond."},{"p":"secure/access-ownership","a":"qui-possede-quoi","t":"Qui possède quoi","x":"Actif Propriétaire Où Comment le transmettre Statut Dépôt — Là où le dépôt de ce kit est cloné Transférer le dépôt ou ajouter un copropriétaire Propriétaire inconnu Hébergement — Aucun : node serve.mjs ne tourne que sur une machine locale Sans objet, aucun hébergeur de production n'existe Propriétaire inconnu Jeton de session — En mémoire seulement ( Vérifié dans le code serve.mjs:35 ), perdu à chaque redémarrage Rien à renouveler : il est aléatoire et jamais conservé Connu Données de démo ( data.json ) — Versionnées avec le dépôt Modifier le fichier, ou appeler POST /api/demo/reset Connu"},{"p":"secure/access-ownership","a":"secrets-et-ou-ils-vivent","t":"Secrets et où ils vivent","x":"Acme Orders ne détient aucun secret à renouveler : il n'y a ni clé d'API, ni mot de passe, ni clé de signature dans le code. La seule valeur propre à une session est le jeton de session aléatoire ( Vérifié dans le code serve.mjs:35 ), conservé dans une Map en mémoire du serveur et jamais écrit sur disque ( Vérifié dans le code serve.mjs:21 )."},{"p":"secure/access-ownership","a":"proprietaires-inconnus","t":"Propriétaires inconnus","x":"Dépôt et hébergement : une démo n'a pas d'équipe à nommer ; un vrai déploiement indiquerait ici une personne ou une équipe, avant que le reste de cette page ait un sens."},{"p":"secure/access-ownership","a":"checklist-de-passation","t":"Checklist de passation","x":"Clonez le dépôt et lancez node serve.mjs pour vérifier qu'il démarre toujours. Décidez qui en est propriétaire : même une démo gagne à avoir un mainteneur nommé. Lisez la surface de l'API avant de l'exposer au-delà d'une machine locale : aujourd'hui, rien ne vérifie qui a le droit de faire quoi."},{"p":"maintain/architecture","a":null,"t":"L'architecture d'Acme Orders","x":"Les trois blocs d'Acme Orders et la façon dont ils communiquent."},{"p":"maintain/architecture","a":"vue-d-ensemble","t":"Vue d'ensemble","x":"Acme Orders se compose de trois blocs : le navigateur, l'API et la base de données. L'API REST relie les deux premiers. Le parcours d'une commande Comment ça marche Chaque requête du navigateur passe par l'API, qui lit ou écrit dans la base de données."},{"p":"maintain/architecture","a":"le-lancer-en-local","t":"Le lancer en local","x":"npm ci npm run dev Vérifier l'installation Ouvrez http:/ / localhost:3000/ api/ v1/ health : la réponse doit être ok ."},{"p":"secure/api-surface","a":null,"t":"La surface de l'API","x":"Chaque route, qui peut l'appeler, et les failles."},{"p":"secure/api-surface","a":"en-bref","t":"En bref","x":"Acme Orders répond sur une douzaine de routes ; quatre d'entre elles ne vérifient jamais qui les appelle. Il n'y a jamais qu'un seul compte de démo, donc l'isolation entre locataires ne s'applique pas — mais l'isolation entre rôles, elle, s'applique, et rien ne la vérifie aujourd'hui."},{"p":"secure/api-surface","a":"les-routes","t":"Les routes","x":"doc-kit facts --source api ne trouve rien : Acme Orders répond par des comparaisons directes de chaînes sur le chemin de la requête ( serve.mjs ) plutôt que par un routeur que l'adaptateur sait analyser ; le tableau ci-dessous a donc été entièrement complété à la main à partir du code. Il n'y a pas d'isolation entre locataires à vérifier : la démo n'a qu'un seul compte. api · au 2026-10-21 · commit ddfb01e Méthode Route Fichier Méthode Route Authentification Rôle Preuve GET /login Aucune Publique Vérifié dans le code serve.mjs:41 POST /login Aucune Publique Vérifié dans le code serve.mjs:33 GET /api/me Cookie de session Connecté Vérifié dans le code serve.mjs:52 GET /api/orders Cookie de session Connecté Vérifié dans le code serve.mjs:54 GET /api/orders/[id] Cookie de session Connecté Vérifié dans le code serve.mjs:55 POST /api/settings Cookie de session Connecté Vérifié dans le code serve.mjs:49 GET /orders/[id]/approval Cookie de session Connecté — écrit à l'affichage Vérifié dans le code serve.mjs:59 POST /api/demo/reset Aucune Publique Vérifié dans le code serve.mjs:40"},{"p":"secure/api-surface","a":"regles-d-acces-a-la-base-de-donnees","t":"Règles d'accès à la base de données","x":"db · au 2026-10-21 · commit ddfb01e Table Sécurité au niveau ligne Politiques Il n'y a pas de base de données : Acme Orders garde tout dans un seul objet en mémoire, initialisé depuis data.json et abandonné au redémarrage ( Vérifié dans le code serve.mjs:22 ). Aucune sécurité au niveau des lignes ne s'applique, car aucune ligne ne survit à un redémarrage."},{"p":"secure/api-surface","a":"routes-publiques","t":"Routes publiques","x":"Route Pourquoi elle est publique Preuve GET / POST /login La page de connexion elle-même Vérifié dans le code serve.mjs:41 GET /style.css , /app.js Ressources statiques, nécessaires avant la connexion Vérifié dans le code serve.mjs:43 POST /api/demo/reset Commodité pour capture.setup ; réinitialise les données de démo, rien de plus Vérifié dans le code serve.mjs:40"},{"p":"secure/api-surface","a":"manques","t":"Manques","x":"C1 — le seul contrôle est « quelqu'un est-il connecté » ( Vérifié dans le code serve.mjs:46 ) ; aucune route ne distingue orders:read de orders:approve . I1 — GET /orders/[id]/approval écrit à l'affichage ( Vérifié dans le code serve.mjs:59 ), et la page d'une commande la précharge automatiquement ( Vérifié dans le code app.js:16 )."},{"p":"risks/findings","a":null,"t":"Constats","x":"Trois constats, revérifiés dans le code : un critique, un important, un mineur."},{"p":"risks/findings","a":"comment-lire-cette-page","t":"Comment lire cette page","x":"Voici la liste de travail de qui reprend Acme Orders : les écarts constatés dans la version 1.4.0, revérifiés directement dans serve.mjs et dans les fichiers de public/ . Il n'existe pas de déploiement en production : aucun constat ici ne vient d'ailleurs que du code. Gravité Définition Nombre Critique Un risque actuel pour la sécurité des données ou pour la promesse centrale du produit ; à traiter avant toute autre modification 1 Important Un vrai défaut, un contournement possible ou une fonctionnalité cassée ; à planifier rapidement 1 Mineur Dette, incohérence ou réglage sans effet ; à traiter au fil de l'eau 1 Les constats sont numérotés C (critique), I (important) et M (mineur). Un numéro ne change jamais : un nouveau constat prend le prochain numéro libre de sa famille."},{"p":"risks/findings","a":"l-essentiel-en-une-minute","t":"L'essentiel en une minute","x":"Ajoutez un contrôle de rôle : aujourd'hui, toute personne connectée peut utiliser toutes les fonctionnalités d'Acme Orders (C1). Cessez d'écrire lors d'un GET : ouvrir un lien ne doit jamais créer de données (I1). Branchez le réglage du thème, ou supprimez-le : il est enregistré mais n'a aucun effet (M1)."},{"p":"risks/findings","a":"constats","t":"Constats","x":""},{"p":"risks/findings","a":"c1-aucun-controle-d-acces","t":"C1 — Aucun contrôle d'accès","x":"Constat : le seul contrôle avant toute action est « quelqu'un est-il connecté » ( Vérifié dans le code serve.mjs:46 ) ; rien ne vérifie ce que cette personne a le droit de faire. F-02 présente orders:approve comme une permission distincte de orders:read , mais le serveur ne les distingue jamais. Impact : toute personne connectée peut lire toutes les commandes, modifier le profil, et ouvrir — donc créer — la chaîne d'approbation de n'importe quelle commande. La page rôles et permissions décrit le modèle qu'Acme Orders n'applique pas encore. Recommandation : rattacher un rôle à chaque session ( Vérifié dans le code serve.mjs:36 ) et le vérifier avant chaque action, en commençant par orders:approve . Responsable : Mainteneurs de la démo · Décision : Corriger · Statut : Ouvert · Échéance : —"},{"p":"risks/findings","a":"i1-ouvrir-la-chaine-d-approbation-ecrit-lors-d-un-get","t":"I1 — Ouvrir la chaîne d'approbation écrit lors d'un GET","x":"Constat : consulter /orders/\u003cid>/approval crée la chaîne d'approbation de la commande et enregistre une écriture, que la visite soit volontaire ou non ( Vérifié dans le code serve.mjs:59 ). La page d'une commande précharge même cette route en arrière-plan dès son chargement ( Vérifié dans le code order.html:22 , Vérifié dans le code app.js:16 ) : la chaîne est donc créée avant que quiconque ait cliqué sur quoi que ce soit. Impact : un aperçu de lien, un robot d'indexation, ou la capture en lecture seule de doc-kit lui-même (bloquée uniquement parce que cette route est déclarée dans capture.forbidden ) peuvent déclencher la même écriture. BR-02 décrit cela comme un comportement métier voulu, mais une requête GET qui crée des données reste un risque pour quiconque transmet le lien. Recommandation : créer la chaîne lors de la soumission de la commande, et non à l'ouverture du lien ; faire de la page d'approbation une simple lecture. Responsable : Mainteneurs de la démo · Décision : Corriger · Statut : Ouvert · Échéance : —"},{"p":"risks/findings","a":"m1-le-reglage-du-theme-n-a-aucun-effet","t":"M1 — Le réglage du thème n'a aucun effet","x":"Constat : Réglages → Thème propose Clair, Sombre et Système, et le choix est enregistré ( Vérifié dans le code app.js:55 ). Rien ne le relit : app.js:51 se contente d'écrire la valeur enregistrée dans la liste déroulante, et style.css ne définit aucune variante sombre. Impact : aucun hormis la confusion — le réglage semble devoir changer la page, et ne le fait pas. Recommandation : soit implémenter une variante sombre de style.css , soit retirer le réglage tant qu'il n'en existe pas. Responsable : Mainteneurs de la démo · Décision : Accepter · Statut : Ouvert · Échéance : —"},{"p":"risks/findings","a":"ce-qui-n-a-pas-pu-etre-verifie","t":"Ce qui n'a pas pu être vérifié","x":"Si un vrai déploiement d'Acme Orders serait placé derrière un proxy inverse ou un répartiteur de charge : cette démo ne tourne jamais qu'avec node serve.mjs sur une machine locale."}],"glossary":[{"term":"Commande","def":"La demande d'un client pour un ou plusieurs produits, avec une adresse de livraison et un statut.","pattern":"commandes?","tech":"data.json → orders[]; field status; served by GET /api/orders and GET /api/orders/[id] (serve.mjs)."},{"term":"Reliquat","def":"Une ligne de commande qui ne peut pas encore être expédiée, faute de stock du produit.","pattern":"reliquats?"},{"term":"API","def":"Interface de programmation exposée par le serveur d'Acme Orders.","pattern":"API(?: REST)?","tech":"serve.mjs: a single http.createServer handler, routes matched with plain string and regular-expression comparisons — no router."}],"journeys":[{"title":"Découvrir Acme Orders","desc":"Les trois pages à lire en premier.","steps":["use/orders","use/settings","maintain/architecture"],"space":"use"}],"suggestions":["use/orders","features/track-orders","features/approve-order","secure/api-surface","risks/findings","maintain/architecture"],"homeHtml":"\u003ch2 id=\"bienvenue\">Bienvenue\u003ca class=\"ancre\" href=\"#/accueil~bienvenue\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Cette documentation de démonstration sert aux \u003cstrong>tests du kit\u003c/strong>. Elle couvre toute la <script>
/* Documentation site — browser engine (inlined at build time, no dependency).
   Data   : <script id="site-data"> (pages, outline, search index, glossary, i18n texts), written by the build
            (engine/build/render-language.mjs).
   Images : <script type="text/plain" id="img-ID"> (WebP data URI), read on demand.
   Texts  : none hard-coded; everything goes through t() (ui.* and home.* keys embedded by the build). */
(function () {
  "use strict";

  let D = JSON.parse(document.getElementById("site-data").textContent);
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  // Icon names used by this file → keys of the embedded icon set.
  const ICON_KEYS = {
    sun: "soleil",
    moon: "lune",
    screen: "ecran",
    lock: "droits",
    book: "livre",
    sliders: "studios",
    map: "carte",
    search: "recherche",
    left: "gauche",
  };
  const icon = (name, cls = "ico") =>
    `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${D.icons[ICON_KEYS[name] || name] || ""}</svg>`;
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  const norm = (s) =>
    String(s || "")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase();

  // ─── Texts (i18n) ─────────────────────────────────────────────────────────
  // t(key, vars): plain text; variables {name}; plural { one, other… } chosen from vars.n.
  // th(key, vars): HTML; the text is escaped, the variables (already HTML) are inserted as they are.
  let TEXTS = D.i18n || {};
  let rules = new Intl.PluralRules(document.documentElement.lang || undefined);
  function form(key, vars) {
    const v = TEXTS[key];
    if (v === undefined) return key;
    if (v && typeof v === "object") return v[rules.select(Number((vars && vars.n) || 0))] ?? v.other;
    return v;
  }
  const fill = (template, vars) =>
    String(template).replace(/\{(\w+)\}/g, (m, k) =>
      vars && vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : m,
    );
  const t = (key, vars) => fill(form(key, vars), vars);
  const th = (key, vars) => fill(esc(form(key, vars)), vars);

  const main = $("#contenu-principal");
  const shell = $("#coque");
  const sidebar = $("#lateral");
  const toc = $("#toc");
  const bubble = $("#bulle");
  // Sub-pages (level 2): attached to the last level-1 page above them in their group. Recomputed by
  // computeHierarchy() whenever the language changes (D.sections then points to the new language's data).
  let sectionsById = {};
  let parentOf = {};
  let childrenOf = {};
  function computeHierarchy() {
    sectionsById = Object.fromEntries(D.sections.map((s) => [s.id, s]));
    parentOf = {};
    childrenOf = {};
    for (const s of D.sections)
      for (const g of s.groups) {
        let parent = null;
        for (const pid of g.pages) {
          if (D.pages[pid].level === 2 && parent) {
            parentOf[pid] = parent;
            (childrenOf[parent] = childrenOf[parent] || []).push(pid);
          } else parent = pid;
        }
      }
  }
  computeHierarchy();
  let currentPage = null;

  // ─── Local storage (reading preferences only, never required) ─────────────
  const memo = {
    read(k) {
      try {
        return localStorage.getItem(k);
      } catch (e) {
        return null;
      }
    },
    write(k, v) {
      try {
        localStorage.setItem(k, v);
      } catch (e) {
        /* private browsing: no consequence */
      }
    },
  };

  // ─── Modules (engine/site/lib/*.js, spliced in at the line below by the build) ─────────────────────────────
  // A module sees EXT.api only, and adds to EXT: its hydrators run on every content rendered (hydrate).
  const EXT = { hydrators: [], api: { data: () => D, t, th, esc, icon, $, $$, memo } };
  {
/* The Product board (ARCHITECTURE.md §6.8b): the backlog of the feature sheets (D.board), drawn where a page or the
   home of a space leaves its place (<div class="tableau-produit" data-board>). A story map — the epics in columns,
   their features, then one row of stories per version — or a list (epic › feature › story), with filters: who,
   epic, version, depth and text. A card is a link to its sheet, a story to its heading; the view chosen is
   remembered. A module of the site (engine/site/app.js, spliced in at its "@lib" line): it sees EXT.api only and
   adds to EXT. No text of its own: every word comes from ui.board.* (t). */
/* global EXT */
const { t, esc, icon, memo, $$ } = EXT.api;
const BOARD_KEY = "acme-orders-doc-theme.board";
const VIEWS = ["map", "list"];
const LEVELS = ["full", "partial", "none"];
const CRITERIA = ["sheet", "stories", "criteria", "rules", "rubrics"];

/** The board of the site's data: its features, stories and epics, indexed. */
function indexOf(B) {
  const features = new Map(B.features.map((f) => [f.id, f]));
  const stories = new Map(B.stories.map((s) => [s.id, s]));
  const epics = B.epics.map((e, i) => ({ ...e, key: e.id || `g${i}` }));
  return { B, features, stories, epics, epicOf: new Map(epics.flatMap((e) => e.features.map((id) => [id, e]))) };
}

const level = (score) => (score >= 100 ? "full" : score > 0 ? "partial" : "none");
const mean = (scores) => (scores.length ? Math.round(scores.reduce((n, s) => n + s, 0) / scores.length) : 0);
const versionLabel = (v) => (v === null ? t("ui.board.noVersion") : t("ui.board.version", { version: v }));

/** The features the filters keep, in the order of their epics. */
function shown(ix, f) {
  const q = f.q.trim().toLowerCase();
  return ix.epics
    .flatMap((e) => e.features.map((id) => ix.features.get(id)))
    .filter((x) => {
      if (!x) return false;
      const own = x.stories.map((id) => ix.stories.get(id)).filter(Boolean);
      if (f.epic && ix.epicOf.get(x.id)?.key !== f.epic) return false;
      if (f.who && !x.roles.includes(f.who)) return false;
      if (f.depth && level(x.depth.score) !== f.depth) return false;
      if (
        f.version &&
        x.since !== (f.version === "-" ? null : f.version) &&
        !own.some((s) => (s.since ?? "-") === f.version)
      )
        return false;
      if (!q) return true;
      const text = [x.id, x.title, x.summary, ...own.map((s) => `${s.id} ${s.title}`)].join(" ").toLowerCase();
      return text.includes(q);
    });
}

/** A depth gauge: its bar, its score, and its criteria for assistive technology. */
function gauge(depth, cls = "tb-jauge") {
  const details = depth.criteria
    .map(
      (v, i) =>
        `${t(`ui.board.criterion.${CRITERIA[i]}`)} ${v === null ? t("ui.board.na") : `${Math.round(v * 100)} %`}`,
    )
    .join(", ");
  return `<span class="${cls} tb-${level(depth.score)}" role="img" aria-label="${esc(t("ui.board.depthLabel", { score: depth.score, details }))}"><span class="tb-barre" aria-hidden="true"><i style="width:${depth.score}%"></i></span><b>${depth.score} %</b></span>`;
}

/** A ticket: a link to its item when the project gave the tool's address (built by the kit, https only: checked
 *  again here), else its text. */
const ticket = (k) =>
  !k
    ? ""
    : String(k.url).startsWith("https://")
      ? `<a class="tb-ticket" href="${esc(k.url)}" target="_blank" rel="noopener noreferrer">${esc(k.text)}</a>`
      : `<span class="tb-ticket">${esc(k.text)}</span>`;

/** The kinds of behaviour of a feature, each with its icon. */
const kinds = (ix, list) =>
  list.length
    ? `<span class="tb-genres">${list.map((k) => `<span class="tb-genre">${icon(ix.B.kinds[k]?.icon || "mecanisme")}${esc(ix.B.kinds[k]?.title || k)}</span>`).join("")}</span>`
    : "";

/** "2 stories · 3 criteria · 1 rule". */
const counts = (x) =>
  [
    t("ui.board.count.stories", { n: x.stories.length }),
    t("ui.board.count.criteria", { n: x.criteria }),
    t("ui.board.count.rules", { n: x.rules }),
  ].join(" · ");

/** One feature as a card of the map: its title a link to its sheet, stretched over the card (style.css); its ticket
 *  a link of its own, above it — never a link in a link. */
function card(ix, x) {
  return `<div class="tb-carte">
    <span class="tb-carte-tete"><span class="tb-id">${esc(x.id)}</span><span class="tb-puce">${esc(versionLabel(x.since))}</span></span>
    <a class="tb-carte-titre" href="#/${esc(x.page)}" data-card>${esc(x.title)}</a>
    ${x.roles.length ? `<span class="tb-roles">${icon("personne")}<span>${esc(x.roles.join(", "))}</span></span>` : ""}
    ${kinds(ix, x.kinds)}
    <span class="tb-compte">${esc(counts(x))}</span>
    <span class="tb-carte-pied">${gauge(x.depth)}${ticket(x.ticket)}</span>
  </div>`;
}

/** One story: a link to its heading in its feature's sheet. */
const storyItem = (s) =>
  `<a class="tb-recit" href="#/${esc(s.page)}~${esc(s.anchor)}" title="${esc(s.title)}"><span class="tb-point ${s.criteria ? "tb-ok" : "tb-manque"}" aria-hidden="true"></span><span class="tb-id">${esc(s.id)}</span><span class="tb-recit-titre">${esc(s.title)}</span><span class="tb-criteres">${s.criteria ? esc(t("ui.board.count.criteria", { n: s.criteria })) : `<span class="sr-only">${esc(t("ui.board.noCriteria"))}</span>`}</span></a>`;

/** The epics of the features shown, each with the mean depth of all its features. */
function epicsShown(ix, list) {
  const keys = new Set(list.map((x) => ix.epicOf.get(x.id)?.key));
  return ix.epics.filter((e) => keys.has(e.key));
}
const epicScore = (ix, e) => mean(e.features.map((id) => ix.features.get(id)?.depth.score ?? 0));

/** The story map: the epics, their features, then a row of stories per version. */
function map(ix, list) {
  const epics = epicsShown(ix, list);
  const ordered = epics.flatMap((e) => list.filter((x) => ix.epicOf.get(x.id)?.key === e.key));
  const head = epics
    .map((e) => {
      const n = list.filter((x) => ix.epicOf.get(x.id)?.key === e.key).length;
      const score = epicScore(ix, e);
      return `<div class="tb-epic" style="grid-column: span ${n}">${e.id ? `<span class="tb-id">${esc(e.id)}</span>` : ""}<h3>${esc(e.title)}</h3>${e.summary ? `<p>${esc(e.summary)}</p>` : ""}<span class="tb-progres"><span class="tb-barre tb-${level(score)}" aria-hidden="true"><i style="width:${score}%"></i></span><span>${score} %</span><span>${esc(t("ui.board.count.features", { n: e.features.length }))}</span>${ticket(e.ticket)}</span></div>`;
    })
    .join("");
  const lanes = ix.B.versions
    .map((v) => {
      const cells = ordered
        .map((x) => {
          const own = x.stories.map((id) => ix.stories.get(id)).filter((s) => s && s.since === v);
          const none =
            v === null && !x.stories.length ? `<span class="tb-vide">${esc(t("ui.board.noStories"))}</span>` : "";
          return `<div class="tb-couloir"><span class="sr-only">${esc(versionLabel(v))}</span>${own.map(storyItem).join("")}${none}</div>`;
        })
        .join("");
      return `<div class="tb-etiquette tb-etiquette-couloir"><span class="tb-puce tb-puce-version">${esc(versionLabel(v))}</span></div>${cells}`;
    })
    .join("");
  const columns = `minmax(9rem, 10rem) repeat(${ordered.length}, minmax(15rem, 17rem))`;
  return `<div class="tb-defile" role="region" tabindex="0" aria-label="${esc(t("ui.board.view.map"))}"><div class="tb-carte-histoires" style="grid-template-columns: ${columns}">
    <div class="tb-etiquette tb-etiquette-tete">${esc(t("ui.board.lane.epics"))}</div>${head}
    <div class="tb-etiquette tb-etiquette-tete">${esc(t("ui.board.lane.features"))}</div>${ordered.map((x) => `<div class="tb-cellule">${card(ix, x)}</div>`).join("")}
    ${lanes}
  </div></div>`;
}

/** A row of the list under its parents (an epic's key, a feature's id): hidden when one of them is folded. */
const row = (cls, parents, folded, title, cells) =>
  `<tr class="${cls}"${parents.length ? ` data-parent="${esc(parents.join(" "))}"` : ""}${parents.some((k) => folded.has(k)) ? " hidden" : ""}><th scope="row">${title}</th>${cells.map((c) => `<td>${c}</td>`).join("")}</tr>`;
/** The button that folds what a row holds, and says whether it is open. */
const toggle = (key, label, folded, hidden = false) =>
  `<button class="tb-plier" type="button" aria-expanded="${!folded.has(key)}" data-toggle="${esc(key)}" aria-label="${esc(t(folded.has(key) ? "ui.board.expand" : "ui.board.collapse", { title: label }))}"${hidden ? " hidden" : ""}>${icon("chevron")}</button>`;

/** The list: Epic › Feature › Story, each level folding the next (folded: the keys of the rows folded). */
function list(ix, features, folded) {
  const head = ["element", "who", "stories", "rules", "behaviours", "version", "depth", "ticket"]
    .map((k) => `<th scope="col">${esc(t(`ui.board.col.${k}`))}</th>`)
    .join("");
  const rows = epicsShown(ix, features)
    .map((e) => {
      const own = features.filter((x) => ix.epicOf.get(x.id)?.key === e.key);
      const score = epicScore(ix, e);
      const epicRow = row(
        "tb-niveau-epic",
        [],
        folded,
        `${toggle(e.key, e.title, folded)}${e.id ? `<span class="tb-id">${esc(e.id)}</span>` : ""}<span>${esc(e.title)}</span>`,
        [
          esc(t("ui.board.count.features", { n: e.features.length })),
          "",
          "",
          "",
          "",
          `<span class="tb-jauge tb-${level(score)}"><span class="tb-barre" aria-hidden="true"><i style="width:${score}%"></i></span><b>${score} %</b></span>`,
          ticket(e.ticket),
        ],
      );
      const featureRows = own.map((x) => {
        const stories = x.stories.map((id) => ix.stories.get(id)).filter(Boolean);
        const title = `${toggle(x.id, x.title, folded, !stories.length)}<a href="#/${esc(x.page)}"><span class="tb-id">${esc(x.id)}</span><span>${esc(x.title)}</span></a>`;
        const featureRow = row("tb-niveau-fonction", [e.key], folded, title, [
          esc(x.roles.join(", ")),
          `${stories.length} · ${x.criteria}`,
          String(x.rules),
          kinds(ix, x.kinds),
          esc(x.since ?? "—"),
          gauge(x.depth),
          ticket(x.ticket),
        ]);
        const storyRows = stories.map((s) =>
          row(
            "tb-niveau-recit",
            [e.key, x.id],
            folded,
            `<a href="#/${esc(s.page)}~${esc(s.anchor)}"><span class="tb-id">${esc(s.id)}</span><span>${esc(s.title)}</span></a>`,
            [
              esc(s.role ?? ""),
              esc(t("ui.board.count.criteria", { n: s.criteria })),
              "",
              "",
              esc(s.since ?? "—"),
              "",
              ticket(s.ticket),
            ],
          ),
        );
        return featureRow + storyRows.join("");
      });
      return epicRow + featureRows.join("");
    })
    .join("");
  return `<div class="tableau tb-liste"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/** A select of the toolbar: "all", then its options. */
function select(name, label, options, value) {
  const opts = options
    .map(([v, text]) => `<option value="${esc(v)}"${v === value ? " selected" : ""}>${esc(text)}</option>`)
    .join("");
  return `<label class="tb-filtre"><span>${esc(label)}</span><select data-filter="${name}"><option value="">${esc(t("ui.board.filter.all"))}</option>${opts}</select></label>`;
}

/** The toolbar: the view, the filters, the number of features shown (filled by draw). Drawn once: a filter keeps
 *  its focus and its caret as the board below it changes. */
function toolbar(ix, f) {
  const roles = [...new Set(ix.B.features.flatMap((x) => x.roles))].sort();
  const views = VIEWS.map(
    (v) =>
      `<button type="button" data-view="${v}" aria-pressed="${f.view === v}">${icon(v === "map" ? "carte" : "liste")}${esc(t(`ui.board.view.${v}`))}</button>`,
  ).join("");
  return `<div class="tb-outils">
    <div class="tb-vues" role="group" aria-label="${esc(t("ui.board.views"))}">${views}</div>
    ${select(
      "who",
      t("ui.board.filter.who"),
      roles.map((r) => [r, r]),
      f.who,
    )}
    ${select(
      "epic",
      t("ui.board.filter.epic"),
      ix.epics.map((e) => [e.key, e.id ? `${e.id} · ${e.title}` : e.title]),
      f.epic,
    )}
    ${select(
      "version",
      t("ui.board.filter.version"),
      ix.B.versions.map((v) => [v ?? "-", versionLabel(v)]),
      f.version,
    )}
    ${select(
      "depth",
      t("ui.board.filter.depth"),
      LEVELS.map((l) => [l, t(`ui.board.depth.${l}`)]),
      f.depth,
    )}
    <label class="tb-filtre tb-texte"><span class="sr-only">${esc(t("ui.board.filter.text"))}</span><input type="search" data-filter="q" value="${esc(f.q)}" placeholder="${esc(t("ui.board.filter.text"))}"></label>
    <span class="tb-resultat" role="status"></span>
  </div>`;
}

/** The summary: the share specified, and the numbers of features, stories and criteria. */
function summary(ix) {
  const score = mean(ix.B.features.map((x) => x.depth.score));
  const criteria = ix.B.features.reduce((n, x) => n + x.criteria, 0);
  return `<div class="tb-resume"><span class="tb-anneau" style="--p:${score}" role="img" aria-label="${esc(t("ui.board.specified", { score }))}"><b>${score} %</b></span><dl>
    <div><dt>${esc(t("ui.board.summary.features"))}</dt><dd>${ix.B.features.length}</dd></div>
    <div><dt>${esc(t("ui.board.summary.stories"))}</dt><dd>${ix.B.stories.length}</dd></div>
    <div><dt>${esc(t("ui.board.summary.criteria"))}</dt><dd>${criteria}</dd></div>
    <div><dt>${esc(t("ui.board.summary.epics"))}</dt><dd>${ix.epics.filter((e) => e.id).length}</dd></div>
  </dl></div>`;
}

/** Draws one board into its place, and keeps it drawn as the filters change. */
function mount(el) {
  const B = EXT.api.data().board;
  if (!B || el.dataset.drawn) return;
  el.dataset.drawn = "1";
  const ix = indexOf(B);
  const remembered = memo.read(BOARD_KEY);
  const f = {
    // The view remembered, when it is one (the storage is the reader's, not the kit's).
    view: VIEWS.includes(remembered) ? remembered : matchMedia("(min-width: 720px)").matches ? "map" : "list",
    who: "",
    epic: "",
    version: "",
    depth: "",
    q: "",
  };
  // The rows folded in the list, by key (an epic's, a feature's): kept as the filters and the view change.
  const folded = new Set();
  el.innerHTML = `<div class="tb-tete"><h2>${esc(t("ui.board.title"))}</h2>${summary(ix)}</div>${toolbar(ix, f)}<div class="tb-corps"></div>`;
  const body = el.querySelector(".tb-corps");
  const status = el.querySelector(".tb-resultat");
  // Only the board below the toolbar is drawn again; the count and the view's buttons change in place.
  const draw = () => {
    const features = shown(ix, f);
    const print = Boolean(el.dataset.print);
    body.innerHTML = !features.length
      ? `<p class="tb-aucun">${esc(t("ui.board.empty"))}</p>`
      : f.view === "map" && !print
        ? map(ix, features)
        : list(ix, features, print ? new Set() : folded);
    status.textContent = t("ui.board.results", { n: features.length });
    for (const b of $$("[data-view]", el)) b.setAttribute("aria-pressed", String(b.dataset.view === f.view));
  };
  el.addEventListener("click", (e) => {
    const view = e.target.closest("[data-view]");
    if (view) {
      f.view = view.dataset.view;
      memo.write(BOARD_KEY, f.view);
      draw();
      return;
    }
    const button = e.target.closest("[data-toggle]");
    if (!button) return;
    const key = button.dataset.toggle;
    if (!folded.delete(key)) folded.add(key);
    draw();
    $$("[data-toggle]", body)
      .find((b) => b.dataset.toggle === key)
      ?.focus();
  });
  el.addEventListener("change", (e) => {
    const name = e.target.dataset.filter;
    if (!name || name === "q") return;
    f[name] = e.target.value;
    draw();
  });
  el.addEventListener("input", (e) => {
    if (e.target.dataset.filter !== "q") return;
    f.q = e.target.value;
    draw();
  });
  // The arrow keys go from a card of the map to the next one.
  el.addEventListener("keydown", (e) => {
    if (!e.target.matches("[data-card]") || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
    const cards = $$("[data-card]", el);
    const next = cards[cards.indexOf(e.target) + (e.key === "ArrowRight" ? 1 : -1)];
    if (next) {
      next.focus();
      e.preventDefault();
    }
  });
  el.redraw = draw;
  draw();
}

EXT.hydrators.push((root) => $$("[data-board]", root).forEach(mount));
// Printed, a board is its list, every level open.
window.addEventListener("beforeprint", () =>
  $$("[data-board]").forEach((el) => {
    el.dataset.print = "1";
    el.redraw?.();
  }),
);
window.addEventListener("afterprint", () =>
  $$("[data-board]").forEach((el) => {
    delete el.dataset.print;
    el.redraw?.();
  }),
);

}
{
/* A module of the site (engine/site/app.js, spliced in at its "@lib" line by the build, ARCHITECTURE.md §6.1a):
   it sees EXT.api only and adds to EXT. The before/after comparer (::before-after{}): the handle follows the pointer
   and the arrow keys. */
/* global EXT */
function enableComparer(stage) {
  const update = (x) => {
    const r = stage.getBoundingClientRect();
    const p = Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100));
    stage.style.setProperty("--pos", p + "%");
  };
  let dragging = false;
  stage.addEventListener("pointerdown", (e) => {
    dragging = true;
    stage.setPointerCapture(e.pointerId);
    update(e.clientX);
  });
  stage.addEventListener("pointermove", (e) => dragging && update(e.clientX));
  stage.addEventListener("pointerup", () => (dragging = false));
  stage.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const current = parseFloat(stage.style.getPropertyValue("--pos")) || 50;
    stage.style.setProperty("--pos", Math.max(0, Math.min(100, current + (e.key === "ArrowLeft" ? -5 : 5))) + "%");
    e.preventDefault();
  });
}

EXT.hydrators.push((root) => EXT.api.$$(".comparer-scene", root).forEach(enableComparer));

}
{
/* The search of the site, its pure part (ARCHITECTURE.md §6.1a, "Search"): what an entry of the index matches and how
   well — a term in the title before one in the text, at the start of a word before one inside it — the close words
   of a term the index does not hold (a typo: "ordrs" finds "orders"), and the marks of the terms found. The dialog,
   its keys and its spaces stay app.js's. A module of the site (engine/site/app.js, spliced in at its "@lib" line by
   the build, ARCHITECTURE.md §6.1a): it adds EXT.searchCore; the texts come normalised by app.js's `norm`. */
/* global EXT */

/** A letter or a digit, of any script. */
const WORD_CHAR = /^[\p{L}\p{N}]$/u;
const isWordChar = (ch) => ch !== undefined && WORD_CHAR.test(ch);

/** The terms of a query: its words of two characters or more, normalised. */
const termsOf = (q, norm) =>
  norm(q)
    .split(/\s+/)
    .filter((x) => x.length > 1);

/** How a term appears in a text: 0 absent, 1 inside a word, 2 at the start of one. */
function hit(text, term) {
  let found = 0;
  for (let i = text.indexOf(term); i >= 0; i = text.indexOf(term, i + 1)) {
    if (!isWordChar(text[i - 1])) return 2;
    found = 1;
  }
  return found;
}

/** Occurrences of a term in a text, at most four, one more when one starts a word. */
function occurrences(text, term) {
  let n = 0;
  let start = false;
  for (let i = text.indexOf(term); i >= 0 && n < 4; i = text.indexOf(term, i + 1)) {
    n++;
    start = start || !isWordChar(text[i - 1]);
  }
  return n + (start ? 1 : 0);
}

/** The score of one term in an entry: its title first, then its page's title, then its text. */
function termScore(e, term) {
  const inTitle = hit(e.nt, term);
  const inPage = hit(e.np, term);
  return (inTitle === 2 ? 12 : inTitle ? 8 : 0) + (inPage === 2 ? 4 : inPage ? 3 : 0) + occurrences(e.nx, term);
}

/**
 * The edits between two words (insert, delete, replace, swap two neighbours), or Infinity beyond `max`: the
 * comparison stops as soon as every way is beyond it.
 */
function distance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return Infinity;
  let before = null;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      let d = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + cost);
      if (before && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1])
        d = Math.min(d, before[j - 2] + 1);
      row.push(d);
      best = Math.min(best, d);
    }
    if (best > max) return Infinity;
    [before, prev] = [prev, row];
  }
  return prev[b.length] <= max ? prev[b.length] : Infinity;
}

/** The words of an index (three letters or more), once per index. */
const vocabularies = new WeakMap();
function vocabularyOf(index) {
  if (!vocabularies.has(index)) {
    const words = new Set();
    for (const e of index)
      for (const w of `${e.nt} ${e.np} ${e.nx}`.split(/[^\p{L}\p{N}]+/u)) if (w.length > 2) words.add(w);
    vocabularies.set(index, [...words]);
  }
  return vocabularies.get(index);
}

/**
 * The close words of a term no entry holds: one edit for 4 to 7 letters, two from 8, a whole word or its start; the
 * 8 closest — fewer edits first, a whole word before a start, then the order of the index.
 */
function closeWords(index, term) {
  const max = term.length >= 8 ? 2 : term.length >= 4 ? 1 : 0;
  if (!max) return [];
  const candidates = [];
  vocabularyOf(index).forEach((w, i) => {
    const whole = distance(term, w, max);
    const start = w.length > term.length ? distance(term, w.slice(0, term.length), max) : Infinity;
    const d = Math.min(whole, start);
    if (d <= max) candidates.push({ w, d, start: whole > d ? 1 : 0, i });
  });
  candidates.sort((a, b) => a.d - b.d || a.start - b.start || a.i - b.i);
  return candidates.slice(0, 8).map((c) => c.w);
}

/**
 * The entries a query matches, best first: each term (or, for a term no entry holds, one of its close words) in the
 * entry; a page entry slightly before its sections. `fuzzy`: the close words used.
 * @param {Array<{ a: string|null, nt: string, np: string, nx: string }>} index   the prepared index (app.js)
 * @param {string} q
 * @param {(s: string) => string} norm
 * @returns {{ found: Array<{ e: object, score: number, terms: string[] }>, fuzzy: string[] }}
 */
function match(index, q, norm) {
  const groups = termsOf(q, norm).map((term) => {
    const exact = index.some((e) => e.nt.includes(term) || e.np.includes(term) || e.nx.includes(term));
    return exact ? { words: [term], close: false } : { words: closeWords(index, term), close: true };
  });
  if (!groups.length || groups.some((g) => !g.words.length)) return { found: [], fuzzy: [] };
  const found = [];
  for (const e of index) {
    const all = `${e.nt} ${e.np} ${e.nx}`;
    let score = e.a ? 0 : 2;
    const terms = [];
    for (const g of groups) {
      const present = g.words.filter((w) => all.includes(w));
      if (!present.length) {
        score = -1;
        break;
      }
      const best = Math.max(...present.map((w) => termScore(e, w)));
      score += g.close ? Math.ceil(best / 2) : best;
      terms.push(...present);
    }

  // ─── Page table of contents + scroll tracking ─────────────────────────────
  function renderToc(p) {
    if (!p.toc || p.toc.length < 2) {
      toc.innerHTML = "";
      return;
    }
    toc.innerHTML =
      `<div class="toc-titre">${esc(t("ui.toc.title"))}</div>` +
      p.toc
        .map((h) => `<a class="h${h.level}" href="#/${p.id}~${h.id}" data-cible="${h.id}">${esc(h.title)}</a>`)
        .join("");
  }
  let tocFrame = 0;
  window.addEventListener(
    "scroll",
    () => {
      if (tocFrame) return;
      tocFrame = requestAnimationFrame(() => {
        tocFrame = 0;
        const links = $$("a[data-cible]", toc);
        if (!links.length) return;
        let active = links[0];
        for (const a of links) {
          const h = document.getElementById(a.dataset.cible);
          if (h && h.getBoundingClientRect().top < 140) active = a;
        }
        links.forEach((a) => a.classList.toggle("actif", a === active));
      });
    },
    { passive: true },
  );

  function scrollToAnchor(anchor, otherwiseTop) {
    if (anchor) {
      const el = document.getElementById(anchor);
      if (el) {
        el.scrollIntoView({ behavior: otherwiseTop ? "auto" : "smooth", block: "start" });
        return;
      }
    }
    if (otherwiseTop) window.scrollTo(0, 0);
  }

  // ─── Hydration of rendered content ────────────────────────────────────────
  function hydrate(root, page) {
    hydrateImages(root);
    for (const h of EXT.hydrators) h(root, page);
    if (page) markGlossary($(".contenu", root));
    enableZones(root);
    document.body.classList.remove("menu-ouvert");
  }

  // Screen zones reachable by keyboard: Tab focuses a zone (highlighted with its legend item), Enter or Space
  // opens its bubble; in the viewer, Enter or Space goes to that step of the tour. Their accessible name is
  // "Zone n: <legend>".
  const plain = (html) => {
    const div = document.createElement("div");
    div.innerHTML = html;
    return div.textContent.replace(/\s+/g, " ").trim();
  };
  function enableZones(root) {
    $$(".ecran-cadre > .zone", root).forEach((zone) => {
      const n = zone.dataset.n;
      zone.tabIndex = 0;
      zone.setAttribute("role", "button");
      zone.setAttribute("aria-label", t("ui.zone.label", { n, text: plain(legendText(zone.closest(".ecran"), n)) }));
    });
  }
  function activateZone(zone) {
    const n = zone.dataset.n;
    if (viewer.contains(zone)) {
      const i = viewerState.steps.indexOf(n);
      if (i >= 0) goToStep(i);
      return;
    }
    const fig = zone.closest(".ecran");
    highlight(fig, n, true);
    showBubble(`<span class="bulle-n">${n}</span>${legendText(fig, n)}`, zone);
  }

  // Glossary: the first occurrence of each term in the page gets a tooltip. Rebuilt by switchLanguage().
  function buildTerms() {
    return (D.glossary || []).map((g) => ({
      ...g,
      re: new RegExp(`(^|[^\\p{L}\\p{N}_])(${g.pattern})(?=$|[^\\p{L}\\p{N}_])`, "iu"),
    }));
  }
  let TERMS = buildTerms();
  function markGlossary(root) {
    if (!root || !TERMS.length) return;
    const remaining = new Set(TERMS);
    const excluded =
      "a, code, pre, h1, h2, h3, h4, kbd, .puce, .gl, .ecran-barre, .pastille, figcaption, .tableau th, svg, [data-board]";
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) =>
        !n.nodeValue.trim() || (n.parentElement && n.parentElement.closest(excluded))
          ? NodeFilter.FILTER_REJECT
          : NodeFilter.FILTER_ACCEPT,
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      if (!remaining.size) break;
      for (const term of remaining) {
        const m = term.re.exec(node.nodeValue);
        if (!m) continue;
        const start = m.index + m[1].length;
        const word = node.splitText(start);
        word.splitText(m[2].length);
        const span = document.createElement("span");
        span.className = "gl";
        span.tabIndex = 0;
        span.dataset.term = term.term;
        span.dataset.def = term.def;
        if (term.tech) span.dataset.tech = term.tech;
        word.parentNode.replaceChild(span, word);
        span.appendChild(word);
        remaining.delete(term);
        break;
      }
    }
  }

  // Glossary bubble content: the term and its definition, then its technical correspondence (§6.8) when the term
  // has one and the reader can see it: no spaces declared, everything, or a space whose kind shows it (`tech`: admin,
  // develop; the export of another space never embeds `tech` at all, engine/build/spaces.mjs).
  function glossaryBubble(gl) {
    const showTech = gl.dataset.tech && (!SPACES || currentSpace === null || !!spacesById[currentSpace]?.tech);
    const tech = showTech
      ? `<div class="bulle-tech">${esc(t("ui.glossary.technical"))} ${esc(gl.dataset.tech)}</div>`
      : "";
    return `<strong>${esc(gl.dataset.term)}</strong> — ${esc(gl.dataset.def)}${tech}`;
  }

  // ─── Tooltips (screen zones + glossary) ───────────────────────────────────
  let bubbleTarget = null;
  function showBubble(html, target) {
    bubble.innerHTML = html;
    bubble.classList.add("visible");
    bubbleTarget = target;
    placeBubble(target);
  }
  function placeBubble(target) {
    const r = target.getBoundingClientRect();
    const b = bubble.getBoundingClientRect();
    let top = r.bottom + 10;
    if (top + b.height > window.innerHeight - 8) top = Math.max(8, r.top - b.height - 10);
    let left = Math.min(Math.max(8, r.left), window.innerWidth - b.width - 8);
    bubble.style.top = top + "px";
    bubble.style.left = left + "px";
  }
  function hideBubble() {
    bubble.classList.remove("visible");
    bubbleTarget = null;
  }
  // A scroll (the page following the keyboard focus, a wheel) moves the bubble with its target; it closes only
  // when the target leaves the window. Hiding it on every scroll closed the bubble a zone had just opened with
  // Enter whenever focusing that zone had scrolled the page.
  function followBubble() {
    if (!bubbleTarget || !bubble.classList.contains("visible")) return;
    const r = bubbleTarget.getBoundingClientRect();
    if (!bubbleTarget.isConnected || r.bottom < 0 || r.top > window.innerHeight) hideBubble();
    else placeBubble(bubbleTarget);
  }

  function legendText(fig, n) {
    const li = fig && fig.querySelector(`ol.legende > li[data-n="${n}"] > div`);
    return li ? li.innerHTML : "";
  }
  function highlight(fig, n, on) {
    if (!fig) return;
    $$(`.zone[data-n="${n}"], ol.legende > li[data-n="${n}"]`, fig).forEach((el) => el.classList.toggle("allume", on));
  }

  document.addEventListener("mouseover", (e) => {
    const zone = e.target.closest(".zone");
    if (zone) {
      const fig = zone.closest(".ecran") || viewerState.fig;
      highlight(zone.closest(".ecran"), zone.dataset.n, true);
      if (!(viewerState.open && viewerState.tour)) {
        showBubble(`<span class="bulle-n">${zone.dataset.n}</span>${legendText(fig, zone.dataset.n)}`, zone);
      }
      return;
    }
    const li = e.target.closest("ol.legende > li");
    if (li) {
      highlight(li.closest(".ecran"), li.dataset.n, true);
      return;
    }
    const gl = e.target.closest(".gl");
    if (gl) showBubble(glossaryBubble(gl), gl);
  });
  document.addEventListener("mouseout", (e) => {
    const zone = e.target.closest(".zone");
    if (zone) {
      highlight(zone.closest(".ecran"), zone.dataset.n, false);
      hideBubble();
      return;
    }
    const li = e.target.closest("ol.legende > li");
    if (li) highlight(li.closest(".ecran"), li.dataset.n, false);
    if (e.target.closest(".gl")) hideBubble();
  });
  document.addEventListener("focusin", (e) => {
    const gl = e.target.closest && e.target.closest(".gl");
    if (gl) showBubble(glossaryBubble(gl), gl);
    const zone = e.target.closest && e.target.closest(".ecran .zone");
    if (zone) highlight(zone.closest(".ecran"), zone.dataset.n, true);
  });
  document.addEventListener("focusout", (e) => {
    if (e.target.closest && e.target.closest(".gl")) hideBubble();
    const zone = e.target.closest && e.target.closest(".ecran .zone");
    if (zone) {
      highlight(zone.closest(".ecran"), zone.dataset.n, false);
      hideBubble();
    }
  });
  window.addEventListener("scroll", followBubble, { passive: true });

  // ─── Viewer: enlarge + guided tour ────────────────────────────────────────
  const viewer = $("#visionneuse");
  const scene = $("#vis-scene");
  const viewerState = { open: false, tour: false, fig: null, steps: [], i: 0, back: null };

  // Dialogs (viewer, search): Tab stays inside while open; closing gives the focus back to where it was.
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])';
  function trapTab(e, container) {
    const items = $$(FOCUSABLE, container).filter((el) => el.getClientRects().length > 0);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    const inside = container.contains(document.activeElement);
    if (e.shiftKey && (!inside || document.activeElement === first)) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && (!inside || document.activeElement === last)) {
      e.preventDefault();
      first.focus();
    }
  }
  function giveFocusBack(el) {
    if (el && el.isConnected && typeof el.focus === "function") el.focus({ preventScroll: true });
  }

  function openViewer(fig, tour) {
    const img = $("img[data-img]", fig);
    if (!viewerState.open) viewerState.back = document.activeElement;
    viewerState.fig = fig;
    viewerState.steps = $$("ol.legende > li", fig).map((li) => li.dataset.n);
    viewerState.open = true;
    $("#vis-titre").textContent = fig.dataset.titre || "";
    $("#vis-visite").style.display = viewerState.steps.length ? "" : "none";
    const zones = $$(".ecran-cadre > .zone", fig)
      .map((z) => z.outerHTML)
      .join("");
    // The CSS size of the capture (its zone file), not the image's own pixels: a capture taken at capture.scale 2
    // stays sharp at the same size on a high-density screen.
    const size = img.getAttribute("width")
      ? ` width="${esc(img.getAttribute("width"))}" height="${esc(img.getAttribute("height") || "")}"`
      : "";
    scene.innerHTML = `<div class="vis-image"><img alt="${esc(fig.dataset.titre || "")}" src="${imageSrc(img.dataset.img)}"${size}>${zones}<div class="projecteur" hidden></div><div class="vis-carte" hidden></div></div>`;
    viewer.classList.add("ouverte");
    document.body.style.overflow = "hidden";
    hideBubble();
    if (tour && viewerState.steps.length) {
      const image = $("img", scene);
      const start = () => goToStep(0);
      if (image.complete) requestAnimationFrame(start);
      else image.addEventListener("load", start, { once: true });
    } else {
      viewerState.tour = false;
      viewer.classList.remove("en-visite");
    }
    $("#vis-fermer").focus();
  }
  function closeViewer() {
    viewer.classList.remove("ouverte", "en-visite");
    viewerState.open = false;
    viewerState.tour = false;
    scene.innerHTML = "";
    document.body.style.overflow = "";
    hideBubble();
    giveFocusBack(viewerState.back);
    viewerState.back = null;
  }
  function goToStep(i) {
    const n = viewerState.steps.length;
    if (!n) return;
    viewerState.tour = true;
    viewer.classList.add("en-visite");
    viewerState.i = Math.max(0, Math.min(n - 1, i));
    const num = viewerState.steps[viewerState.i];
    const frame = $(".vis-image", scene);
    const zone = $(`.zone[data-n="${num}"]`, frame);
    const spot = $(".projecteur", frame);
    const card = $(".vis-carte", frame);
    $$(".zone", frame).forEach((z) => z.classList.toggle("allume", z === zone));
    spot.hidden = false;
    spot.style.left = `calc(${zone.style.left} - 6px)`;
    spot.style.top = `calc(${zone.style.top} - 6px)`;
    spot.style.width = `calc(${zone.style.width} + 12px)`;
    spot.style.height = `calc(${zone.style.height} + 12px)`;
    const last = viewerState.i === n - 1;
    card.hidden = false;
    card.innerHTML = `<div class="entete"><span class="n">${num}</span>${esc(t("ui.tour.step", { i: viewerState.i + 1, n }))}</div>
      <div>${legendText(viewerState.fig, num)}</div>
      <div class="actions">
        ${viewerState.i > 0 ? `<button class="bouton" data-vis="prec">${icon("left")}${esc(t("ui.tour.previous"))}</button>` : ""}
        <button class="bouton primaire" data-vis="${last ? "fin" : "suiv"}">${esc(last ? t("ui.tour.finish") : t("ui.tour.next"))}${last ? "" : icon("chevron")}</button>
      </div>`;
    // Brings the zone to the centre of the viewer (enlarged, scrollable image), then places the card.
    card.style.visibility = "hidden";
    requestAnimationFrame(() => {
      zone.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      setTimeout(() => {
        placeCard(frame, zone, card);
        card.style.visibility = "";
      }, 380);
    });
  }
  function placeCard(frame, zone, card) {
    const c = frame.getBoundingClientRect();
    const z = zone.getBoundingClientRect();
    const w = card.offsetWidth;
    const h = card.offsetHeight;
    const margin = 14;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const candidates = [
      [z.right + 18, z.top],
      [z.left - 18 - w, z.top],
      [z.left, z.bottom + 18],
      [z.left, z.top - 18 - h],
    ];
    let pos = candidates.find(([x, y]) => x >= margin && y >= margin && x + w <= vw - margin && y + h <= vh - margin);
    if (!pos)
      pos = [
        Math.min(Math.max(margin, z.left), vw - w - margin),
        Math.min(Math.max(margin, z.bottom + 18), vh - h - margin),
      ];
    card.style.left = pos[0] - c.left + "px";
    card.style.top = pos[1] - c.top + "px";
  }
  viewer.addEventListener("click", (e) => {
    const b = e.target.closest("[data-vis]");
    if (b) {
      const a = b.dataset.vis;
      if (a === "suiv") goToStep(viewerState.i + 1);
      else if (a === "prec") goToStep(viewerState.i - 1);
      else closeViewer();
      return;
    }
    const zone = e.target.closest(".zone");
    if (zone) {
      const i = viewerState.steps.indexOf(zone.dataset.n);
      if (i >= 0) goToStep(i);
      return;
    }
    if (e.target === scene) closeViewer();
  });
  $("#vis-fermer").addEventListener("click", closeViewer);
  $("#vis-visite").addEventListener("click", () => goToStep(0));
  window.addEventListener("resize", () => {
    if (viewerState.open && viewerState.tour) goToStep(viewerState.i);
  });

  // ─── Global clicks ────────────────────────────────────────────────────────
  document.addEventListener("click", (e) => {
    const action = e.target.closest("[data-action]");
    const zone = e.target.closest(".ecran .zone");
    if (zone) {
      const li = zone.closest(".ecran").querySelector(`ol.legende > li[data-n="${zone.dataset.n}"]`);
      if (li) {
        li.scrollIntoView({ behavior: "smooth", block: "center" });
        li.classList.add("allume");
        setTimeout(() => li.classList.remove("allume"), 1400);
      }
      return;
    }
    if (!action) return;
    const a = action.dataset.action;
    if (a === "zoom") openViewer(action.closest(".ecran"), false);
    else if (a === "visite") openViewer(action.closest(".ecran"), true);
    else if (a === "recherche") openSearch();
  });

  // ─── Search ───────────────────────────────────────────────────────────────
  const searchBackdrop = $("#recherche");
  const field = $("#recherche-champ");
  const resultList = $("#recherche-resultats");
  // Rebuilt by switchLanguage() from the translated pages and search entries.
  function buildIndex() {
    return D.search.map((e) => {
      const p = D.pages[e.p];
      return { ...e, nt: norm(e.t), np: norm(p ? p.title : ""), nx: norm(e.x) };
    });
  }
  let INDEX = buildIndex();
  let results = [];
  let selection = 0;

  // The query, scored by the module (lib/search-core.js); the scope chosen in the dialog (null: every space).
  let scope = null;
  let closeUsed = [];
  function search(q) {
    const { found, fuzzy } = EXT.searchCore.match(INDEX, q, norm);
    closeUsed = fuzzy;
    return bySpace(scope ? found.filter((x) => spaceOfResult(x) === scope) : found).slice(0, 24);
  }
  const mark = (text, terms) => EXT.searchCore.mark(text, terms, norm, esc);
  // A space current: its results first, then those of each other space (declaration order), under a heading
  // "In {space} ({n})"; the limit applies to the whole list. "Everything": the order of the scores.
  const spaceOfResult = (x) => (D.pages[x.e.p] ? D.pages[x.e.p].space : null);
  function bySpace(found) {
    if (!SPACES || !currentSpace) return found;
    const rank = (x) => {
      const s = spaceOfResult(x);
      const k = SPACES.findIndex((sp) => sp.id === s);
      return s === currentSpace ? -1 : k < 0 ? SPACES.length : k;
    };
    return found
      .map((x, i) => [x, i])
      .sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1])
      .map((a) => a[0]);
  }
  function resultHeading(r, i) {
    if (!SPACES || !currentSpace || scope) return "";
    const s = spaceOfResult(r[i]);
    if (s === currentSpace || !spacesById[s] || (i > 0 && spaceOfResult(r[i - 1]) === s)) return "";
    const n = r.filter((x) => spaceOfResult(x) === s).length;
    return `<div class="recherche-groupe">${esc(t("ui.search.inSpace", { space: spacesById[s].shortTitle, n }))}</div>`;
  }
  /** "Everything" mode: the path of a result starts with its space. */
  const spacePath = (p) =>
    SPACES && !currentSpace && spacesById[p.space] ? `${esc(spacesById[p.space].shortTitle)} › ` : "";

  const scopeBox = $("#recherche-portee");
  function renderScope() {
    if (!scopeBox || !SPACES || SPACES.length < 2) return;
    const chip = (id, label) =>
      `<button type="button" class="portee" data-scope="${esc(id)}" aria-pressed="${(scope || "") === id}">${esc(label)}</button>`;
    scopeBox.setAttribute("aria-label", t("ui.search.scope"));
    scopeBox.innerHTML = `<span>${esc(t("ui.search.scope"))}</span>${chip("", t("ui.search.scope.all"))}${SPACES.map((x) => chip(x.id, x.shortTitle)).join("")}`;
    scopeBox.hidden = false;
  }
  scopeBox?.addEventListener("click", (e) => {
    const b = e.target.closest("[data-scope]");
    if (!b) return;
    scope = b.dataset.scope || null;
    selection = 0;
    renderScope();
    renderResults();
  });

  // Screen readers hear the number of results (role="status", aria-live="polite").
  const searchStatus = $("#recherche-statut");
  const announce = (text) => {
    if (searchStatus && searchStatus.textContent !== text) searchStatus.textContent = text;
  };
  function renderResults() {
    const q = field.value.trim();
    if (!q) {
      announce("");
      const suggestions = (D.suggestions || []).filter((pid) => D.pages[pid]);
      resultList.innerHTML =
        `<div class="recherche-vide" style="text-align:left;padding:10px 12px 4px">${esc(t("ui.search.suggestions"))}</div>` +
        suggestions
          .map(
            (pid, i) =>
              `<a class="resultat ${i === selection ? "actif" : ""}" href="#/${pid}"><div class="chemin">${esc(sectionsById[D.pages[pid].section].title)}</div><div class="titre">${esc(D.pages[pid].title)}</div></a>`,
          )
          .join("");
      results = suggestions.map((pid) => ({ link: "#/" + pid }));
      return;
    }
    const r = search(q);
    // A term the index does not hold was read as its close words: said first, and heard with the count.
    const note = r.length && closeUsed.length ? t("ui.search.fuzzy", { words: closeUsed.join(", ") }) : "";
    const count = r.length ? t("ui.search.count", { n: r.length }) : t("ui.search.noResult", { query: q });
    announce(note ? `${note}. ${count}` : count);
    const close = note ? `<div class="recherche-proche">${esc(note)}</div>` : "";
    results = r.map((x) => ({ link: "#/" + x.e.p + (x.e.a ? "~" + x.e.a : "") }));
    if (!r.length) {
      resultList.innerHTML = `<div class="recherche-vide">${esc(t("ui.search.noResult", { query: q }))}</div>`;
      return;
    }
    resultList.innerHTML =
      close +
      r
        .map(({ e, terms }, i) => {
          const p = D.pages[e.p];
          const pos = Math.max(
            0,
            terms.reduce((m, term) => {
              const k = e.nx.indexOf(term);
              return k >= 0 && (m < 0 || k < m) ? k : m;
            }, -1),
          );
          const start = Math.max(0, pos - 50);
          const excerpt =
            (start > 0 ? "…" : "") + e.x.slice(start, start + 170) + (e.x.length > start + 170 ? "…" : "");
          return `${resultHeading(r, i)}<a class="resultat ${i === selection ? "actif" : ""}" href="${results[i].link}">
          <div class="chemin">${spacePath(p)}${esc(sectionsById[p.section].title)} › ${esc(p.title)}</div>
          <div class="titre">${mark(e.t, terms)}</div>
          <div class="extrait">${mark(excerpt, terms)}</div></a>`;
        })
        .join("");
  }
  let searchBack = null;
  function openSearch() {
    if (!searchBackdrop.classList.contains("ouverte")) searchBack = document.activeElement;
    searchBackdrop.classList.add("ouverte");
    selection = 0;
    renderScope();
    renderResults();
    field.focus();
    field.select();
  }
  function closeSearch() {
    if (!searchBackdrop.classList.contains("ouverte")) return;
    searchBackdrop.classList.remove("ouverte");
    giveFocusBack(searchBack);
    searchBack = null;
  }
  $("#ouvrir-recherche").addEventListener("click", openSearch);
  field.addEventListener("input", () => {
    selection = 0;
    renderResults();
  });
  field.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!results.length) return;
      selection = (selection + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
      $$(".resultat", resultList).forEach((a, i) => a.classList.toggle("actif", i === selection));
      const a = $$(".resultat", resultList)[selection];
      if (a) a.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      const r = results[selection];
      if (r) {
        location.hash = r.link;
        closeSearch();
      }
    }
  });
  resultList.addEventListener("click", (e) => {
    if (e.target.closest(".resultat")) closeSearch();
  });
  searchBackdrop.addEventListener("click", (e) => {
    if (e.target === searchBackdrop) closeSearch();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      if (searchBackdrop.classList.contains("ouverte")) trapTab(e, searchBackdrop);
      else if (viewerState.open) trapTab(e, viewer);
      return;
    }
    const zone = (e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".zone[tabindex]");
    if (zone) {
      e.preventDefault();
      activateZone(zone);
      return;
    }
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      openSearch();
      return;
    }
    if (e.key === "/" && !inField && !viewerState.open) {
      e.preventDefault();
      openSearch();
      return;
    }
    if (e.key === "Escape") {
      if (searchBackdrop.classList.contains("ouverte")) closeSearch();
      else if (viewerState.open) closeViewer();
      else if (bubble.classList.contains("visible")) hideBubble();
      else document.body.classList.remove("menu-ouvert");
      return;
    }
    if (viewerState.open && viewerState.tour) {
      if (e.key === "ArrowRight") goToStep(viewerState.i + 1);
      if (e.key === "ArrowLeft") goToStep(viewerState.i - 1);
    }
  });

  // ─── Printing (current page or the whole documentation) ───────────────────
  $("#bouton-imprimer").addEventListener("click", () => {
    const everything = currentPage ? window.confirm(t("ui.print.confirm")) : true;
    if (!everything) {
      window.print();
      return;
    }
    const target = $("#impression");
    const outline = D.sections
      .map(
        (s) =>
          `<h3>${esc(s.title)}</h3><ol>${s.groups
            .flatMap((g) => g.pages)
            .map((pid) => `<li>${esc(D.pages[pid].title)}</li>`)
            .join("")}</ol>`,
      )
      .join("");
    target.innerHTML =
      `<section class="page-imprimee article"><h1 class="page-titre">${esc(D.meta.title)}</h1><p class="page-resume">${esc(D.meta.tagline)}</p><p>${esc(t("ui.print.version", { product: D.meta.product, version: D.meta.version, date: D.meta.date }))}</p><div class="contenu">${outline}</div></section>` +
      D.order
        .map((pid) => {
          const p = D.pages[pid];
          return `<section class="page-imprimee article"><div class="ariane">${esc(sectionsById[p.section].title)}${p.group ? " › " + esc(p.group) : ""}${parentOf[p.id] ? " › " + esc(D.pages[parentOf[p.id]].menuTitle || D.pages[parentOf[p.id]].title) : ""}</div><h1 class="page-titre">${esc(p.title)}</h1>${p.summary ? `<p class="page-resume">${esc(p.summary)}</p>` : ""}<div class="contenu">${p.html}</div></section>`;
        })
        .join("");
    hydrate(target); // its images, its modules (a board in a page), its zones
    document.body.classList.add("impression-complete");
    const images = $$("img", target);
    // Eager: a `loading="lazy"` image far enough down this one long page (every page concatenated) may never be
    // considered "near the viewport" by the browser, so it would never load and decode() would never resolve —
    // print() would then never run. Printing needs everything immediately, not deferred.
    for (const i of images) i.loading = "eager";
    Promise.all(images.map((i) => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()))).then(() => {
      window.print();
    });
  });
  window.addEventListener("afterprint", () => {
    if (document.body.classList.contains("impression-complete")) {
      document.body.classList.remove("impression-complete");
      $("#impression").innerHTML = "";
    }
  });

  // ─── Router (#/section, #/page/id, #/page/id~anchor) ──────────────────────
  // With spaces, also #/@<id>: the home page of a space (#/@: everything).
  // With languages, #/[<lang>/]<path>[~anchor]: the first segment is a language when it is one of LANGUAGES
  // (hence languages.idClash at the build); without it, the URL means the current language. After routing,
  // a URL without a prefix is rewritten with history.replaceState (no hashchange, no history entry) so that
  // the address bar always carries the language; the language is switched BEFORE chooseSpace and any render.
  let routed = { path: "", anchor: "" };
  function route() {
    closeSearch();
    if (viewerState.open) closeViewer();
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const [rest, anchor] = h.split("~");
    const segments = rest.split("/");
    let prefix = null;
    if (LANGUAGES && LANGUAGES.includes(segments[0])) prefix = segments.shift();
    const path = segments.join("/");
    if (LANGUAGES) {
      const target = initialLanguage(prefix);
      if (target !== currentLang) switchLanguage(target);
      renderLanguages();
      if (!prefix) history.replaceState(null, "", "#/" + currentLang + "/" + path + (anchor ? "~" + anchor : ""));
    }
    routed = { path, anchor: anchor || "" };
    chooseSpace(path);
    if (!path || path.charAt(0) === "@") showHome();
    else if (D.pages[path]) showPage(path, anchor);
    else if (sectionsById[path]) showSection(sectionsById[path]);
    else showNotFound(path);
    main.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
