href=\"#/use/settings~what-it-is-for\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>The \u003cstrong>profile\u003c/strong> holds your name, language and theme. This page uses the French spellings of the syntax, which\nare accepted on an equal footing.\u003c/p>\n\u003caside class=\"encadre astuce\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2Z\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Astuce\u003c/div>\u003cp>Light, Dark and System are saved to your profile, but this demo does not actually change the page&#39;s colours yet.\u003c/p>\n\u003c/div>\u003c/aside>\n\u003ch2 id=\"the-screen\">The screen\u003ca class=\"ancre\" href=\"#/use/settings~the-screen\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cfigure class=\"ecran\" data-capture=\"settings-profile\" data-titre=\"Settings · profile\">\n      \u003cdiv class=\"ecran-barre\">\u003cspan class=\"ecran-points\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"ecran-titre\">Settings · profile\u003c/span>\n      \u003cbutton class=\"bouton primaire\" type=\"button\" data-action=\"visite\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M7 4.5v15l12-7.5-12-7.5Z\"/>\u003c/svg>\u003cspan>Visite guidée\u003cspan class=\"libelle-long\"> · 2 étapes\u003c/span>\u003c/span>\u003c/button>\n      \u003cbutton class=\"bouton\" type=\"button\" data-action=\"zoom\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7\"/>\u003c/svg>\u003cspan class=\"libelle-long\">Agrandir\u003c/span>\u003c/button>\u003c/div>\n      \u003cdiv class=\"ecran-cadre\" data-action=\"zoom\">\u003cimg data-img=\"settings-profile\" alt=\"Settings · profile\" width=\"708\" height=\"595\" loading=\"lazy\">\u003cdiv class=\"zone\" data-n=\"1\" style=\"left:7.63%;top:14.59%;width:84.75%;height:49.66%\">\u003cspan class=\"pastille\">1\u003c/span>\u003c/div>\u003cdiv class=\"zone cote-droit\" data-n=\"2\" style=\"left:7.63%;top:88.56%;width:9.7%;height:8.03%\">\u003cspan class=\"pastille\">2\u003c/span>\u003c/div>\u003c/div>\n      \n      \u003col class=\"legende\">\u003cli data-n=\"1\">\u003cspan class=\"n\">1\u003c/span>\u003cdiv>\u003cstrong>Profile\u003c/strong>: name, language and theme.\u003c/div>\u003c/li>\u003cli data-n=\"2\">\u003cspan class=\"n\">2\u003c/span>\u003cdiv>\u003cstrong>Save\u003c/strong>: applies the changes.\u003c/div>\u003c/li>\u003c/ol>\u003c/figure>\u003ch2 id=\"step-by-step\">Step by step\u003ca class=\"ancre\" href=\"#/use/settings~step-by-step\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003col class=\"etapes\">\n\u003cli>Open \u003cspan class=\"puce menu\">Settings\u003c/span>.\u003c/li>\n\u003cli>Change the \u003cstrong>Profile\u003c/strong>.\u003c/li>\n\u003cli>Click \u003cstrong>Save\u003c/strong>.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"settings-reference\">Settings reference\u003ca class=\"ancre\" href=\"#/use/settings~settings-reference\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Setting\u003c/th>\n\u003cth>Control\u003c/th>\n\u003cth>Values · default\u003c/th>\n\u003cth>Effect\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Language\u003c/td>\n\u003ctd>List\u003c/td>\n\u003ctd>English · Français\u003c/td>\n\u003ctd>Interface language\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Theme\u003c/td>\n\u003ctd>Switch\u003c/td>\n\u003ctd>Light · Dark · System\u003c/td>\n\u003ctd>Colours\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"encadre erreur\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M7.9 2h8.2L22 7.9v8.2L16.1 22H7.9L2 16.1V7.9Z\"/>\u003cpath d=\"m15 9-6 6M9 9l6 6\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">No validation\u003c/div>\u003cp>An empty name is saved as it is: the demo does not check it.\u003c/p>\n\u003c/div>\u003c/aside>\n\u003ch2 id=\"required-permissions\">Required permissions\u003ca class=\"ancre\" href=\"#/use/settings~required-permissions\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003caside class=\"encadre droits\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Droits requis\u003c/div>\u003cp>Save: \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>settings:write\u003c/span>; status \u003cspan class=\"puce statut\" style=\"--c:var(--st-0)\">Open\u003c/span>; shortcut \u003ckbd>Ctrl\u003c/kbd>+\u003ckbd>S\u003c/kbd>.\u003c/p>\n\u003c/div>\u003c/aside>\n","toc":[{"id":"what-it-is-for","titre":"What it is for","niveau":2},{"id":"the-screen","titre":"The screen","niveau":2},{"id":"step-by-step","titre":"Step by step","niveau":2},{"id":"settings-reference","titre":"Settings reference","niveau":2},{"id":"required-permissions","titre":"Required permissions","niveau":2}],"captures":1,"space":"business","verified":{"version":"1.4.0","date":"2026-10-02"}},"features/track-orders":{"id":"features/track-orders","titre":"Track orders","titre_menu":"Track orders","resume":"Filter the orders list and open an order to see its status.","section":"features","groupe":"Feature sheets","niveau":1,"routes":[],"droits":["orders:read"],"html":"\u003ch2 id=\"access\">Access\u003ca class=\"ancre\" href=\"#/features/track-orders~access\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Module\u003c/td>\n\u003ctd>Orders\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Who can use it\u003c/td>\n\u003ctd>\u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prerequisites\u003c/td>\n\u003ctd>None: the list works for anyone signed in\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Checked on\u003c/td>\n\u003ctd>v1.4.0, 2026-10-02\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"what-it-is-for\">What it is for\u003ca class=\"ancre\" href=\"#/features/track-orders~what-it-is-for\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003cstrong>Track orders\u003c/strong> is the first thing a team member sees after signing in: the full orders list, filtered by\nstatus, customer or date, with today&#39;s figures above it and a way into each order&#39;s details.\u003c/p>\n\u003ch2 id=\"who-uses-it\">Who uses it\u003ca class=\"ancre\" href=\"#/features/track-orders~who-uses-it\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Team member\u003c/strong>: filters the list to find an order, then opens it to check its status.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"main-scenario\">Main scenario\u003ca class=\"ancre\" href=\"#/features/track-orders~main-scenario\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003col class=\"etapes\">\n\u003cli>A \u003cstrong>team member\u003c/strong> opens \u003ca href=\"#/use/orders\">the orders list\u003c/a>.\u003c/li>\n\u003cli>They narrow it with the \u003cstrong>status\u003c/strong>, \u003cstrong>customer\u003c/strong> or \u003cstrong>date\u003c/strong> filter, alone or together.\u003c/li>\n\u003cli>\u003cstrong>Order summary\u003c/strong> recalculates to match the filtered list (\u003ca class=\"puce regle\" href=\"#/features/rules~br-03\" title=\"Today's figures follow the current filters\">BR-03\u003c/a>).\u003c/li>\n\u003cli>They open an order from the list to see \u003ca href=\"#/use/orders/detail\">its details\u003c/a>.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"business-rules\">Business rules\u003ca class=\"ancre\" href=\"#/features/track-orders~business-rules\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ca class=\"puce regle\" href=\"#/features/rules~br-01\" title=\"An order is Open, Shipped or Cancelled\">BR-01\u003c/a> limits a status to three values; \u003ca class=\"puce regle\" href=\"#/features/rules~br-03\" title=\"Today's figures follow the current filters\">BR-03\u003c/a> governs the figures above the table.\u003c/p>\n\u003ch2 id=\"limits\">Limits\u003ca class=\"ancre\" href=\"#/features/track-orders~limits\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>The filters are not kept anywhere once you leave the page: coming back to the list starts from \u003cstrong>All\u003c/strong> again.\u003c/li>\n\u003c/ul>\n","toc":[{"id":"access","titre":"Access","niveau":2},{"id":"what-it-is-for","titre":"What it is for","niveau":2},{"id":"who-uses-it","titre":"Who uses it","niveau":2},{"id":"main-scenario","titre":"Main scenario","niveau":2},{"id":"business-rules","titre":"Business rules","niveau":2},{"id":"limits","titre":"Limits","niveau":2}],"captures":0,"space":"business","verified":{"version":"1.4.0","date":"2026-10-02"}},"features/approve-order":{"id":"features/approve-order","titre":"Approve an order","titre_menu":"Approve an order","resume":"Open an order's approval chain so the approvers are notified.","section":"features","groupe":"Feature sheets","niveau":1,"routes":[],"droits":["orders:read","orders:approve"],"html":"\u003ch2 id=\"access\">Access\u003ca class=\"ancre\" href=\"#/features/approve-order~access\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Module\u003c/td>\n\u003ctd>Orders\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Who can use it\u003c/td>\n\u003ctd>\u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span> to open the order, \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:approve\u003c/span> to open its \u003cstrong>Approval chain\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prerequisites\u003c/td>\n\u003ctd>An existing order\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Checked on\u003c/td>\n\u003ctd>v1.4.0, 2026-10-02\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"what-it-is-for\">What it is for\u003ca class=\"ancre\" href=\"#/features/approve-order~what-it-is-for\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003cstrong>Approve an order\u003c/strong> gives every order a trail: the \u003cstrong>Approval chain\u003c/strong> link on an order&#39;s page. The first time\nanyone opens it, Acme Orders creates the chain and notifies the approvers; opening it again just shows it.\u003c/p>\n\u003ch2 id=\"who-uses-it\">Who uses it\u003ca class=\"ancre\" href=\"#/features/approve-order~who-uses-it\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Team member\u003c/strong>: opens an order and follows its \u003cstrong>Approval chain\u003c/strong> link.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"trigger-and-preconditions\">Trigger and preconditions\u003ca class=\"ancre\" href=\"#/features/approve-order~trigger-and-preconditions\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Following the \u003cstrong>Approval chain\u003c/strong> link on \u003ca href=\"#/use/orders/detail\">an order&#39;s details\u003c/a> starts it. No earlier step\nis required: any existing order can have its chain created this way.\u003c/p>\n\u003ch2 id=\"main-scenario\">Main scenario\u003ca class=\"ancre\" href=\"#/features/approve-order~main-scenario\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003col class=\"etapes\">\n\u003cli>A \u003cstrong>team member\u003c/strong> opens an order.\u003c/li>\n\u003cli>They follow the \u003cstrong>Approval chain\u003c/strong> link.\u003c/li>\n\u003cli>Acme Orders creates the chain for this order and notifies the approvers (\u003ca class=\"puce regle\" href=\"#/features/rules~br-02\" title=\"Opening an order's approval chain creates it\">BR-02\u003c/a>).\u003c/li>\n\u003cli>The team member sees the chain; a later visit shows the same chain, unchanged.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"business-rules\">Business rules\u003ca class=\"ancre\" href=\"#/features/approve-order~business-rules\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ca class=\"puce regle\" href=\"#/features/rules~br-02\" title=\"Opening an order's approval chain creates it\">BR-02\u003c/a> is the one rule this feature exists to apply.\u003c/p>\n\u003ch2 id=\"limits\">Limits\u003ca class=\"ancre\" href=\"#/features/approve-order~limits\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>Opening the link is enough: a quick look, a shared link preview or an automated tool that follows it also\ncreates the chain and notifies the approvers, whether or not that was intended (\u003ca href=\"#/secure/api-surface~the-routes\">the API surface\u003c/a>\ndescribes this more precisely for the takeover team).\u003c/li>\n\u003c/ul>\n","toc":[{"id":"access","titre":"Access","niveau":2},{"id":"what-it-is-for","titre":"What it is for","niveau":2},{"id":"who-uses-it","titre":"Who uses it","niveau":2},{"id":"trigger-and-preconditions","titre":"Trigger and preconditions","niveau":2},{"id":"main-scenario","titre":"Main scenario","niveau":2},{"id":"business-rules","titre":"Business rules","niveau":2},{"id":"limits","titre":"Limits","niveau":2}],"captures":0,"space":"business","counterpart":{"id":"secure/api-surface","anchor":"the-routes"},"verified":{"version":"1.4.0","date":"2026-10-02"}},"features/rules":{"id":"features/rules","titre":"Business rules","titre_menu":"Business rules","resume":"The rules shared by several features, defined once and cited everywhere.","section":"features","groupe":"Feature sheets","niveau":1,"routes":[],"droits":[],"html":"\u003ch2 id=\"how-to-read-this-page\">How to read this page\u003ca class=\"ancre\" href=\"#/features/rules~how-to-read-this-page\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>A rule is defined once, here, because each one below is used by more than one page. Everywhere else it is only\ncited, with \u003ccode>[[rule BR-02]]\u003c/code>, never redefined. A rule that only concerned a single feature would be defined on\nthat feature&#39;s own sheet instead.\u003c/p>\n\u003ch2 id=\"the-rules\">The rules\u003ca class=\"ancre\" href=\"#/features/rules~the-rules\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"regle\">\u003ch3 id=\"br-01\">BR-01 · An order is Open, Shipped or Cancelled\u003ca class=\"ancre\" href=\"#/features/rules~br-01\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003cp>An order carries exactly one of three statuses, shown as a coloured badge: \u003cstrong>Open\u003c/strong>, \u003cstrong>Shipped\u003c/strong> or\n\u003cstrong>Cancelled\u003c/strong>. There is no fourth status in this version of Acme Orders.\u003c/p>\n\u003cp>\u003cstrong>Example.\u003c/strong> \u003cstrong>Given\u003c/strong> the orders list, \u003cstrong>when\u003c/strong> you filter by status, \u003cstrong>then\u003c/strong> the three choices offered are\n\u003cstrong>Open\u003c/strong>, \u003cstrong>Shipped\u003c/strong> and \u003cstrong>Cancelled\u003c/strong> — nothing else.\u003c/p>\n\u003c/div>\u003cdiv class=\"regle\">\u003ch3 id=\"br-02\">BR-02 · Opening an order's approval chain creates it\u003ca class=\"ancre\" href=\"#/features/rules~br-02\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003cp>An order&#39;s approval chain does not exist until someone opens it for the first time. Opening the \u003cstrong>Approval\nchain\u003c/strong> link, for any signed-in person, creates the chain and notifies the approvers — even a quick look counts.\u003c/p>\n\u003cp>\u003cstrong>Example.\u003c/strong> \u003cstrong>Given\u003c/strong> an order that has never been opened on its approval page, \u003cstrong>when\u003c/strong> anyone follows the\n\u003cstrong>Approval chain\u003c/strong> link, \u003cstrong>then\u003c/strong> the chain is created and the approvers are notified, whether or not that was\nthe intention.\u003c/p>\n\u003c/div>\u003cdiv class=\"regle\">\u003ch3 id=\"br-03\">BR-03 · Today's figures follow the current filters\u003ca class=\"ancre\" href=\"#/features/rules~br-03\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\u003cp>The three figures above the orders table (\u003cstrong>orders\u003c/strong>, \u003cstrong>open\u003c/strong>, \u003cstrong>total\u003c/strong>) are computed on the orders currently\nshown, after the status, customer and date filters are applied — not on every order Acme Orders holds.\u003c/p>\n\u003cp>\u003cstrong>Example.\u003c/strong> \u003cstrong>Given\u003c/strong> six orders in the list, \u003cstrong>when\u003c/strong> you filter the status to \u003cstrong>Open\u003c/strong>, \u003cstrong>then\u003c/strong> the \u003cstrong>total\u003c/strong>\nfigure adds up only the open orders shown, not all six.\u003c/p>\n\u003c/div>\u003ch2 id=\"rules-by-feature\">Rules by feature\u003ca class=\"ancre\" href=\"#/features/rules~rules-by-feature\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Id\u003c/th>\u003cth>Règle\u003c/th>\u003cth>Définie dans\u003c/th>\u003cth>Citée par\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#/features/rules~br-01\">BR-01\u003c/a>\u003c/td>\u003ctd>An order is Open, Shipped or Cancelled\u003c/td>\u003ctd>\u003ca href=\"#/features/rules\">Business rules\u003c/a>\u003c/td>\u003ctd>F-01\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/features/rules~br-02\">BR-02\u003c/a>\u003c/td>\u003ctd>Opening an order's approval chain creates it\u003c/td>\u003ctd>\u003ca href=\"#/features/rules\">Business rules\u003c/a>\u003c/td>\u003ctd>F-02, risks/findings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/features/rules~br-03\">BR-03\u003c/a>\u003c/td>\u003ctd>Today's figures follow the current filters\u003c/td>\u003ctd>\u003ca href=\"#/features/rules\">Business rules\u003c/a>\u003c/td>\u003ctd>use/orders, F-01\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2 id=\"retired-rules\">Retired rules\u003ca class=\"ancre\" href=\"#/features/rules~retired-rules\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>None yet: Acme Orders has not retired a business rule since this page was written.\u003c/p>\n","toc":[{"id":"how-to-read-this-page","titre":"How to read this page","niveau":2},{"id":"the-rules","titre":"The rules","niveau":2},{"id":"br-01","titre":"BR-01 · An order is Open, Shipped or Cancelled","niveau":3},{"id":"br-02","titre":"BR-02 · Opening an order's approval chain creates it","niveau":3},{"id":"br-03","titre":"BR-03 · Today's figures follow the current filters","niveau":3},{"id":"rules-by-feature","titre":"Rules by feature","niveau":2},{"id":"retired-rules","titre":"Retired rules","niveau":2}],"captures":0,"space":"business","verified":{"version":"1.4.0","date":"2026-10-02"}},"features/roles":{"id":"features/roles","titre":"Roles and permissions","titre_menu":"Roles and permissions","resume":"The roles Acme Orders ships with, and who can do what.","section":"features","groupe":"Feature sheets","niveau":1,"routes":[],"droits":[],"html":"\u003ch2 id=\"in-short\">In short\u003ca class=\"ancre\" href=\"#/features/roles~in-short\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders&#39; feature sheets describe two roles, \u003cstrong>Team member\u003c/strong> and \u003cstrong>Approver\u003c/strong>: a team member is additive\ninto an approver. The demo build below does not check them (see the note under &quot;Who can do what&quot;); a\nproduction build would enforce the permissions named on each feature sheet.\u003c/p>\n\u003ch2 id=\"the-roles\">The roles\u003ca class=\"ancre\" href=\"#/features/roles~the-roles\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Team member\u003c/strong>: signs in and uses \u003ca href=\"#/features/track-orders\">Track orders\u003c/a> — reads the list, filters it, opens\nan order.\u003c/li>\n\u003cli>\u003cstrong>Approver\u003c/strong>: everything a team member can do, plus \u003ca href=\"#/features/approve-order\">Approve an order\u003c/a> — opening an\norder&#39;s \u003cstrong>Approval chain\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"who-can-do-what\">Who can do what\u003ca class=\"ancre\" href=\"#/features/roles~who-can-do-what\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fonctionnalité\u003c/th>\u003cth>orders:read\u003c/th>\u003cth>orders:approve\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#/features/track-orders\">Track orders\u003c/a>\u003c/td>\u003ctd>\u003cspan class=\"sr-only\">Autorisé\u003c/span>✔\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/features/approve-order\">Approve an order\u003c/a>\u003c/td>\u003ctd>\u003cspan class=\"sr-only\">Autorisé\u003c/span>✔\u003c/td>\u003ctd>\u003cspan class=\"sr-only\">Autorisé\u003c/span>✔\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"encadre note\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4M12 8h.01\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Not enforced in this demo\u003c/div>\u003cp>The table above is the intended model. The demo build checks only that someone is signed in, not which role\nthey hold: today, any signed-in person can open an \u003cstrong>Approval chain\u003c/strong> (\u003ca href=\"#/secure/api-surface\">the API surface\u003c/a>\ndescribes the gap for the takeover team).\u003c/p>\n\u003c/div>\u003c/aside>\n\u003ch2 id=\"responsibilities\">Responsibilities\u003ca class=\"ancre\" href=\"#/features/roles~responsibilities\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders keeps no record of who approved what beyond the chain itself: the demo does not distinguish an\napprover&#39;s decision from anyone else opening the same link.\u003c/p>\n\u003ch2 id=\"how-to-get-a-role\">How to get a role\u003ca class=\"ancre\" href=\"#/features/roles~how-to-get-a-role\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Not applicable: this demo has no user administration screen. Any e-mail and password signs in as the same\nsingle demo account.\u003c/p>\n","toc":[{"id":"in-short","titre":"In short","niveau":2},{"id":"the-roles","titre":"The roles","niveau":2},{"id":"who-can-do-what","titre":"Who can do what","niveau":2},{"id":"responsibilities","titre":"Responsibilities","niveau":2},{"id":"how-to-get-a-role","titre":"How to get a role","niveau":2}],"captures":0,"space":"business","verified":{"version":"1.4.0","date":"2026-10-02"}},"maintain/architecture":{"id":"maintain/architecture","titre":"Architecture of Acme Orders","titre_menu":"Architecture","resume":"The three blocks of Acme Orders and how they talk.","section":"maintain","groupe":"Technical","niveau":1,"routes":[],"droits":[],"html":"\u003ch2 id=\"overview\">Overview\u003ca class=\"ancre\" href=\"#/maintain/architecture~overview\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders has three blocks: the browser, the API and the database. The REST API links the first two.\u003c/p>\n\u003cfigure class=\"schema\">\u003csvg viewBox=\"0 0 900 160\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"How an order flows\">\n  \u003cdefs>\u003cmarker id=\"fl-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\">\u003cpath class=\"d-arrow\" d=\"M0 0 10 5 0 10z\"/>\u003c/marker>\u003c/defs>\n  \u003crect class=\"d-box\" x=\"20\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"130\" y=\"76\" text-anchor=\"middle\">Browser\u003c/text>\n  \u003ctext class=\"d-small\" x=\"130\" y=\"98\" text-anchor=\"middle\">single-page app\u003c/text>\n  \u003crect class=\"d-brand\" x=\"340\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"450\" y=\"76\" text-anchor=\"middle\">Orders API\u003c/text>\n  \u003ctext class=\"d-text\" x=\"450\" y=\"98\" text-anchor=\"middle\">REST, JSON\u003c/text>\n  \u003crect class=\"d-info\" x=\"660\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"770\" y=\"86\" text-anchor=\"middle\">Database\u003c/text>\n  \u003cpath class=\"d-line\" d=\"M240 80H336\" marker-end=\"url(#fl-arrow)\"/>\n  \u003cpath class=\"d-line-brand\" d=\"M560 80H656\" marker-end=\"url(#fl-arrow)\"/>\n\u003c/svg>\u003cfigcaption>How an order flows\u003c/figcaption>\u003c/figure>\u003caside class=\"encadre mecanisme\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Comment ça marche\u003c/div>\u003cp>Every browser request goes through the API, which reads or writes the database.\u003c/p>\n\u003c/div>\u003c/aside>\n\u003ch2 id=\"run-it-locally\">Run it locally\u003ca class=\"ancre\" href=\"#/maintain/architecture~run-it-locally\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">npm ci\nnpm run dev\n\u003c/code>\u003c/pre>\n\u003caside class=\"encadre recette\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Check the installation\u003c/div>\u003cp>Open \u003ccode>http:/\u003cwbr>/\u003cwbr>localhost:3000/\u003cwbr>api/\u003cwbr>v1/\u003cwbr>health\u003c/code>: the answer must be \u003ccode>ok\u003c/code>.\u003c/p>\n\u003c/div>\u003c/aside>\n","toc":[{"id":"overview","titre":"Overview","niveau":2},{"id":"run-it-locally","titre":"Run it locally","niveau":2}],"captures":0,"space":"takeover","verified":{"version":"1.4.0","date":"2026-10-02"}},"secure/access-ownership":{"id":"secure/access-ownership","titre":"Access and ownership","titre_menu":"Access and ownership","resume":"Who owns the repository, the hosting and the session secret.","section":"secure","groupe":"Ownership and the API","niveau":1,"routes":[],"droits":[],"html":"\u003ch2 id=\"in-short\">In short\u003ca class=\"ancre\" href=\"#/secure/access-ownership~in-short\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders is a demo: it ships with no production deployment and no team roster. The table below shows what a\nreal handover of this code would look like, filled in as far as the code itself answers.\u003c/p>\n\u003ch2 id=\"who-owns-what\">Who owns what\u003ca class=\"ancre\" href=\"#/secure/access-ownership~who-owns-what\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Asset\u003c/th>\n\u003cth>Owner\u003c/th>\n\u003cth>Where\u003c/th>\n\u003cth>How to hand it over\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Repository\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Wherever this kit&#39;s repository is cloned\u003c/td>\n\u003ctd>Transfer or add a co-owner\u003c/td>\n\u003ctd>Owner unknown\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hosting\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>None: \u003ccode>node serve.mjs\u003c/code> runs on a local machine only\u003c/td>\n\u003ctd>N/A, no production host exists\u003c/td>\n\u003ctd>Owner unknown\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Session token\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>In memory only (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:35\u003c/code>\u003c/span>), lost on every restart\u003c/td>\n\u003ctd>Nothing to rotate: it is random and never persisted\u003c/td>\n\u003ctd>Known\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Demo data (\u003ccode>data.json\u003c/code>)\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Committed with the repository\u003c/td>\n\u003ctd>Edit the file, or call \u003ccode>POST /api/demo/reset\u003c/code>\u003c/td>\n\u003ctd>Known\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"secrets-and-where-they-live\">Secrets and where they live\u003ca class=\"ancre\" href=\"#/secure/access-ownership~secrets-and-where-they-live\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders holds no secret to rotate: there is no API key, password or signing key anywhere in the code. The\nonly per-session value is the random session token (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:35\u003c/code>\u003c/span>), kept in a \u003ccode>Map\u003c/code> in the server&#39;s\nmemory and never written to disk (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:21\u003c/code>\u003c/span>).\u003c/p>\n\u003ch2 id=\"unknown-owners\">Unknown owners\u003ca class=\"ancre\" href=\"#/secure/access-ownership~unknown-owners\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>Repository and hosting: a demo has no team to name; a real deployment would fill in a person or team here\nbefore anything else on this page matters.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"handover-checklist\">Handover checklist\u003ca class=\"ancre\" href=\"#/secure/access-ownership~handover-checklist\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003col class=\"etapes\">\n\u003cli>\u003cstrong>Clone the repository\u003c/strong> and run \u003ccode>node serve.mjs\u003c/code> to confirm it still starts.\u003c/li>\n\u003cli>\u003cstrong>Decide who owns it\u003c/strong>: even a demo benefits from one named maintainer.\u003c/li>\n\u003cli>\u003cstrong>Read \u003ca href=\"#/secure/api-surface\">the API surface\u003c/a>\u003c/strong> before exposing it beyond a local machine: today, nothing\nchecks who is allowed to do what.\u003c/li>\n\u003c/ol>\n","toc":[{"id":"in-short","titre":"In short","niveau":2},{"id":"who-owns-what","titre":"Who owns what","niveau":2},{"id":"secrets-and-where-they-live","titre":"Secrets and where they live","niveau":2},{"id":"unknown-owners","titre":"Unknown owners","niveau":2},{"id":"handover-checklist","titre":"Handover checklist","niveau":2}],"captures":0,"space":"takeover","verified":{"version":"1.4.0","date":"2026-10-02"}},"secure/api-surface":{"id":"secure/api-surface","titre":"API surface","titre_menu":"API surface","resume":"Every route, who can call it, and the gaps.","section":"secure","groupe":"Ownership and the API","niveau":1,"routes":[],"droits":[],"html":"\u003ch2 id=\"in-short\">In short\u003ca class=\"ancre\" href=\"#/secure/api-surface~in-short\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>Acme Orders answers about a dozen routes; four of them never check who is asking. There is only ever one demo\naccount, so tenant isolation does not apply — but role isolation does, and nothing checks it today.\u003c/p>\n\u003ch2 id=\"the-routes\">The routes\u003ca class=\"ancre\" href=\"#/secure/api-surface~the-routes\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>\u003ccode>doc-kit facts --source api\u003c/code> finds nothing: Acme Orders answers with direct string comparisons on the request\npath (\u003ccode>serve.mjs\u003c/code>) rather than a router the adapter can parse, so the table below was completed entirely by\nhand from the code. There is no tenant isolation to check: the demo has a single account.\u003c/p>\n\u003cdiv class=\"tableau\" data-generated=\"facts\">\u003ctable data-generated=\"facts\">\u003ccaption>api · au 2026-10-02 · commit 939ed0c\u003c/caption>\u003cthead>\u003ctr>\u003cth>Méthode\u003c/th>\u003cth>Route\u003c/th>\u003cth>Fichier\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Method\u003c/th>\n\u003cth>Route\u003c/th>\n\u003cth>Authentication\u003c/th>\n\u003cth>Role\u003c/th>\n\u003cth>Proof\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Public\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:41\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Public\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:33\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/api/me\u003c/code>\u003c/td>\n\u003ctd>Session cookie\u003c/td>\n\u003ctd>Signed in\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:52\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/api/orders\u003c/code>\u003c/td>\n\u003ctd>Session cookie\u003c/td>\n\u003ctd>Signed in\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:54\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/api/orders/[id]\u003c/code>\u003c/td>\n\u003ctd>Session cookie\u003c/td>\n\u003ctd>Signed in\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:55\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003ccode>/api/settings\u003c/code>\u003c/td>\n\u003ctd>Session cookie\u003c/td>\n\u003ctd>Signed in\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:49\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>\u003ccode>/orders/[id]/approval\u003c/code>\u003c/td>\n\u003ctd>Session cookie\u003c/td>\n\u003ctd>Signed in — writes on render\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:59\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>\u003ccode>/api/demo/reset\u003c/code>\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Public\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:40\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"database-access-rules\">Database access rules\u003ca class=\"ancre\" href=\"#/secure/api-surface~database-access-rules\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\" data-generated=\"facts\">\u003ctable data-generated=\"facts\">\u003ccaption>db · au 2026-10-02 · commit 939ed0c\u003c/caption>\u003cthead>\u003ctr>\u003cth>Table\u003c/th>\u003cth>Sécurité au niveau ligne\u003c/th>\u003cth>Politiques\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>There is no database: Acme Orders keeps everything in one in-memory object, seeded from \u003ccode>data.json\u003c/code> and\ndiscarded on restart (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:22\u003c/code>\u003c/span>). No row-level security applies because no row survives a\nrestart.\u003c/p>\n\u003ch2 id=\"public-routes\">Public routes\u003ca class=\"ancre\" href=\"#/secure/api-surface~public-routes\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Route\u003c/th>\n\u003cth>Why it is public\u003c/th>\n\u003cth>Proof\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>GET\u003c/code>/\u003ccode>POST\u003c/code> \u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>The sign-in page itself\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:41\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET\u003c/code> \u003ccode>/style.css\u003c/code>, \u003ccode>/app.js\u003c/code>\u003c/td>\n\u003ctd>Static assets, needed before signing in\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:43\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST\u003c/code> \u003ccode>/api/demo/reset\u003c/code>\u003c/td>\n\u003ctd>Convenience for \u003ccode>capture.setup\u003c/code>; resets the demo data, nothing more\u003c/td>\n\u003ctd>\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:40\u003c/code>\u003c/span>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"gaps\">Gaps\u003ca class=\"ancre\" href=\"#/secure/api-surface~gaps\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/risks/findings~c1-no-access-control\">C1\u003c/a> — the only check is &quot;is someone signed in&quot;\n(\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:46\u003c/code>\u003c/span>); no route tells \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span> apart from \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:approve\u003c/span>.\u003c/li>\n\u003cli>\u003ca href=\"#/risks/findings~i1-opening-the-approval-chain-writes-on-a-get\">I1\u003c/a> — \u003ccode>GET /orders/[id]/approval\u003c/code> writes on\nrender (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:59\u003c/code>\u003c/span>), and the order page prefetches it automatically (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>app.js:16\u003c/code>\u003c/span>).\u003c/li>\n\u003c/ul>\n","toc":[{"id":"in-short","titre":"In short","niveau":2},{"id":"the-routes","titre":"The routes","niveau":2},{"id":"database-access-rules","titre":"Database access rules","niveau":2},{"id":"public-routes","titre":"Public routes","niveau":2},{"id":"gaps","titre":"Gaps","niveau":2}],"captures":0,"space":"takeover","counterpart":{"id":"features/approve-order"},"verified":{"version":"1.4.0","date":"2026-10-02"}},"risks/findings":{"id":"risks/findings","titre":"Findings","titre_menu":"Findings","resume":"Three findings, re-checked in the code: one critical, one important, one minor.","section":"risks","groupe":"Findings","niveau":1,"routes":[],"droits":[],"html":"\u003ch2 id=\"how-to-read-this-page\">How to read this page\u003ca class=\"ancre\" href=\"#/risks/findings~how-to-read-this-page\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>This is the work list of whoever takes Acme Orders over: the gaps found in version 1.4.0, re-checked directly\nin \u003ccode>serve.mjs\u003c/code> and the files under \u003ccode>public/\u003c/code>. There is no production deployment, so no finding here comes from\nanywhere but the code.\u003c/p>\n\u003cdiv class=\"tableau\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Severity\u003c/th>\n\u003cth>Definition\u003c/th>\n\u003cth>Count\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Critical\u003c/strong>\u003c/td>\n\u003ctd>A current risk for data security or the product&#39;s core promise; to address before any other change\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Important\u003c/strong>\u003c/td>\n\u003ctd>A real defect, a possible bypass, or a broken feature; to schedule quickly\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Minor\u003c/strong>\u003c/td>\n\u003ctd>Debt, inconsistency or a setting with no effect; to address along the way\u003c/td>\n\u003ctd>1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Findings are numbered \u003cstrong>C\u003c/strong> (critical), \u003cstrong>I\u003c/strong> (important) and \u003cstrong>M\u003c/strong> (minor). A number never changes: a new\nfinding takes the next free number of its family.\u003c/p>\n\u003ch2 id=\"the-essentials-in-one-minute\">The essentials in one minute\u003ca class=\"ancre\" href=\"#/risks/findings~the-essentials-in-one-minute\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003col class=\"etapes\">\n\u003cli>\u003cstrong>Add a role check\u003c/strong>: any signed-in person can use every feature of Acme Orders today (C1).\u003c/li>\n\u003cli>\u003cstrong>Stop writing on a GET\u003c/strong>: opening a link should never create data (I1).\u003c/li>\n\u003cli>\u003cstrong>Wire up the theme setting, or remove it\u003c/strong>: it is saved but has no effect (M1).\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"findings\">Findings\u003ca class=\"ancre\" href=\"#/risks/findings~findings\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003ch3 id=\"c1-no-access-control\">C1 — No access control\u003ca class=\"ancre\" href=\"#/risks/findings~c1-no-access-control\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Finding\u003c/strong>: the only check before any action is &quot;is someone signed in&quot; (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:46\u003c/code>\u003c/span>); nothing\nchecks what that person is allowed to do. \u003ca class=\"puce fonctionnalite\" href=\"#/features/approve-order\" title=\"Approve an order\">F-02\u003c/a> names \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:approve\u003c/span> as a separate\npermission from \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:read\u003c/span>, but the server never tells the two apart.\u003c/p>\n\u003cp>\u003cstrong>Impact\u003c/strong>: any signed-in person can read every order, change the profile, and open — and so create — any\norder&#39;s approval chain. The \u003ca href=\"#/features/roles\">roles and permissions\u003c/a> page describes the model Acme Orders\ndoes not yet enforce.\u003c/p>\n\u003cp>\u003cstrong>Recommendation\u003c/strong>: attach a role to each session (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:36\u003c/code>\u003c/span>) and check it before every action,\nstarting with \u003cspan class=\"puce droit\" title=\"Permission\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/>\u003cpath d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>\u003c/svg>orders:approve\u003c/span>.\u003c/p>\n\u003cp>Owner: Demo maintainers · Decision: Fix · Status: Open · Due: —\u003c/p>\n\u003ch3 id=\"i1-opening-the-approval-chain-writes-on-a-get\">I1 — Opening the approval chain writes on a GET\u003ca class=\"ancre\" href=\"#/risks/findings~i1-opening-the-approval-chain-writes-on-a-get\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Finding\u003c/strong>: visiting \u003ccode>/orders/&lt;id&gt;/approval\u003c/code> creates the order&#39;s approval chain and records a write, whether\nthe visit was deliberate or not (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>serve.mjs:59\u003c/code>\u003c/span>). The order page even prefetches this route in the\nbackground as soon as it loads (\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>order.html:22\u003c/code>\u003c/span>, \u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>app.js:16\u003c/code>\u003c/span>), so the chain is created\nbefore anyone clicks anything.\u003c/p>\n\u003cp>\u003cstrong>Impact\u003c/strong>: a link preview, a crawler, or doc-kit&#39;s own read-only capture (blocked only because this route is\ndeclared in \u003ccode>capture.forbidden\u003c/code>) can trigger the same write. \u003ca class=\"puce regle\" href=\"#/features/rules~br-02\" title=\"Opening an order's approval chain creates it\">BR-02\u003c/a> describes this as intentional\nbusiness behaviour, but a GET request creating data is still a risk for anyone who forwards the link.\u003c/p>\n\u003cp>\u003cstrong>Recommendation\u003c/strong>: create the chain when the order is submitted, not when the link is opened; make the\napproval page a plain read.\u003c/p>\n\u003cp>Owner: Demo maintainers · Decision: Fix · Status: Open · Due: —\u003c/p>\n\u003ch3 id=\"m1-the-theme-setting-has-no-effect\">M1 — The theme setting has no effect\u003ca class=\"ancre\" href=\"#/risks/findings~m1-the-theme-setting-has-no-effect\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h3>\n\u003cp>\u003cstrong>Finding\u003c/strong>: \u003cstrong>Settings → Theme\u003c/strong> offers Light, Dark and System, and the choice is saved\n(\u003cspan class=\"puce affirmation verifie\" title=\"Vérifié dans le code\">Vérifié dans le code \u003ccode>app.js:55\u003c/code>\u003c/span>). Nothing reads it back: \u003ccode>app.js:51\u003c/code> only writes the saved value into the select, and\n\u003ccode>style.css\u003c/code> defines no dark variant at all.\u003c/p>\n\u003cp>\u003cstrong>Impact\u003c/strong>: none beyond confusion — the setting looks like it should change the page, and does not.\u003c/p>\n\u003cp>\u003cstrong>Recommendation\u003c/strong>: either implement a dark variant of \u003ccode>style.css\u003c/code>, or remove the setting until one exists.\u003c/p>\n\u003cp>Owner: Demo maintainers · Decision: Accept · Status: Open · Due: —\u003c/p>\n\u003ch2 id=\"what-could-not-be-checked\">What could not be checked\u003ca class=\"ancre\" href=\"#/risks/findings~what-could-not-be-checked\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>Whether a real deployment of Acme Orders would sit behind a reverse proxy or a load balancer: this demo only\never runs with \u003ccode>node serve.mjs\u003c/code> on a local machine.\u003c/li>\n\u003c/ul>\n","toc":[{"id":"how-to-read-this-page","titre":"How to read this page","niveau":2},{"id":"the-essentials-in-one-minute","titre":"The essentials in one minute","niveau":2},{"id":"findings","titre":"Findings","niveau":2},{"id":"c1-no-access-control","titre":"C1 — No access control","niveau":3},{"id":"i1-opening-the-approval-chain-writes-on-a-get","titre":"I1 — Opening the approval chain writes on a GET","niveau":3},{"id":"m1-the-theme-setting-has-no-effect","titre":"M1 — The theme setting has no effect","niveau":3},{"id":"what-could-not-be-checked","titre":"What could not be checked","niveau":2}],"captures":0,"space":"takeover","verified":{"version":"1.4.0","date":"2026-10-02"}}},"ordre":["use/orders","use/orders/detail","use/settings","features/track-orders","features/approve-order","features/rules","features/roles","maintain/architecture","secure/access-ownership","secure/api-surface","risks/findings"],"recherche":[{"p":"use/orders","a":"what-it-is-for","t":"What it is for","x":"The orders list is the first page shown after signing in. It summarises the day's orders and gives access to every function through the menu Orders › All orders ( /orders ). A new order gets the status Open ; a cancelled one, Cancelled . Astuce Search also opens from the keyboard: Ctrl + K ."},{"p":"use/orders","a":null,"t":"The orders list","x":""},{"p":"use/orders","a":"how-it-works","t":"How it works","x":"The list is loaded from the API when the page opens. Order summary always follows the three filters above it, not every order in the list ( BR-03 ): narrow the filters, and today's figures narrow with them."},{"p":"use/orders","a":"the-screen","t":"The screen","x":"Orders · list Visite guidée · 3 étapes Agrandir 1 2 3 1 Filters : status, customer and date; they are kept until you sign out. 2 Order summary : today's figures, recalculated each time the page opens. 3 New order : creates an order; see the settings ."},{"p":"use/orders","a":"example","t":"Example","x":""},{"p":"use/orders","a":"example-2","t":"Example","x":""},{"p":"use/orders","a":"example-2-2","t":"Example","x":"Setting Value Effect API address https:/ / orders. example. org/ api/ v1/ orders? status= open Where the data comes from Theme Light · Dark Interface colours"},{"p":"use/orders","a":"in-this-part","t":"In this part","x":"Order details"},{"p":"use/orders","a":"pitfalls-and-limits","t":"Pitfalls and limits","x":"Back orders A back order stays in the list until every line has shipped."},{"p":"use/orders","a":"required-permissions","t":"Required permissions","x":"Droits requis See the list: orders:read ."},{"p":"use/orders/detail","a":"what-changes","t":"What changes","x":"Orders Settings From the orders to the settings À savoir The handle also moves with the left and right arrow keys. Demo data The figures shown are not real."},{"p":"use/orders/detail","a":null,"t":"Order details","x":""},{"p":"use/settings","a":"what-it-is-for","t":"What it is for","x":"The profile holds your name, language and theme. This page uses the French spellings of the syntax, which are accepted on an equal footing. Astuce Light, Dark and System are saved to your profile, but this demo does not actually change the page's colours yet."},{"p":"use/settings","a":null,"t":"Profile settings","x":""},{"p":"use/settings","a":"the-screen","t":"The screen","x":"Settings · profile Visite guidée · 2 étapes Agrandir 1 2 1 Profile : name, language and theme. 2 Save : applies the changes."},{"p":"use/settings","a":"step-by-step","t":"Step by step","x":"Open Settings . Change the Profile . Click Save ."},{"p":"use/settings","a":"settings-reference","t":"Settings reference","x":"Setting Control Values · default Effect Language List English · Français Interface language Theme Switch Light · Dark · System Colours No validation An empty name is saved as it is: the demo does not check it."},{"p":"use/settings","a":"required-permissions","t":"Required permissions","x":"Droits requis Save: settings:write ; status Open ; shortcut Ctrl + S ."},{"p":"features/track-orders","a":"access","t":"Access","x":"Module Orders Who can use it orders:read Prerequisites None: the list works for anyone signed in Checked on v1.4.0, 2026-10-02"},{"p":"features/track-orders","a":null,"t":"Track orders","x":""},{"p":"features/track-orders","a":"what-it-is-for","t":"What it is for","x":"Track orders is the first thing a team member sees after signing in: the full orders list, filtered by status, customer or date, with today's figures above it and a way into each order's details."},{"p":"features/track-orders","a":"who-uses-it","t":"Who uses it","x":"Team member : filters the list to find an order, then opens it to check its status."},{"p":"features/track-orders","a":"main-scenario","t":"Main scenario","x":"A team member opens the orders list . They narrow it with the status , customer or date filter, alone or together. Order summary recalculates to match the filtered list ( BR-03 ). They open an order from the list to see its details ."},{"p":"features/track-orders","a":"business-rules","t":"Business rules","x":"BR-01 limits a status to three values; BR-03 governs the figures above the table."},{"p":"features/track-orders","a":"limits","t":"Limits","x":"The filters are not kept anywhere once you leave the page: coming back to the list starts from All again."},{"p":"features/approve-order","a":"access","t":"Access","x":"Module Orders Who can use it orders:read to open the order, orders:approve to open its Approval chain Prerequisites An existing order Checked on v1.4.0, 2026-10-02"},{"p":"features/approve-order","a":null,"t":"Approve an order","x":""},{"p":"features/approve-order","a":"what-it-is-for","t":"What it is for","x":"Approve an order gives every order a trail: the Approval chain link on an order's page. The first time anyone opens it, Acme Orders creates the chain and notifies the approvers; opening it again just shows it."},{"p":"features/approve-order","a":"who-uses-it","t":"Who uses it","x":"Team member : opens an order and follows its Approval chain link."},{"p":"features/approve-order","a":"trigger-and-preconditions","t":"Trigger and preconditions","x":"Following the Approval chain link on an order's details starts it. No earlier step is required: any existing order can have its chain created this way."},{"p":"features/approve-order","a":"main-scenario","t":"Main scenario","x":"A team member opens an order. They follow the Approval chain link. Acme Orders creates the chain for this order and notifies the approvers ( BR-02 ). The team member sees the chain; a later visit shows the same chain, unchanged."},{"p":"features/approve-order","a":"business-rules","t":"Business rules","x":"BR-02 is the one rule this feature exists to apply."},{"p":"features/approve-order","a":"limits","t":"Limits","x":"Opening the link is enough: a quick look, a shared link preview or an automated tool that follows it also creates the chain and notifies the approvers, whether or not that was intended ( the API surface describes this more precisely for the takeover team)."},{"p":"features/rules","a":"how-to-read-this-page","t":"How to read this page","x":"A rule is defined once, here, because each one below is used by more than one page. Everywhere else it is only cited, with [[rule BR-02]] , never redefined. A rule that only concerned a single feature would be defined on that feature's own sheet instead."},{"p":"features/rules","a":null,"t":"Business rules","x":""},{"p":"features/rules","a":"the-rules","t":"The rules","x":""},{"p":"features/rules","a":"br-01","t":"BR-01 · An order is Open, Shipped or Cancelled","x":"An order carries exactly one of three statuses, shown as a coloured badge: Open , Shipped or Cancelled . There is no fourth status in this version of Acme Orders. Example. Given the orders list, when you filter by status, then the three choices offered are Open , Shipped and Cancelled — nothing else."},{"p":"features/rules","a":"br-02","t":"BR-02 · Opening an order's approval chain creates it","x":"An order's approval chain does not exist until someone opens it for the first time. Opening the Approval chain link, for any signed-in person, creates the chain and notifies the approvers — even a quick look counts. Example. Given an order that has never been opened on its approval page, when anyone follows the Approval chain link, then the chain is created and the approvers are notified, whether or not that was the intention."},{"p":"features/rules","a":"br-03","t":"BR-03 · Today's figures follow the current filters","x":"The three figures above the orders table ( orders , open , total ) are computed on the orders currently shown, after the status, customer and date filters are applied — not on every order Acme Orders holds. Example. Given six orders in the list, when you filter the status to Open , then the total figure adds up only the open orders shown, not all six."},{"p":"features/rules","a":"rules-by-feature","t":"Rules by feature","x":""},{"p":"features/rules","a":"retired-rules","t":"Retired rules","x":"None yet: Acme Orders has not retired a business rule since this page was written."},{"p":"features/roles","a":"in-short","t":"In short","x":"Acme Orders' feature sheets describe two roles, Team member and Approver : a team member is additive into an approver. The demo build below does not check them (see the note under \"Who can do what\"); a production build would enforce the permissions named on each feature sheet."},{"p":"features/roles","a":null,"t":"Roles and permissions","x":""},{"p":"features/roles","a":"the-roles","t":"The roles","x":"Team member : signs in and uses Track orders — reads the list, filters it, opens an order. Approver : everything a team member can do, plus Approve an order — opening an order's Approval chain ."},{"p":"features/roles","a":"who-can-do-what","t":"Who can do what","x":"Not enforced in this demo The table above is the intended model. The demo build checks only that someone is signed in, not which role they hold: today, any signed-in person can open an Approval chain ( the API surface describes the gap for the takeover team)."},{"p":"features/roles","a":"responsibilities","t":"Responsibilities","x":"Acme Orders keeps no record of who approved what beyond the chain itself: the demo does not distinguish an approver's decision from anyone else opening the same link."},{"p":"features/roles","a":"how-to-get-a-role","t":"How to get a role","x":"Not applicable: this demo has no user administration screen. Any e-mail and password signs in as the same single demo account."},{"p":"maintain/architecture","a":"overview","t":"Overview","x":"Acme Orders has three blocks: the browser, the API and the database. The REST API links the first two. How an order flows Comment ça marche Every browser request goes through the API, which reads or writes the database."},{"p":"maintain/architecture","a":null,"t":"Architecture of Acme Orders","x":""},{"p":"maintain/architecture","a":"run-it-locally","t":"Run it locally","x":"npm ci npm run dev Check the installation Open http:/ / localhost:3000/ api/ v1/ health : the answer must be ok ."},{"p":"secure/access-ownership","a":"in-short","t":"In short","x":"Acme Orders is a demo: it ships with no production deployment and no team roster. The table below shows what a real handover of this code would look like, filled in as far as the code itself answers."},{"p":"secure/access-ownership","a":null,"t":"Access and ownership","x":""},{"p":"secure/access-ownership","a":"who-owns-what","t":"Who owns what","x":"Asset Owner Where How to hand it over Status Repository — Wherever this kit's repository is cloned Transfer or add a co-owner Owner unknown Hosting — None: node serve.mjs runs on a local machine only N/A, no production host exists Owner unknown Session token — In memory only ( Vérifié dans le code serve.mjs:35 ), lost on every restart Nothing to rotate: it is random and never persisted Known Demo data ( data.json ) — Committed with the repository Edit the file, or call POST /api/demo/reset Known"},{"p":"secure/access-ownership","a":"secrets-and-where-they-live","t":"Secrets and where they live","x":"Acme Orders holds no secret to rotate: there is no API key, password or signing key anywhere in the code. The only per-session value is the random session token ( Vérifié dans le code serve.mjs:35 ), kept in a Map in the server's memory and never written to disk ( Vérifié dans le code serve.mjs:21 )."},{"p":"secure/access-ownership","a":"unknown-owners","t":"Unknown owners","x":"Repository and hosting: a demo has no team to name; a real deployment would fill in a person or team here before anything else on this page matters."},{"p":"secure/access-ownership","a":"handover-checklist","t":"Handover checklist","x":"Clone the repository and run node serve.mjs to confirm it still starts. Decide who owns it : even a demo benefits from one named maintainer. Read the API surface before exposing it beyond a local machine: today, nothing checks who is allowed to do what."},{"p":"secure/api-surface","a":"in-short","t":"In short","x":"Acme Orders answers about a dozen routes; four of them never check who is asking. There is only ever one demo account, so tenant isolation does not apply — but role isolation does, and nothing checks it today."},{"p":"secure/api-surface","a":null,"t":"API surface","x":""},{"p":"secure/api-surface","a":"the-routes","t":"The routes","x":"doc-kit facts --source api finds nothing: Acme Orders answers with direct string comparisons on the request path ( serve.mjs ) rather than a router the adapter can parse, so the table below was completed entirely by hand from the code. There is no tenant isolation to check: the demo has a single account. api · au 2026-10-02 · commit 939ed0c Méthode Route Fichier Method Route Authentication Role Proof GET /login None Public Vérifié dans le code serve.mjs:41 POST /login None Public Vérifié dans le code serve.mjs:33 GET /api/me Session cookie Signed in Vérifié dans le code serve.mjs:52 GET /api/orders Session cookie Signed in Vérifié dans le code serve.mjs:54 GET /api/orders/[id] Session cookie Signed in Vérifié dans le code serve.mjs:55 POST /api/settings Session cookie Signed in Vérifié dans le code serve.mjs:49 GET /orders/[id]/approval Session cookie Signed in — writes on render Vérifié dans le code serve.mjs:59 POST /api/demo/reset None Public Vérifié dans le code serve.mjs:40"},{"p":"secure/api-surface","a":"database-access-rules","t":"Database access rules","x":"db · au 2026-10-02 · commit 939ed0c Table Sécurité au niveau ligne Politiques There is no database: Acme Orders keeps everything in one in-memory object, seeded from data.json and discarded on restart ( Vérifié dans le code serve.mjs:22 ). No row-level security applies because no row survives a restart."},{"p":"secure/api-surface","a":"public-routes","t":"Public routes","x":"Route Why it is public Proof GET / POST /login The sign-in page itself Vérifié dans le code serve.mjs:41 GET /style.css , /app.js Static assets, needed before signing in Vérifié dans le code serve.mjs:43 POST /api/demo/reset Convenience for capture.setup ; resets the demo data, nothing more Vérifié dans le code serve.mjs:40"},{"p":"secure/api-surface","a":"gaps","t":"Gaps","x":"C1 — the only check is \"is someone signed in\" ( Vérifié dans le code serve.mjs:46 ); no route tells orders:read apart from orders:approve . I1 — GET /orders/[id]/approval writes on render ( Vérifié dans le code serve.mjs:59 ), and the order page prefetches it automatically ( Vérifié dans le code app.js:16 )."},{"p":"risks/findings","a":"how-to-read-this-page","t":"How to read this page","x":"This is the work list of whoever takes Acme Orders over: the gaps found in version 1.4.0, re-checked directly in serve.mjs and the files under public/ . There is no production deployment, so no finding here comes from anywhere but the code. Severity Definition Count Critical A current risk for data security or the product's core promise; to address before any other change 1 Important A real defect, a possible bypass, or a broken feature; to schedule quickly 1 Minor Debt, inconsistency or a setting with no effect; to address along the way 1 Findings are numbered C (critical), I (important) and M (minor). A number never changes: a new finding takes the next free number of its family."},{"p":"risks/findings","a":null,"t":"Findings","x":""},{"p":"risks/findings","a":"the-essentials-in-one-minute","t":"The essentials in one minute","x":"Add a role check : any signed-in person can use every feature of Acme Orders today (C1). Stop writing on a GET : opening a link should never create data (I1). Wire up the theme setting, or remove it : it is saved but has no effect (M1)."},{"p":"risks/findings","a":"findings","t":"Findings","x":""},{"p":"risks/findings","a":"c1-no-access-control","t":"C1 — No access control","x":"Finding : the only check before any action is \"is someone signed in\" ( Vérifié dans le code serve.mjs:46 ); nothing checks what that person is allowed to do. F-02 names orders:approve as a separate permission from orders:read , but the server never tells the two apart. Impact : any signed-in person can read every order, change the profile, and open — and so create — any order's approval chain. The roles and permissions page describes the model Acme Orders does not yet enforce. Recommendation : attach a role to each session ( Vérifié dans le code serve.mjs:36 ) and check it before every action, starting with orders:approve . Owner: Demo maintainers · Decision: Fix · Status: Open · Due: —"},{"p":"risks/findings","a":"i1-opening-the-approval-chain-writes-on-a-get","t":"I1 — Opening the approval chain writes on a GET","x":"Finding : visiting /orders/\u003cid>/approval creates the order's approval chain and records a write, whether the visit was deliberate or not ( Vérifié dans le code serve.mjs:59 ). The order page even prefetches this route in the background as soon as it loads ( Vérifié dans le code order.html:22 , Vérifié dans le code app.js:16 ), so the chain is created before anyone clicks anything. Impact : a link preview, a crawler, or doc-kit's own read-only capture (blocked only because this route is declared in capture.forbidden ) can trigger the same write. BR-02 describes this as intentional business behaviour, but a GET request creating data is still a risk for anyone who forwards the link. Recommendation : create the chain when the order is submitted, not when the link is opened; make the approval page a plain read. Owner: Demo maintainers · Decision: Fix · Status: Open · Due: —"},{"p":"risks/findings","a":"m1-the-theme-setting-has-no-effect","t":"M1 — The theme setting has no effect","x":"Finding : Settings → Theme offers Light, Dark and System, and the choice is saved ( Vérifié dans le code app.js:55 ). Nothing reads it back: app.js:51 only writes the saved value into the select, and style.css defines no dark variant at all. Impact : none beyond confusion — the setting looks like it should change the page, and does not. Recommendation : either implement a dark variant of style.css , or remove the setting until one exists. Owner: Demo maintainers · Decision: Accept · Status: Open · Due: —"},{"p":"risks/findings","a":"what-could-not-be-checked","t":"What could not be checked","x":"Whether a real deployment of Acme Orders would sit behind a reverse proxy or a load balancer: this demo only ever runs with node serve.mjs on a local machine."}],"glossaire":[{"terme":"Order","def":"A customer request for one or more products, with a delivery address and a status.","motif":"orders?","tech":"data.json → orders[]; field status; served by GET /api/orders and GET /api/orders/[id] (serve.mjs)."},{"terme":"Back order","def":"An order line that cannot be shipped yet because the product is out of stock.","motif":"back[- ]orders?"},{"terme":"API","def":"Programming interface exposed by the Acme Orders server.","motif":"API(?: REST)?","tech":"serve.mjs: a single http.createServer handler, routes matched with plain string and regular-expression comparisons — no router."}],"parcours":[{"titre":"Discover Acme Orders","desc":"The three pages to read first.","etapes":["use/orders","use/settings","maintain/architecture"],"space":"business"}],"suggestions":["use/orders","features/track-orders","features/approve-order","secure/api-surface","risks/findings","maintain/architecture"],"accueil_html":"\u003ch2 id=\"welcome\">Welcome\u003ca class=\"ancre\" href=\"#/accueil~welcome\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>This demo documentation is used by the \u003cstrong>kit&#39;s tests\u003c/strong>. It covers the whole syntax: annotated screens, callouts,\nbadges, a diagram, a glossary and a reading path. Start with \u003ca href=\"#/use/orders\">the orders list\u003c/a>.\u003c/p>\n","i18n":{"home.doorPages":{"one":"{n} page ›","other":"{n} pages ›
