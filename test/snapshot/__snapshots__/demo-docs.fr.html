/* ============================================================================
   Documentation site — single stylesheet (inlined at build time).
   Flat surfaces with shadows, radius 12/8, a dark "chrome" for the top bar and the home hero.
   COLOURS: tokens only, injected before this sheet by the build (engine/theme/tokens.mjs, palette
   engine/theme/default-tokens.json, project overrides theme.colors / theme.dark):
     :root { --brand: …; … }   html[data-theme="dark"] { … }
   No literal colour here: var(--token) or color-mix(in srgb, var(--token) N%, transparent).
   Class names are the historical ones of the generated markup (shared with the build and with the SVG
   diagrams of existing projects): keep them.
   ============================================================================ */
:root {
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px color-mix(in srgb, var(--shadow) 6%, transparent), 0 1px 3px color-mix(in srgb, var(--shadow) 4%, transparent);
  --shadow-md: 0 4px 16px color-mix(in srgb, var(--shadow) 7%, transparent), 0 2px 6px color-mix(in srgb, var(--shadow) 5%, transparent);
  --shadow-lg: 0 12px 40px color-mix(in srgb, var(--shadow) 14%, transparent);

  --topbar-h: 60px;
  --side-w: 290px;
  --toc-w: 230px;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}

html[data-theme="dark"] {
  --shadow-sm: 0 1px 2px color-mix(in srgb, var(--shadow) 30%, transparent);
  --shadow-md: 0 6px 20px color-mix(in srgb, var(--shadow) 35%, transparent);
  --shadow-lg: 0 16px 48px color-mix(in srgb, var(--shadow) 55%, transparent);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  scroll-padding-top: calc(var(--topbar-h) + 16px);
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15.5px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a {
  color: var(--brand-strong);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}
button {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 4px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.ico {
  width: 18px;
  height: 18px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ─── Top bar ───────────────────────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 20px;
  background: var(--chrome);
  color: var(--on-chrome);
  border-bottom: 3px solid var(--brand);
}
.marque {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--on-chrome);
  font-weight: 700;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.marque:hover {
  text-decoration: none;
}
.marque-logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--brand);
  display: grid;
  place-items: center;
}
.marque-logo svg {
  width: 20px;
  height: 20px;
  fill: var(--on-brand);
}
.marque small {
  display: block;
  font-weight: 500;
  font-size: 11.5px;
  color: var(--chrome-text);
  letter-spacing: 0.3px;
  margin-top: -3px;
}
.topnav {
  display: flex;
  gap: 2px;
}
.topnav a {
  color: var(--chrome-text);
  padding: 7px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}
.topnav a:hover {
  color: var(--on-chrome);
  background: var(--chrome-2);
  text-decoration: none;
}
.topnav a.actif {
  color: var(--on-chrome);
  background: var(--chrome-2);
  box-shadow: inset 0 -2px 0 var(--brand);
}
.topnav a.vedette::after {
  content: "★";
  color: var(--brand);
  margin-left: 5px;
  font-size: 11px;
}
.recherche-bouton {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 260px;
  height: 36px;
  padding: 0 10px 0 12px;
  border-radius: 9px;
  border: 1px solid var(--chrome-line);
  background: var(--chrome-2);
  color: var(--chrome-text);
  cursor: pointer;
  font-size: 14px;
}
.recherche-bouton:hover {
  border-color: var(--brand);
  color: var(--on-chrome);
}
.recherche-bouton kbd {
  margin-left: auto;
  font-family: var(--font);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 5px;
  border: 1px solid var(--chrome-line);
  color: var(--chrome-text);
}
.icone-bouton {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--chrome-text);
  cursor: pointer;
}
.icone-bouton:hover {
  background: var(--chrome-2);
  color: var(--on-chrome);
}
.version-puce {
  font-size: 11.5px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--brand-glow) 18%, transparent);
  color: var(--brand-on-chrome);
  white-space: nowrap;
}
#menu-mobile {
  display: none;
}

/* ─── Layout ────────────────────────────────────────────────────────────── */
.coque {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr) var(--toc-w);
  min-height: calc(100vh - var(--topbar-h));
}
.coque.sans-toc {
  grid-template-columns: var(--side-w) minmax(0, 1fr);
}
.coque.accueil {
  grid-template-columns: minmax(0, 1fr);
}
.coque.accueil .principal {
  padding: 0;
}
.coque.accueil .lateral,
.coque.accueil .toc {
  display: none;
}

.lateral {
  position: sticky;
  top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  padding: 18px 12px 40px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  scrollbar-width: thin;
}
.lat-section {
  margin-bottom: 6px;
}
.lat-section > button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 13.5px;
  color: var(--text);
  text-align: left;
}
.lat-section > button:hover {
  background: var(--surface-2);
}
.lat-section > button .chevron {
  margin-left: auto;
  transition: transform 0.15s;
  color: var(--text-faint);
  width: 16px;
  height: 16px;
}
.lat-section.ouverte > button .chevron {
  transform: rotate(90deg);
}
.lat-section .pastille-section {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: var(--brand-soft);
  color: var(--brand-strong);
}
.lat-section .pastille-section .ico {
  width: 15px;
  height: 15px;
}
.lat-corps {
  display: none;
  padding: 2px 0 8px;
}
.lat-section.ouverte .lat-corps {
  display: block;
}
.lat-groupe {
  margin: 10px 0 2px 14px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--text-faint);
}
.lat-lien {
  display: block;
  margin-left: 14px;
  padding: 5px 10px 5px 12px;
  border-left: 2px solid var(--line);
  color: var(--text-soft);
  font-size: 13.8px;
  line-height: 1.4;
}
.lat-lien:hover {
  color: var(--text);
  border-left-color: var(--line-strong);
  text-decoration: none;
  background: var(--surface-2);
}
.lat-lien.actif {
  color: var(--brand-strong);
  border-left-color: var(--brand);
  background: var(--brand-soft);
  font-weight: 600;
}
.lat-lien.niveau-2 {
  margin-left: 26px;
  font-size: 13.2px;
}
/* Page with sub-pages: counter on the right; its sub-pages are only shown within its branch. */
.lat-lien.a-enfants {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.lat-nb {
  flex: none;
  min-width: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--text-soft);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}
.lat-lien.deplie .lat-nb,
.lat-lien.actif .lat-nb {
  background: var(--brand-soft);
  color: var(--brand-strong);
}
.lat-lien.parent-actif {
  color: var(--text);
  border-left-color: var(--brand);
  font-weight: 600;
}

.principal:focus {
  outline: none;
}
.principal {
  min-width: 0;
  padding: 34px 48px 80px;
}
.article {
  max-width: 900px;
  margin: 0 auto;
}
.toc {
  position: sticky;
  top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  padding: 34px 18px 40px 6px;
  font-size: 13px;
}
.toc-titre {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--text-faint);
  margin: 0 0 10px 12px;
}
.toc a {
  display: block;
  padding: 4px 10px 4px 12px;
  border-left: 2px solid var(--line);
  color: var(--text-soft);
  line-height: 1.4;
}
.toc a.h3 {
  padding-left: 24px;
  font-size: 12.5px;
}
.toc a:hover {
  color: var(--text);
  text-decoration: none;
}
.toc a.actif {
  color: var(--brand-strong);
  border-left-color: var(--brand);
  font-weight: 600;
}

/* ─── Page header ───────────────────────────────────────────────────────── */
.ariane {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-faint);
  margin-bottom: 14px;
}
.ariane a {
  color: var(--text-soft);
}
.ariane .sep {
  opacity: 0.6;
}
.page-titre {
  font-size: 34px;
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -0.4px;
  margin: 0 0 12px;
}
.page-resume {
  font-size: 17.5px;
  line-height: 1.6;
  color: var(--text-soft);
  margin: 0 0 18px;
}
.page-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 26px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line);
}

/* ─── Content typography ────────────────────────────────────────────────── */
.contenu h2 {
  font-size: 24px;
  line-height: 1.3;
  font-weight: 750;
  letter-spacing: -0.2px;
  margin: 46px 0 14px;
  padding-top: 6px;
}
.contenu h3 {
  font-size: 18.5px;
  font-weight: 700;
  margin: 32px 0 10px;
}
.contenu h4 {
  font-size: 15.5px;
  font-weight: 700;
  margin: 24px 0 8px;
}
.contenu h2 .ancre,
.contenu h3 .ancre {
  opacity: 0;
  margin-left: 8px;
  color: var(--text-faint);
  font-weight: 500;
}
.contenu h2:hover .ancre,
.contenu h3:hover .ancre {
  opacity: 1;
}
.contenu p {
  margin: 0 0 14px;
}
.contenu ul,
.contenu ol {
  margin: 0 0 16px;
  padding-left: 24px;
}
.contenu li {
  margin: 4px 0;
}
.contenu li > ul,
.contenu li > ol {
  margin: 4px 0;
}
.contenu strong {
  font-weight: 650;
}
.contenu code {
  font-family: var(--mono);
  font-size: 0.86em;
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  word-break: break-word;
}
.contenu pre {
  margin: 0 0 18px;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  background: var(--chrome);
  color: var(--chrome-text-strong);
  overflow-x: auto;
  font-size: 13.2px;
  line-height: 1.55;
}
.contenu pre code {
  background: none;
  border: 0;
  padding: 0;
  color: inherit;
  font-size: inherit;
}
.contenu hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 34px 0;
}
.contenu blockquote {
  margin: 0 0 16px;
  padding: 4px 16px;
  border-left: 3px solid var(--line-strong);
  color: var(--text-soft);
}
.contenu img.inline {
  max-width: 100%;
  border-radius: var(--radius-sm);
}

/* Settings tables */
.tableau {
  margin: 0 0 22px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.tableau table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  line-height: 1.5;
}
.tableau th {
  text-align: left;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--text-soft);
  background: var(--surface-2);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.tableau td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.tableau tr:last-child td {
  border-bottom: 0;
}
.tableau tbody tr:hover td {
  background: var(--surface-2);
}
/* Wide tables (5 columns or more): slightly more compact to fit the reading column. */
.tableau table:has(th:nth-child(5)) {
  font-size: 13.2px;
}
.tableau table:has(th:nth-child(5)) th,
.tableau table:has(th:nth-child(5)) td {
  padding: 8px 10px;
}
.tableau table:has(th:nth-child(5)) td:first-child {
  min-width: 0;
}
.tableau code {
  white-space: normal;
  word-break: normal;
  overflow-wrap: normal;
}
.tableau td:first-child {
  font-weight: 600;
  min-width: 150px;
}
.tableau tr.allume td {
  background: var(--brand-soft) !important;
}

/* Inline badges: [[perm …]], [[menu …]], [[key …]], [[status N]] */
.puce {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.5;
  padding: 1px 9px;
  border-radius: 999px;
  vertical-align: 1px;
  white-space: nowrap;
}
.puce .ico {
  width: 13px;
  height: 13px;
}
.puce.droit {
  background: var(--violet-soft);
  color: var(--violet);
  font-family: var(--mono);
  font-size: 12px;
}
.puce.menu {
  background: var(--brand-soft);
  color: var(--brand-strong);
}
.puce.route {
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text-soft);
  font-family: var(--mono);
  font-size: 12px;
}
.puce.statut::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--c);
}
.puce.statut {
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--text);
}
kbd,
.touche {
  display: inline-block;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  padding: 1px 7px;
  border-radius: 6px;
  border: 1px solid var(--line-strong);
  border-bottom-width: 2px;
  background: var(--surface);
  color: var(--text);
  white-space: nowrap;
}

/* Callouts */
.encadre {
  display: flex;
  gap: 14px;
  margin: 0 0 18px;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--c-line, var(--line));
  background: var(--c-soft, var(--surface-2));
}
.encadre > .ico {
  width: 22px;
  height: 22px;
  color: var(--c, var(--text-soft));
  margin-top: 2px;
}
.encadre-titre {
  font-weight: 700;
  color: var(--c, var(--text));
  margin-bottom: 3px;
  font-size: 14.5px;
}
.encadre-corps > :last-child {
  margin-bottom: 0;
}
.encadre-corps {
  min-width: 0;
  flex: 1;
}
.encadre.astuce {
  --c: var(--brand-strong);
  --c-soft: var(--brand-soft);
  --c-line: var(--brand-line);
}
.encadre.attention {
  --c: var(--warn);
  --c-soft: var(--warn-soft);
  --c-line: color-mix(in srgb, var(--warn) 35%, transparent);
}
.encadre.erreur {
  --c: var(--danger);
  --c-soft: var(--danger-soft);
  --c-line: color-mix(in srgb, var(--danger) 35%, transparent);
}
.encadre.droits {
  --c: var(--violet);
  --c-soft: var(--violet-soft);
  --c-line: color-mix(in srgb, var(--violet) 30%, transparent);
}
.encadre.note {
  --c: var(--info);
  --c-soft: var(--info-soft);
  --c-line: color-mix(in srgb, var(--info) 30%, transparent);
}
.encadre.recette {
  --c: var(--ok);
  --c-soft: var(--ok-soft);
  --c-line: color-mix(in srgb, var(--ok) 30%, transparent);
}
.encadre.mecanisme {
  --c: var(--chrome);
  --c-soft: var(--surface);
  --c-line: var(--line-strong);
  border-left: 4px solid var(--brand);
  box-shadow: var(--shadow-sm);
}
html[data-theme="dark"] .encadre.mecanisme {
  --c: var(--brand);
}

/* Step-by-step lists */
ol.etapes {
  list-style: none;
  counter-reset: etape;
  padding: 0;
  margin: 0 0 22px;
}
ol.etapes > li {
  counter-increment: etape;
  position: relative;
  padding: 2px 0 16px 48px;
  margin: 0;
}
ol.etapes > li::before {
  content: counter(etape);
  position: absolute;
  left: 0;
  top: 0;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--brand);
  color: var(--on-brand);
  font-weight: 700;
  font-size: 14px;
  display: grid;
  place-items: center;
}
ol.etapes > li::after {
  content: "";
  position: absolute;
  left: 14px;
  top: 34px;
  bottom: 2px;
  width: 2px;
  background: var(--line);
}
ol.etapes > li:last-child::after {
  display: none;
}

/* ─── Interactive screen (screenshot + zones) ───────────────────────────── */
.ecran {
  margin: 8px 0 28px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}
.ecran-barre {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px 9px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.ecran-points {
  display: flex;
  gap: 6px;
}
.ecran-points i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--line-strong);
}
.ecran-titre {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-soft);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bouton {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.bouton:hover {
  border-color: var(--brand);
  color: var(--brand-strong);
}
.bouton.primaire {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--on-brand);
}
.bouton.primaire:hover {
  background: var(--brand-deep);
  color: var(--on-brand);
}
.bouton .ico {
  width: 15px;
  height: 15px;
}
/* The frame fits the image (natural width, capped at 100 %): the zones, in %, stay aligned,
   and a narrow (mobile) screenshot keeps its real size instead of being stretched. */
.ecran-cadre {
  position: relative;
  line-height: 0;
  cursor: zoom-in;
  width: fit-content;
  max-width: 100%;
  margin: 0 auto;
}
.ecran-cadre img {
  max-width: 100%;
  height: auto;
  display: block;
}
.ecran:has(.ecran-cadre) {
  background: var(--surface);
}
.zone {
  position: absolute;
  border-radius: 6px;
  border: 2px solid transparent;
  transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
  cursor: pointer;
}
.zone:hover,
.zone:focus-visible,
.zone.allume {
  border-color: var(--brand);
  background: color-mix(in srgb, var(--brand-glow) 10%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-glow) 18%, transparent);
}
.zone:focus-visible {
  border-radius: 6px;
}
.pastille {
  position: absolute;
  top: -1px;
  left: -30px;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: var(--brand);
  color: var(--on-brand);
  border: 2px solid var(--on-brand);
  box-shadow: 0 2px 6px color-mix(in srgb, var(--ink) 35%, transparent);
  font-size: 12px;
  font-weight: 800;
  line-height: 19px;
  text-align: center;
  font-family: var(--font);
  z-index: 2;
}
.zone.allume .pastille {
  background: var(--chrome);
  transform: scale(1.12);
}
.zone.cote-coin .pastille {
  top: -11px;
  left: -11px;
}
.zone.cote-droit .pastille {
  left: auto;
  right: -11px;
}
.zone.cote-bas .pastille {
  top: auto;
  bottom: -11px;
}
.zone.cote-droit-bas .pastille {
  left: auto;
  right: -11px;
  top: auto;
  bottom: -11px;
}
.bulle {
  position: fixed;
  z-index: 95;
  max-width: 360px;
  padding: 11px 13px;
  border-radius: 10px;
  background: var(--chrome);
  color: var(--bubble-text);
  font-size: 13.5px;
  line-height: 1.5;
  box-shadow: var(--shadow-lg);
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.12s, transform 0.12s;
}
.bulle.visible {
  opacity: 1;
  transform: none;
}
.bulle strong {
  color: var(--on-chrome);
}
.bulle code {
  font-family: var(--mono);
  font-size: 12px;
  background: color-mix(in srgb, var(--on-chrome) 10%, transparent);
  padding: 0 4px;
  border-radius: 4px;
}
.bulle .bulle-n {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--brand);
  color: var(--on-brand);
  font-weight: 800;
  font-size: 11px;
  margin-right: 6px;
  vertical-align: 1px;
}
ol.legende {
  list-style: none;
  margin: 0;
  padding: 6px 8px 10px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 2px;
  line-height: 1.55;
  font-size: 14.2px;
  border-top: 1px solid var(--line);
}
ol.legende > li {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 10px;
  padding: 8px 8px;
  border-radius: 8px;
  margin: 0;
  cursor: default;
  transition: background-color 0.12s;
}
ol.legende > li:hover,
ol.legende > li.allume {
  background: var(--brand-soft);
}
ol.legende > li > .n {
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: var(--brand);
  color: var(--on-brand);
  font-weight: 800;
  font-size: 12px;
  display: grid;
  place-items: center;
  margin-top: 1px;
}
ol.legende > li > div > p:last-child,
ol.legende > li > div > ul:last-child {
  margin-bottom: 0;
}
ol.legende > li > div > p {
  margin: 0 0 6px;
}

/* ─── Viewer (zoom + guided tour) ───────────────────────────────────────── */
.visionneuse {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: color-mix(in srgb, var(--backdrop) 88%, transparent);
  display: none;
  flex-direction: column;
}
.visionneuse.ouverte {
  display: flex;
}
.vis-barre {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  color: var(--chrome-text-strong);
}
.vis-barre .titre {
  font-weight: 600;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.vis-barre .bouton {
  background: color-mix(in srgb, var(--on-chrome) 8%, transparent);
  border-color: color-mix(in srgb, var(--on-chrome) 18%, transparent);
  color: var(--on-chrome);
}
.vis-barre .bouton:hover {
  border-color: var(--brand);
  color: var(--on-chrome);
}
.vis-scene {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 6px 24px 24px;
}
.vis-image {
  position: relative;
  line-height: 0;
  max-width: 100%;
  max-height: 100%;
}
.vis-image img {
  max-width: calc(100vw - 48px);
  max-height: calc(100vh - 120px);
  display: block;
  border-radius: 8px;
  box-shadow: var(--shadow-lg);
}
.vis-image .zone {
  cursor: pointer;
}
.projecteur {
  position: absolute;
  border-radius: 8px;
  box-shadow: 0 0 0 9999px color-mix(in srgb, var(--backdrop) 62%, transparent), 0 0 0 3px var(--brand);
  transition: all 0.28s ease;
  pointer-events: none;
}
.visionneuse.en-visite .vis-scene {
  overflow: auto;
  place-items: start center;
  padding: 16px 24px 40vh;
}
.visionneuse.en-visite .vis-image img {
  max-height: none;
  max-width: min(1150px, calc(100vw - 440px));
}
.vis-carte {
  position: absolute;
  z-index: 3;
  width: 360px;
  max-width: calc(100vw - 32px);
  line-height: 1.55;
  padding: 14px 16px 12px;
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-lg);
  font-size: 14.2px;
  transition: left 0.28s ease, top 0.28s ease;
}
.vis-carte .entete {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-faint);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.vis-carte .entete .n {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--brand);
  color: var(--on-brand);
  display: grid;
  place-items: center;
  font-size: 12px;
}
.vis-carte p {
  margin: 0 0 8px;
}
.vis-carte .actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 10px;
}
.vis-carte .bouton {
  height: 30px;
}

/* ─── Before / after ────────────────────────────────────────────────────── */
.comparer {
  margin: 8px 0 28px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow-md);
}
.comparer-scene {
  position: relative;
  line-height: 0;
  user-select: none;
  cursor: ew-resize;
  touch-action: pan-y;
}
.comparer-scene img {
  width: 100%;
  height: auto;
  display: block;
}
.comparer-apres {
  position: absolute;
  inset: 0;
  clip-path: inset(0 0 0 var(--pos, 50%));
}
.comparer-poignee {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--pos, 50%);
  width: 3px;
  margin-left: -1px;
  background: var(--on-brand);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent);
}
.comparer-poignee::after {
  content: "‹ ›";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--brand);
  color: var(--on-brand);
  font: 700 15px/40px var(--font);
  text-align: center;
  box-shadow: var(--shadow-md);
}
.comparer-etiquette {
  position: absolute;
  top: 12px;
  padding: 3px 10px;
  border-radius: 999px;
  font: 700 12px/1.6 var(--font);
  background: color-mix(in srgb, var(--chrome) 82%, transparent);
  color: var(--on-chrome);
}
.comparer-etiquette.avant {
  left: 12px;
}
.comparer-etiquette.apres {
  right: 12px;
  background: var(--brand);
}
figcaption,
.legende-figure {
  padding: 10px 14px;
  font-size: 13.5px;
  color: var(--text-soft);
  border-top: 1px solid var(--line);
  background: var(--surface-2);
}

/* ─── SVG diagrams ──────────────────────────────────────────────────────── */
.schema {
  margin: 8px 0 28px;
  padding: 18px 18px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
.schema svg {
  width: 100%;
  height: auto;
  display: block;
  font-family: var(--font);
}
.schema figcaption {
  margin: 12px -18px 0;
  border-radius: 0 0 var(--radius) var(--radius);
}
/* Classes used inside the SVG diagrams (follow the theme). English names, plus the legacy s-* names of
   existing diagrams (ARCHITECTURE.md §6.7a). */
.d-box,
.s-boite {
  fill: var(--surface);
  stroke: var(--line-strong);
  stroke-width: 1.5;
}
.d-box-2,
.s-boite-2 {
  fill: var(--surface-2);
  stroke: var(--line);
  stroke-width: 1.2;
}
.d-brand,
.s-marque {
  fill: var(--brand-soft);
  stroke: var(--brand);
  stroke-width: 1.8;
}
.d-solid,
.s-plein {
  fill: var(--brand);
}
.d-chrome,
.s-navy {
  fill: var(--chrome);
}
.d-warn,
.s-alerte {
  fill: var(--warn-soft);
  stroke: var(--warn);
  stroke-width: 1.5;
}
.d-danger,
.s-danger {
  fill: var(--danger-soft);
  stroke: var(--danger);
  stroke-width: 1.5;
}
.d-info,
.s-info {
  fill: var(--info-soft);
  stroke: var(--info);
  stroke-width: 1.5;
}
.d-violet,
.s-violet {
  fill: var(--violet-soft);
  stroke: var(--violet);
  stroke-width: 1.5;
}
.d-line,
.s-trait {
  stroke: var(--text-faint);
  stroke-width: 1.6;
  fill: none;
}
.d-line-brand,
.s-trait-marque {
  stroke: var(--brand);
  stroke-width: 2;
  fill: none;
}
.d-dashed,
.s-pointille {
  stroke: var(--text-faint);
  stroke-width: 1.4;
  stroke-dasharray: 5 4;
  fill: none;
}
.d-title,
.s-titre {
  fill: var(--text);
  font-size: 14px;
  font-weight: 700;
}
.d-text,
.s-texte {
  fill: var(--text-soft);
  font-size: 12.5px;
}
.d-small,
.s-petit {
  fill: var(--text-faint);
  font-size: 11px;
}
.d-white,
.s-blanc {
  fill: var(--on-brand);
  font-size: 13px;
  font-weight: 700;
}
/* Text on a d-chrome box: --on-chrome stays readable in both themes (d-white follows --on-brand, which turns
   dark in the dark theme to stay readable on the brand colour). */
.d-on-chrome {
  fill: var(--on-chrome);
  font-size: 13px;
  font-weight: 700;
}
.d-arrow,
.s-fleche {
  fill: var(--text-faint);
}
.d-arrow-brand,
.s-fleche-marque {
  fill: var(--brand);
}

/* ─── Glossary tooltips ─────────────────────────────────────────────────── */
.gl {
  border-bottom: 1.5px dotted var(--brand);
  cursor: help;
}

/* ─── Cards (home, section pages) ───────────────────────────────────────── */
.grille-cartes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
  margin: 0 0 30px;
}
.carte-lien {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 16px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  color: var(--text);
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.carte-lien:hover {
  text-decoration: none;
  border-color: var(--brand);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.carte-lien .titre {
  font-weight: 700;
  font-size: 15.5px;
}
.carte-lien .resume {
  color: var(--text-soft);
  font-size: 13.8px;
  line-height: 1.5;
}
.carte-lien .compte {
  margin-top: auto;
  font-size: 12px;
  color: var(--text-faint);
  font-weight: 600;
}
.groupe-titre {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text-faint);
  margin: 26px 0 10px;
}

.heros {
  background: var(--chrome);
  color: var(--on-chrome);
  padding: 58px 48px 64px;
  position: relative;
  overflow: hidden;
}
.heros::after {
  content: "";
  position: absolute;
  right: -120px;
  top: -140px;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  border: 70px solid color-mix(in srgb, var(--brand-glow) 12%, transparent);
}
.heros-interieur {
  max-width: 1180px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
.heros .sur-titre {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--brand-on-chrome);
  margin-bottom: 14px;
}
.heros h1 {
  font-size: 44px;
  line-height: 1.12;
  letter-spacing: -0.8px;
  margin: 0 0 16px;
  max-width: 820px;
}
.heros h1 span {
  color: var(--hero-accent);
}
.heros p {
  font-size: 18px;
  line-height: 1.6;
  color: var(--chrome-text);
  max-width: 760px;
  margin: 0 0 26px;
}
.heros .actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.heros .bouton {
  height: 42px;
  padding: 0 18px;
  font-size: 14.5px;
  border-color: color-mix(in srgb, var(--on-chrome) 25%, transparent);
  background: color-mix(in srgb, var(--on-chrome) 6%, transparent);
  color: var(--on-chrome);
}
.heros .bouton.primaire {
  background: var(--brand);
  border-color: var(--brand);
}
.heros .chiffres {
  display: flex;
  gap: 34px;
  flex-wrap: wrap;
  margin-top: 36px;
  padding-top: 24px;
  border-top: 1px solid var(--chrome-line);
}
.heros .chiffres div {
  font-size: 13px;
  color: var(--chrome-text);
}
.heros .chiffres strong {
  display: block;
  font-size: 26px;
  color: var(--on-chrome);
  font-weight: 800;
}
.accueil-corps {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 48px 80px;
}
.portes {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-top: -34px;
  position: relative;
  z-index: 2;
}
.porte {
  display: flex;
  flex-direction: column;
  padding: 22px 22px 18px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  color: var(--text);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.porte:hover {
  text-decoration: none;
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: var(--brand);
}
.porte.vedette {
  border: 2px solid var(--brand);
}
.porte .icone {
  width: 44px;
  height: 44px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--brand-soft);
  color: var(--brand-strong);
  margin-bottom: 14px;
}
.porte .icone .ico {
  width: 22px;
  height: 22px;
}
.porte .etiquette {
  align-self: flex-start;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--brand);
  color: var(--on-brand);
  margin-bottom: 8px;
}
.porte h2 {
  font-size: 20px;
  margin: 0 0 8px;
}
.porte p {
  color: var(--text-soft);
  font-size: 14.5px;
  line-height: 1.55;
  margin: 0 0 14px;
}
.porte ul {
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
  font-size: 13.8px;
  color: var(--text-soft);
}
.porte ul li {
  padding: 3px 0 3px 18px;
  position: relative;
}
.porte ul li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 11px;
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--brand);
}
.porte .aller {
  margin-top: auto;
  font-weight: 700;
  font-size: 14px;
  color: var(--brand-strong);
}
.accueil-section-titre {
  font-size: 24px;
  font-weight: 800;
  margin: 50px 0 6px;
}
.accueil-section-sous {
  color: var(--text-soft);
  margin: 0 0 18px;
}
.parcours {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.parcours.deux-colonnes {
  grid-template-columns: repeat(2, 1fr);
}
.parcours .carte-lien ol {
  margin: 4px 0 0;
  padding-left: 20px;
  color: var(--text-soft);
  font-size: 13.8px;
}

/* ─── Footer, previous / next ───────────────────────────────────────────── */
.pied-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 54px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.pied-nav a {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
}
.pied-nav a:hover {
  border-color: var(--brand);
  text-decoration: none;
}
.pied-nav a.suivant {
  text-align: right;
  grid-column: 2;
}
.pied-nav small {
  font-size: 12px;
  color: var(--text-faint);
  font-weight: 600;
}
.pied-nav span {
  font-weight: 700;
  color: var(--brand-strong);
}
/* Dates and versions of the page's screenshots, just above the site footer. */
.pied-captures {
  margin-top: 28px;
  font-size: 12.5px;
  color: var(--text-faint);
  text-align: center;
}
.pied-captures + .pied-site {
  margin-top: 4px;
}
.pied-site {
  margin-top: 28px;
  font-size: 12.5px;
  color: var(--text-faint);
  text-align: center;
}

/* ─── Search ────────────────────────────────────────────────────────────── */
.recherche-fond {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: color-mix(in srgb, var(--backdrop) 55%, transparent);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 11vh;
}
.recherche-fond.ouverte {
  display: flex;
}
.recherche-boite {
  width: min(680px, calc(100vw - 32px));
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  border: 1px solid var(--line);
}
.recherche-champ {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
}
.recherche-champ input {
  flex: 1;
  height: 56px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: 500 17px var(--font);
}
.recherche-champ .ico {
  color: var(--text-faint);
}
.recherche-resultats {
  max-height: 60vh;
  overflow-y: auto;
  padding: 6px;
}
.resultat {
  display: block;
  padding: 10px 12px;
  border-radius: 9px;
  color: var(--text);
}
.resultat:hover,
.resultat.actif {
  background: var(--brand-soft);
  text-decoration: none;
}
.resultat .chemin {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-faint);
  letter-spacing: 0.2px;
}
.resultat .titre {
  font-weight: 700;
  font-size: 14.5px;
}
.resultat .extrait {
  font-size: 13px;
  color: var(--text-soft);
  line-height: 1.5;
}
.resultat mark {
  background: color-mix(in srgb, var(--brand-glow) 22%, transparent);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
}
.recherche-vide {
  padding: 26px;
  text-align: center;
  color: var(--text-faint);
  font-size: 14px;
}
.recherche-aide {
  display: flex;
  gap: 16px;
  padding: 9px 16px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--text-faint);
  background: var(--surface-2);
}

/* ─── Full print ────────────────────────────────────────────────────────── */
#impression {
  display: none;
}

/* ─── Responsive ────────────────────────────────────────────────────────── */
@media (max-width: 1280px) {
  .coque {
    grid-template-columns: var(--side-w) minmax(0, 1fr);
  }
  .toc {
    display: none;
  }
  .principal {
    padding: 30px 34px 70px;
  }
}
@media (max-width: 1200px) {
  .portes {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 1080px) {
  .topnav {
    display: none;
  }
  .recherche-bouton {
    min-width: 0;
  }
}
@media (max-width: 900px) {
  :root {
    --topbar-h: 56px;
  }
  #menu-mobile {
    display: grid;
  }
  .coque,
  .coque.sans-toc {
    grid-template-columns: minmax(0, 1fr);
  }
  .lateral {
    position: fixed;
    top: var(--topbar-h);
    left: 0;
    width: min(320px, 86vw);
    z-index: 35;

  }
  body.menu-ouvert .lateral {

  }
  .principal {
    padding: 22px 16px 60px;
  }
  .page-titre {
    font-size: 27px;
  }
  .recherche-bouton span,
  .recherche-bouton kbd,
  .version-puce,
  .marque small {
    display: none;
  }
  .recherche-bouton {
    width: 36px;
    padding: 0;
    justify-content: center;
    border-color: transparent;
    background: transparent;
  }
  .heros {
    padding: 36px 16px 56px;
  }
  .heros h1 {
    font-size: 30px;
  }
  .accueil-corps {
    padding: 0 16px 60px;
  }
  .portes,
  .parcours,
  .parcours.deux-colonnes {
    grid-template-columns: 1fr;
  }
  .pied-nav {
    grid-template-columns: 1fr;
  }
  .pied-nav a.suivant {
    grid-column: 1;
  }
  .ecran-barre .libelle-long {
    display: none;
  }
  .topbar {
    gap: 8px;
    padding: 0 10px;
  }
}

@media print {
  @page {
    margin: 14mm 12mm;
  }
  body {
    background: var(--print-bg);
    color: var(--print-text);
    font-size: 11pt;
  }
  .topbar,
  .lateral,
  .toc,
  .pied-nav,
  .ecran-barre .bouton,
  .visionneuse,
  .recherche-fond,
  .bulle {
    display: none !important;
  }
  .coque {
    display: block;
  }
  .principal {
    padding: 0;
  }
  body.impression-complete .coque {
    display: none;
  }
  body.impression-complete #impression {
    display: block;
  }
  .page-imprimee {
    break-before: page;
  }
  .page-imprimee:first-child {
    break-before: auto;
  }
  .ecran,
  .comparer,
  .schema,
  .encadre,
  .tableau tr {
    break-inside: avoid;
    box-shadow: none;
  }
  .contenu h2,
  .contenu h3 {
    break-after: avoid;
  }
  .zone {
    border-color: var(--brand) !important;
  }
  a {
    color: inherit;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}

3.org/2000/svg\" role=\"img\" aria-label=\"How an order flows\">\n  \u003cdefs>\u003cmarker id=\"fl-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\">\u003cpath class=\"d-arrow\" d=\"M0 0 10 5 0 10z\"/>\u003c/marker>\u003c/defs>\n  \u003crect class=\"d-box\" x=\"20\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"130\" y=\"76\" text-anchor=\"middle\">Browser\u003c/text>\n  \u003ctext class=\"d-small\" x=\"130\" y=\"98\" text-anchor=\"middle\">single-page app\u003c/text>\n  \u003crect class=\"d-brand\" x=\"340\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"450\" y=\"76\" text-anchor=\"middle\">Orders API\u003c/text>\n  \u003ctext class=\"d-text\" x=\"450\" y=\"98\" text-anchor=\"middle\">REST, JSON\u003c/text>\n  \u003crect class=\"d-info\" x=\"660\" y=\"40\" width=\"220\" height=\"80\" rx=\"10\"/>\n  \u003ctext class=\"d-title\" x=\"770\" y=\"86\" text-anchor=\"middle\">Database\u003c/text>\n  \u003cpath class=\"d-line\" d=\"M240 80H336\" marker-end=\"url(#fl-arrow)\"/>\n  \u003cpath class=\"d-line-brand\" d=\"M560 80H656\" marker-end=\"url(#fl-arrow)\"/>\n\u003c/svg>\u003cfigcaption>How an order flows\u003c/figcaption>\u003c/figure>\u003caside class=\"encadre mecanisme\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003cpath d=\"M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Comment ça marche\u003c/div>\u003cp>Every browser request goes through the API, which reads or writes the database.\u003c/p>\n\u003c/div>\u003c/aside>\n\u003ch2 id=\"run-it-locally\">Run it locally\u003ca class=\"ancre\" href=\"#/maintain/architecture~run-it-locally\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cpre>\u003ccode class=\"language-bash\">npm ci\nnpm run dev\n\u003c/code>\u003c/pre>\n\u003caside class=\"encadre recette\">\u003csvg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5\"/>\u003c/svg>\u003cdiv class=\"encadre-corps\">\u003cdiv class=\"encadre-titre\">Check the installation\u003c/div>\u003cp>Open \u003ccode>http:/\u003cwbr>/\u003cwbr>localhost:3000/\u003cwbr>api/\u003cwbr>v1/\u003cwbr>health\u003c/code>: the answer must be \u003ccode>ok\u003c/code>.\u003c/p>\n\u003c/div>\u003c/aside>\n","toc":[{"id":"overview","titre":"Overview","niveau":2},{"id":"run-it-locally","titre":"Run it locally","niveau":2}],"captures":0}},"ordre":["use/orders","use/orders/detail","use/settings","maintain/architecture"],"recherche":[{"p":"use/orders","a":"what-it-is-for","t":"What it is for","x":"The orders list is the first page shown after signing in. It summarises the day's orders and gives access to every function through the menu Orders › All orders ( /orders ). A new order gets the status Open ; a cancelled one, Cancelled . Astuce Search also opens from the keyboard: Ctrl + K ."},{"p":"use/orders","a":null,"t":"The orders list","x":""},{"p":"use/orders","a":"how-it-works","t":"How it works","x":"The list is loaded from the API when the page opens, then refreshed every minute."},{"p":"use/orders","a":"the-screen","t":"The screen","x":"Orders · list Visite guidée · 3 étapes Agrandir 1 2 3 1 Filters : status, customer and date; they are kept until you sign out. 2 Order summary : today's figures, recalculated each time the page opens. 3 New order : creates an order; see the settings ."},{"p":"use/orders","a":"example","t":"Example","x":""},{"p":"use/orders","a":"example-2","t":"Example","x":""},{"p":"use/orders","a":"example-2-2","t":"Example","x":"Setting Value Effect API address https:/ / orders. example. org/ api/ v1/ orders? status= open Where the data comes from Theme Light · Dark Interface c ure","a":null,"t":"Architecture of Acme Orders","x":""},{"p":"maintain/architecture","a":"run-it-locally","t":"Run it locally","x":"npm ci npm run dev Check the installation Open http:/ / localhost:3000/ api/ v1/ health : the answer must be ok ."}],"glossaire":[{"terme":"Order","def":"A customer request for one or more products, with a delivery address and a status.","motif":"orders?"},{"terme":"Back order","def":"An order line that cannot be shipped yet because the product is out of stock.","motif":"back[- ]orders?"},{"terme":"API","def":"Programming interface exposed by the Acme Orders server.","motif":"API(?: REST)?"}],"parcours":[{"titre":"Discover Acme Orders","desc":"The three pages to read first.","etapes":["use/orders","use/settings","maintain/architecture"]}],"suggestions":["use/orders","use/settings","maintain/architecture"],"accueil_html":"\u003ch2 id=\"welcome\">Welcome\u003ca class=\"ancre\" href=\"#/accueil~welcome\" aria-label=\"Lien vers cette section\">#\u003c/a>\u003c/h2>\n\u003cp>This demo documentation is used by the \u003cstrong>kit&#39;s tests\u003c/strong>. It covers the whole syntax: annotated screens, callouts,\nbadges, a diagram, a glossary and a reading path. Start with \u003ca href=\"#/use/orders\">the orders list\u003c/a>.\u003c/p>\n","i18n":{"home.doorPages":{"one":"{n} page ›","other":"{n} pages ›"},"home.eyebrow":"Documentation officielle · v{version}","home.featured":"Commencer ici","home.gettingStarted":"Prise en main","home.journeysIntro":{"one":"{count} chemin de lecture selon ce que vous venez faire.","other":"{count} chemins de lecture selon ce que vous venez faire."},"home.journeysTitle":"Parcours recommandés","home.number.1":"Un","home.number.2":"Deux","home.number.3":"Trois","home.number.4":"Quatre","home.number.5":"Cinq","home.number.6":"Six","home.primaryAction":"Explore the architecture","home.search":"Rechercher","home.stats.captures":"écrans annotés","home.stats.diagrams":"schémas de fonctionnement","home.stats.pages":"p <script>
/* Documentation site — browser engine (inlined at build time, no dependency).
   Data   : <script id="donnees"> (pages, outline, search index, glossary, i18n texts). The data keeps its
            historical key names (titre, pages, ordre…), shared with the build.
   Images : <script type="text/plain" id="img-ID"> (WebP data URI), read on demand.
   Texts  : none hard-coded; everything goes through t() (ui.* and home.* keys embedded by the build). */
(function () {
  "use strict";

  const D = JSON.parse(document.getElementById("donnees").textContent);
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  // Icon names used by this file → keys of the embedded icon set.
  const ICON_KEYS = { sun: "soleil", moon: "lune", screen: "ecran", lock: "droits", book: "livre", sliders: "studios", map: "carte", search: "recherche", left: "gauche" };
  const icon = (name, cls = "ico") =>
    `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${D.icones[ICON_KEYS[name] || name] || ""}</svg>`;
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  // ─── Texts (i18n) ─────────────────────────────────────────────────────────
  // t(key, vars): plain text; variables {name}; plural { one, other… } chosen from vars.n.
  // th(key, vars): HTML; the text is escaped, the variables (already HTML) are inserted as they are.
  const TEXTS = D.i18n || {};
  const rules = new Intl.PluralRules(document.documentElement.lang || undefined);
  function form(key, vars) {
    const v = TEXTS[key];
    if (v === undefined) return key;
    if (v && typeof v === "object") return v[rules.select(Number((vars && vars.n) || 0))] ?? v.other;
    return v;
  }
  const fill = (template, vars) =>
    String(template).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : m));
  const t = (key, vars) => fill(form(key, vars), vars);
  const th = (key, vars) => fill(esc(form(key, vars)), vars);

  const main = $("#contenu-principal");
  const shell = $("#coque");
  const sidebar = $("#lateral");
  const toc = $("#toc");
  const bubble = $("#bulle");
  const sectionsById = Object.fromEntries(D.sections.map((s) => [s.id, s]));
  // Sub-pages (level 2): attached to the last level-1 page above them in their group.
  const parentOf = {};
  const childrenOf = {};
  for (const s of D.sections)
    for (const g of s.groupes) {
      let parent = null;
      for (const pid of g.pages) {
        if (D.pages[pid].niveau === 2 && parent) {
          parentOf[pid] = parent;
          (childrenOf[parent] = childrenOf[parent] || []).push(pid);
        } else parent = pid;
      }
    }
  let currentPage = null;

  // ─── Local storage (reading preferences only, never required) ─────────────
  const memo = {
    read(k) {
      try {
        return localStorage.getItem(k);
      } catch (e) {
        return null;
      }
    },
    write(k, v) {
      try {
        localStorage.setItem(k, v);
      } catch (e) {
        /* private browsing: no consequence */
      }
    },
  };

  // ─── Embedded images ──────────────────────────────────────────────────────
  const imageCache = new Map();
  function imageSrc(id) {
    if (!imageCache.has(id)) {
      const el = document.getElementById("img-" + id);
      imageCache.set(id, el ? el.textContent.trim() : "");
    }
    return imageCache.get(id);
  }
  function hydrateImages(root) {
    $$("img[data-img]", root).forEach((img) => {
      if (!img.getAttribute("src")) img.src = imageSrc(img.dataset.img);
    });
  }

  // ─── Theme ────────────────────────────────────────────────────────────────
  const themeButton = $("#bouton-theme");
  function updateThemeButton() {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    themeButton.innerHTML = icon(dark ? "sun" : "moon");
    themeButton.title = dark ? t("ui.theme.light") : t("ui.theme.dark");
  }
  themeButton.addEventListener("click", () => {
    const theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", theme);
    memo.write("acme-orders-doc-theme", theme);
    updateThemeButton();
  });
  updateThemeButton();

  // ─── Top and side navigation ──────────────────────────────────────────────
  function renderTopnav(sectionId) {
    $("#topnav").innerHTML = D.sections
      .map(
        (s) =>
          `<a href="#/${s.id}" class="${s.id === sectionId ? "actif" : ""} ${s.vedette ? "vedette" : ""}">${esc(s.titre_court || s.titre)}</a>`
      )
      .join("");
  }

  const openSections = new Set();
  function renderSidebar(sectionId, pageId) {
    if (sectionId) openSections.add(sectionId);
    sidebar.innerHTML = D.sections
      .map((s) => {
        const open = openSections.has(s.id);
        const groups = s.groupes
          .map(
            (g) =>
              (g.titre ? `<div class="lat-groupe">${esc(g.titre)}</div>` : "") +
              g.pages
                .map((pid) => {
                  const p = D.pages[pid];
                  // A sub-page is shown only when its parent page or one of its siblings is displayed.
                  const branch = pageId && (parentOf[pageId] || pageId);
                  if (parentOf[pid] && parentOf[pid] !== branch) return "";
                  const children = childrenOf[pid];
                  const classes = [
                    "lat-lien",
                    parentOf[pid] ? "niveau-2" : "",
                    pid === pageId ? "actif" : "",
                    children ? "a-enfants" : "",
                    children && branch === pid ? "deplie" : "",
                    parentOf[pageId] === pid ? "parent-actif" : "",
                  ].filter(Boolean).join(" ");
                  const count = children ? `<span class="lat-nb" title="${esc(t("ui.subPages", { n: children.length }))}">${children.length}</span>` : "";
                  return `<a class="${classes}" href="#/${pid}"><span>${esc(p.titre_menu || p.titre)}</span>${count}</a>`;
                })

        return `<div class="lat-section ${open ? "ouverte" : ""}" data-section="${s.id}">

        </div>`;
      })

    const active = $(".lat-lien.actif", sidebar);

  }
  sidebar.addEventListener("click", (e) => {
    const b = e.target.closest(".lat-section > button");
    if (!b) return;

  $("#menu-mobile").addEventListener("click", () => document.body.classList.toggle("menu-ouvert"));

  // ─── Pages ────────────────────────────────────────────────────────────────
  function pageBadges(p) {
    const badges = [];
    (p.routes || []).forEach((r) => badges.push(`<span class="puce route">${icon("screen")}${esc(r)}</span>`));
    (p.droits || []).forEach((d) => badges.push(`<span class="puce droit">${icon("lock")}${esc(d)}</span>`));
    if (p.captures) badges.push(`<span class="puce menu">${icon("screen")}${esc(t("ui.page.annotatedScreens", { n: p.captures }))}</span>`);
    return badges.length ? `<div class="page-meta">${badges.join("")}</div>` : `<div class="page-meta"></div>`;
  }

  function footerNav(id) {
    const i = D.ordre.indexOf(id);
    const previous = i > 0 ? D.pages[D.ordre[i - 1]] : null;
    const next = i >= 0 && i < D.ordre.length - 1 ? D.pages[D.ordre[i + 1]] : null;
    return `<nav class="pied-nav" aria-label="${esc(t("ui.footer.neighbours"))}">
      ${previous ? `<a href="#/${previous.id}"><small>${esc(t("ui.footer.previous"))}</small><span>${esc(previous.titre)}</span></a>` : ""}
      ${next ? `<a class="suivant" href="#/${next.id}"><small>${esc(t("ui.footer.next"))}</small><span>${esc(next.titre)}</span></a>` : ""}
    </nav>`;
  }

  // "Screenshots taken on <date>, version <x>": dates and versions of the screenshots of the page
  // (meta.screenshots, from the zone files); nothing when they are unknown.
  const longDate = (d) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if (!m) return d;
    try {
      return new Intl.DateTimeFormat(document.documentElement.lang || undefined, { dateStyle: "long", timeZone: "UTC" }).format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)));
    } catch (e) {
      return d;
    }
  };
  const versionOrder = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
  function screenshotsNote(p) {
    const info = D.meta.screenshots;
    if (!info) return "";
    const ids = new Set(Array.from(String(p.html).matchAll(/data-img="([^"]+)"/g), (m) => m[1]));
    const known = Array.from(ids, (id) => info[id]).filter(Boolean);
    const dates = Array.from(new Set(known.map((x) => x.captured).filter(Boolean))).sort();
    const versions = Array.from(new Set(known.map((x) => x.version).filter(Boolean))).sort(versionOrder);
    if (!dates.length && !versions.length) return "";
    const parts = [];
    if (dates.length === 1) parts.push(t("ui.footer.screenshots.on", { date: longDate(dates[0]) }));
    else if (dates.length > 1) parts.push(t("ui.footer.screenshots.between", { from: longDate(dates[0]), to: longDate(dates[dates.length - 1]) }));
    if (versions.length)
      parts.push(t(dates.length ? "ui.footer.screenshots.version" : "ui.footer.screenshots.versionOnly", { n: versions.length, version: versions.join(", ") }));
    return `<div class="pied-captures">${esc(parts.join(", "))}</div>`;
  }

      t("ui.footer.site", { product: D.meta.produit, version: D.meta.version, date: D.meta.date, pages: D.meta.stats.pages, captures: D.meta.stats.captures })
    )}${D.meta.feedback ? ` · <a href="${esc(D.meta.feedback.url)}" rel="noopener" target="_blank">${esc(D.meta.feedback.label)}</a>` : ""}</div>`;

  function showNotFound(path) {

    shell.className = "coque sans-toc";
    renderTopnav(null);
    renderSidebar(null, null);
    toc.innerHTML = "";
    main.innerHTML = `<article class="article"><h1 class="page-titre">${esc(t("ui.notFound.title"))}</h1>
      <p class="page-resume">${esc(t("ui.notFound.text", { path }))}</p>
      <p><button class="bouton primaire" type="button" data-action="recherche">${icon("search")}${esc(t("ui.notFound.search"))}</button> <a class="bouton" href="#/">${esc(t("ui.notFound.back"))}</a></p></article>`;
  }

  // ─── Page table of contents + scroll tracking ─────────────────────────────
  function renderToc(p) {
    if (!p.toc || p.toc.length < 2) {
      toc.innerHTML = "";
      return;
    }
    toc.innerHTML =
      `<div class="toc-titre">${esc(t("ui.toc.title"))}</div>` +
      p.toc.map((h) => `<a class="h${h.niveau}" href="#/${p.id}~${h.id}" data-cible="${h.id}">${esc(h.titre)}</a>`).join("");
  }
  let tocFrame = 0;
  window.addEventListener(
    "scroll",
    () => {
      if (tocFrame) return;
      tocFrame = requestAnimationFrame(() => {
        tocFrame = 0;
        const links = $$("a[data-cible]", toc);
        if (!links.length) return;
        let active = links[0];
        for (const a of links) {
          const h = document.getElementById(a.dataset.cible);
          if (h && h.getBoundingClientRect().top < 140) active = a;
        }
        links.forEach((a) => a.classList.toggle("actif", a === active));
      });
    },
    { passive: true }
  );

  function scrollToAnchor(anchor, otherwiseTop) {
    if (anchor) {
      const el = document.getElementById(anchor);
      if (el) {
        el.scrollIntoView({ behavior: otherwiseTop ? "auto" : "smooth", block: "start" });
        return;
      }
    }
    if (otherwiseTop) window.scrollTo(0, 0);
  }

  // ─── Hydration of rendered content ────────────────────────────────────────
  function hydrate(root, page) {
    hydrateImages(root);
    $$(".comparer-scene", root).forEach(enableComparer);
    if (page) markGlossary($(".contenu", root));
    enableZones(root);
    document.body.classList.remove("menu-ouvert");
  }

  // Screen zones reachable by keyboard: Tab focuses a zone (highlighted with its legend item), Enter or Space
  // opens its bubble; in the viewer, Enter or Space goes to that step of the tour. Their accessible name is
  // "Zone n: <legend>".
  const plain = (html) => {
    const div = document.createElement("div");
    div.innerHTML = html;
    return div.textContent.replace(/\s+/g, " ").trim();
  };
  function enableZones(root) {
    $$(".ecran-cadre > .zone", root).forEach((zone) => {
      const n = zone.dataset.n;
      zone.tabIndex = 0;
      zone.setAttribute("role", "button");
      zone.setAttribute("aria-label", t("ui.zone.label", { n, text: plain(legendText(zone.closest(".ecran"), n)) }));
    });
  }
  function activateZone(zone) {
    const n = zone.dataset.n;
    if (viewer.contains(zone)) {
      const i = viewerState.steps.indexOf(n);
      if (i >= 0) goToStep(i);
      return;
    }
    const fig = zone.closest(".ecran");
    highlight(fig, n, true);
    showBubble(`<span class="bulle-n">${n}</span>${legendText(fig, n)}`, zone);
  }

  // Glossary: the first occurrence of each term in the page gets a tooltip.
  const TERMS = (D.glossaire || []).map((g) => ({
    ...g,
    re: new RegExp(`(^|[^\\p{L}\\p{N}_])(${g.motif})(?=$|[^\\p{L}\\p{N}_])`, "iu"),
  }));
  function markGlossary(root) {
    if (!root || !TERMS.length) return;
    const remaining = new Set(TERMS);
    const excluded = "a, code, pre, h1, h2, h3, h4, kbd, .puce, .gl, .ecran-barre, .pastille, figcaption, .tableau th, svg";
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) =>
        !n.nodeValue.trim() || (n.parentElement && n.parentElement.closest(excluded)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      if (!remaining.size) break;
      for (const term of remaining) {
        const m = term.re.exec(node.nodeValue);
        if (!m) continue;
        const start = m.index + m[1].length;
        const word = node.splitText(start);
        word.splitText(m[2].length);
        const span = document.createElement("span");
        span.className = "gl";
        span.tabIndex = 0;
        span.dataset.terme = term.terme;
        span.dataset.def = term.def;
        word.parentNode.replaceChild(span, word);
        span.appendChild(word);
        remaining.delete(term);
        break;
      }
    }
  }

  // ─── Tooltips (screen zones + glossary) ───────────────────────────────────
  function showBubble(html, target) {
    bubble.innerHTML = html;
    bubble.classList.add("visible");
    const r = target.getBoundingClientRect();
    const b = bubble.getBoundingClientRect();
    let top = r.bottom + 10;
    if (top + b.height > window.innerHeight - 8) top = Math.max(8, r.top - b.height - 10);
    let left = Math.min(Math.max(8, r.left), window.innerWidth - b.width - 8);
    bubble.style.top = top + "px";
    bubble.style.left = left + "px";
  }
  function hideBubble() {
    bubble.classList.remove("visible");
  }

  function legendText(fig, n) {
    const li = fig && fig.querySelector(`ol.legende > li[data-n="${n}"] > div`);
    return li ? li.innerHTML : "";
  }
  function highlight(fig, n, on) {
    if (!fig) return;
    $$(`.zone[data-n="${n}"], ol.legende > li[data-n="${n}"]`, fig).forEach((el) => el.classList.toggle("allume", on));
  }

  document.addEventListener("mouseover", (e) => {
    const zone = e.target.closest(".zone");
    if (zone) {
      const fig = zone.closest(".ecran") || viewerState.fig;
      highlight(zone.closest(".ecran"), zone.dataset.n, true);
      if (!(viewerState.open && viewerState.tour)) {
        showBubble(`<span class="bulle-n">${zone.dataset.n}</span>${legendText(fig, zone.dataset.n)}`, zone);
      }
      return;
    }
    const li = e.target.closest("ol.legende > li");
    if (li) {
      highlight(li.closest(".ecran"), li.dataset.n, true);
      return;
    }
    const gl = e.target.closest(".gl");
    if (gl) showBubble(`<strong>${esc(gl.dataset.terme)}</strong> — ${esc(gl.dataset.def)}`, gl);
  });
  document.addEventListener("mouseout", (e) => {
    const zone = e.target.closest(".zone");
    if (zone) {
      highlight(zone.closest(".ecran"), zone.dataset.n, false);
      hideBubble();
      return;
    }
    const li = e.target.closest("ol.legende > li");
    if (li) highlight(li.closest(".ecran"), li.dataset.n, false);
    if (e.target.closest(".gl")) hideBubble();
  });
  document.addEventListener("focusin", (e) => {
    const gl = e.target.closest && e.target.closest(".gl");
    if (gl) showBubble(`<strong>${esc(gl.dataset.terme)}</strong> — ${esc(gl.dataset.def)}`, gl);
    const zone = e.target.closest && e.target.closest(".ecran .zone");
    if (zone) highlight(zone.closest(".ecran"), zone.dataset.n, true);
  });
  document.addEventListener("focusout", (e) => {
    if (e.target.closest && e.target.closest(".gl")) hideBubble();
    const zone = e.target.closest && e.target.closest(".ecran .zone");
    if (zone) {
      highlight(zone.closest(".ecran"), zone.dataset.n, false);
      hideBubble();
    }
  });
  window.addEventListener("scroll", hideBubble, { passive: true });

  // ─── Viewer: enlarge + guided tour ────────────────────────────────────────
  const viewer = $("#visionneuse");
  const scene = $("#vis-scene");
  const viewerState = { open: false, tour: false, fig: null, steps: [], i: 0, back: null };

  // Dialogs (viewer, search): Tab stays inside while open; closing gives the focus back to where it was.
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])';
  function trapTab(e, container) {
    const items = $$(FOCUSABLE, container).filter((el) => el.getClientRects().length > 0);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    const inside = container.contains(document.activeElement);
    if (e.shiftKey && (!inside || document.activeElement === first)) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && (!inside || document.activeElement === last)) {
      e.preventDefault();
      first.focus();
    }
  }
  function giveFocusBack(el) {
    if (el && el.isConnected && typeof el.focus === "function") el.focus({ preventScroll: true });
  }

  function openViewer(fig, tour) {
    const img = $("img[data-img]", fig);
    if (!viewerState.open) viewerState.back = document.activeElement;
    viewerState.fig = fig;
    viewerState.steps = $$("ol.legende > li", fig).map((li) => li.dataset.n);
    viewerState.open = true;
    $("#vis-titre").textContent = fig.dataset.titre || "";
    $("#vis-visite").style.display = viewerState.steps.length ? "" : "none";
    const zones = $$(".ecran-cadre > .zone", fig)
      .map((z) => z.outerHTML)
      .join("");
    scene.innerHTML = `<div class="vis-image"><img alt="${esc(fig.dataset.titre || "")}" src="${imageSrc(img.dataset.img)}">${zones}<div class="projecteur" hidden></div><div class="vis-carte" hidden></div></div>`;
    viewer.classList.add("ouverte");
    document.body.style.overflow = "hidden";
    hideBubble();
    if (tour && viewerState.steps.length) {
      const image = $("img", scene);
      const start = () => goToStep(0);
      if (image.complete) requestAnimationFrame(start);
      else image.addEventListener("load", start, { once: true });
    } else {
      viewerState.tour = false;
      viewer.classList.remove("en-visite");
    }
    $("#vis-fermer").focus();
  }
  function closeViewer() {
    viewer.classList.remove("ouverte", "en-visite");
    viewerState.open = false;
    viewerState.tour = false;
    scene.innerHTML = "";
    document.body.style.overflow = "";
    hideBubble();
    giveFocusBack(viewerState.back);
    viewerState.back = null;
  }
  function goToStep(i) {
    const n = viewerState.steps.length;
    if (!n) return;
    viewerState.tour = true;
    viewer.classList.add("en-visite");
    viewerState.i = Math.max(0, Math.min(n - 1, i));
    const num = viewerState.steps[viewerState.i];
    const frame = $(".vis-image", scene);
    const zone = $(`.zone[data-n="${num}"]`, frame);
    const spot = $(".projecteur", frame);
    const card = $(".vis-carte", frame);
    $$(".zone", frame).forEach((z) => z.classList.toggle("allume", z === zone));
    spot.hidden = false;
    spot.style.left = `calc(${zone.style.left} - 6px)`;
    spot.style.top = `calc(${zone.style.top} - 6px)`;
    spot.style.width = `calc(${zone.style.width} + 12px)`;
    spot.style.height = `calc(${zone.style.height} + 12px)`;
    const last = viewerState.i === n - 1;
    card.hidden = false;
    card.innerHTML = `<div class="entete"><span class="n">${num}</span>${esc(t("ui.tour.step", { i: viewerState.i + 1, n }))}</div>
      <div>${legendText(viewerState.fig, num)}</div>
      <div class="actions">
        ${viewerState.i > 0 ? `<button class="bouton" data-vis="prec">${icon("left")}${esc(t("ui.tour.previous"))}</button>` : ""}
        <button class="bouton primaire" data-vis="${last ? "fin" : "suiv"}">${esc(last ? t("ui.tour.finish") : t("ui.tour.next"))}${last ? "" : icon("chevron")}</button>
      </div>`;
    // Brings the zone to the centre of the viewer (enlarged, scrollable image), then places the card.
    card.style.visibility = "hidden";
    requestAnimationFrame(() => {
      zone.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      setTimeout(() => {
        placeCard(frame, zone, card);
        card.style.visibility = "";
      }, 380);
    });
  }
  function placeCard(frame, zone, card) {
    const c = frame.getBoundingClientRect();
    const z = zone.getBoundingClientRect();
    const w = card.offsetWidth;
    const h = card.offsetHeight;
    const margin = 14;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const candidates = [
      [z.right + 18, z.top],
      [z.left - 18 - w, z.top],
      [z.left, z.bottom + 18],
      [z.left, z.top - 18 - h],
    ];
    let pos = candidates.find(([x, y]) => x >= margin && y >= margin && x + w <= vw - margin && y + h <= vh - margin);
    if (!pos) pos = [Math.min(Math.max(margin, z.left), vw - w - margin), Math.min(Math.max(margin, z.bottom + 18), vh - h - margin)];
    card.style.left = pos[0] - c.left + "px";
    card.style.top = pos[1] - c.top + "px";
  }
  viewer.addEventListener("click", (e) => {
    const b = e.target.closest("[data-vis]");
    if (b) {
      const a = b.dataset.vis;
      if (a === "suiv") goToStep(viewerState.i + 1);
      else if (a === "prec") goToStep(viewerState.i - 1);
      else closeViewer();
      return;
    }
    const zone = e.target.closest(".zone");
    if (zone) {
      const i = viewerState.steps.indexOf(zone.dataset.n);
      if (i >= 0) goToStep(i);
      return;
    }
    if (e.target === scene) closeViewer();
  });
  $("#vis-fermer").addEventListener("click", closeViewer);
  $("#vis-visite").addEventListener("click", () => goToStep(0));
  window.addEventListener("resize", () => {
    if (viewerState.open && viewerState.tour) goToStep(viewerState.i);
  });

  // ─── Before / after ───────────────────────────────────────────────────────
  function enableComparer(stage) {
    const update = (x) => {
      const r = stage.getBoundingClientRect();
      const p = Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100));
      stage.style.setProperty("--pos", p + "%");
    };
    let dragging = false;
    stage.addEventListener("pointerdown", (e) => {
      dragging = true;
      stage.setPointerCapture(e.pointerId);
      update(e.clientX);
    });
    stage.addEventListener("pointermove", (e) => dragging && update(e.clientX));
    stage.addEventListener("pointerup", () => (dragging = false));
    stage.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      const current = parseFloat(stage.style.getPropertyValue("--pos")) || 50;
      stage.style.setProperty("--pos", Math.max(0, Math.min(100, current + (e.key === "ArrowLeft" ? -5 : 5))) + "%");
      e.preventDefault();
    });
  }

  // ─── Global clicks ────────────────────────────────────────────────────────
  document.addEventListener("click", (e) => {
    const action = e.target.closest("[data-action]");
    const zone = e.target.closest(".ecran .zone");
    if (zone) {
      const li = zone.closest(".ecran").querySelector(`ol.legende > li[data-n="${zone.dataset.n}"]`);
      if (li) {
        li.scrollIntoView({ behavior: "smooth", block: "center" });
        li.classList.add("allume");
        setTimeout(() => li.classList.remove("allume"), 1400);
      }
      return;
    }
    if (!action) return;
    const a = action.dataset.action;
    if (a === "zoom") openViewer(action.closest(".ecran"), false);
    else if (a === "visite") openViewer(action.closest(".ecran"), true);
    else if (a === "recherche") openSearch();
  });

  // ─── Search ───────────────────────────────────────────────────────────────
  const searchBackdrop = $("#recherche");
  const field = $("#recherche-champ");
  const resultList = $("#recherche-resultats");
  const INDEX = D.recherche.map((e) => {
    const p = D.pages[e.p];
    return { ...e, nt: norm(e.t), np: norm(p ? p.titre : ""), nx: norm(e.x) };
  });
  let results = [];
  let selection = 0;

  function mark(text, terms) {
    const n = norm(text);
    const ranges = [];
    terms.forEach((term) => {
      let i = n.indexOf(term);
      while (i >= 0 && term) {
        ranges.push([i, i + term.length]);
        i = n.indexOf(term, i + term.length);
      }
    });
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of ranges) {
      if (merged.length && r[0] <= merged[merged.length - 1][1]) merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], r[1]);
      else merged.push(r);
    }
    let out = "";
    let pos = 0;
    for (const [a, b] of merged) {
      out += esc(text.slice(pos, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>";
      pos = b;
    }
    return out + esc(text.slice(pos));
  }

  function search(q) {
    const terms = norm(q).split(/\s+/).filter((x) => x.length > 1);
    if (!terms.length) return [];
    const found = [];
    for (const e of INDEX) {
      const all = e.nt + " " + e.np + " " + e.nx;
      if (!terms.every((x) => all.includes(x))) continue;
      let score = 0;
      for (const term of terms) {
        if (e.nt.includes(term)) score += 8;
        if (e.np.includes(term)) score += 3;
        let k = 0;
        let i = e.nx.indexOf(term);
        while (i >= 0 && k < 4) {
          k++;
          i = e.nx.indexOf(term, i + 1);
        }
        score += k;
      }
      if (!e.a) score += 2;
      found.push({ e, score, terms });
    }
    return found.sort((a, b) => b.score - a.score).slice(0, 24);
  }

  // Screen readers hear the number of results (role="status", aria-live="polite").
  const searchStatus = $("#recherche-statut");
  const announce = (text) => {
    if (searchStatus && searchStatus.textContent !== text) searchStatus.textContent = text;
  };
  function renderResults() {
    const q = field.value.trim();
    if (!q) {
      announce("");
      const suggestions = (D.suggestions || []).filter((pid) => D.pages[pid]);
      resultList.innerHTML =
        `<div class="recherche-vide" style="text-align:left;padding:10px 12px 4px">${esc(t("ui.search.suggestions"))}</div>` +
        suggestions
          .map(
            (pid, i) =>
              `<a class="resultat ${i === selection ? "actif" : ""}" href="#/${pid}"><div class="chemin">${esc(sectionsById[D.pages[pid].section].titre)}</div><div class="titre">${esc(D.pages[pid].titre)}</div></a>`
          )
          .join("");
      results = suggestions.map((pid) => ({ link: "#/" + pid }));
      return;
    }
    const r = search(q);
    announce(r.length ? t("ui.search.count", { n: r.length }) : t("ui.search.noResult", { query: q }));
    results = r.map((x) => ({ link: "#/" + x.e.p + (x.e.a ? "~" + x.e.a : "") }));
    if (!r.length) {
      resultList.innerHTML = `<div class="recherche-vide">${esc(t("ui.search.noResult", { query: q }))}</div>`;
      return;
    }
    resultList.innerHTML = r
      .map(({ e, terms }, i) => {
        const p = D.pages[e.p];
        const pos = Math.max(0, terms.reduce((m, term) => {
          const k = e.nx.indexOf(term);
          return k >= 0 && (m < 0 || k < m) ? k : m;
        }, -1));
        const start = Math.max(0, pos - 50);
        const excerpt = (start > 0 ? "…" : "") + e.x.slice(start, start + 170) + (e.x.length > start + 170 ? "…" : "");
        return `<a class="resultat ${i === selection ? "actif" : ""}" href="${results[i].link}">
          <div class="chemin">${esc(sectionsById[p.section].titre)} › ${esc(p.titre)}</div>
          <div class="titre">${mark(e.t, terms)}</div>
          <div class="extrait">${mark(excerpt, terms)}</div></a>`;
      })
      .join("");
  }
  let searchBack = null;
  function openSearch() {
    if (!searchBackdrop.classList.contains("ouverte")) searchBack = document.activeElement;
    searchBackdrop.classList.add("ouverte");
    selection = 0;
    renderResults();
    field.focus();
    field.select();
  }
  function closeSearch() {
    if (!searchBackdrop.classList.contains("ouverte")) return;
    searchBackdrop.classList.remove("ouverte");
    giveFocusBack(searchBack);
    searchBack = null;
  }
  $("#ouvrir-recherche").addEventListener("click", openSearch);
  field.addEventListener("input", () => {
    selection = 0;
    renderResults();
  });
  field.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!results.length) return;
      selection = (selection + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
      $$(".resultat", resultList).forEach((a, i) => a.classList.toggle("actif", i === selection));
      const a = $$(".resultat", resultList)[selection];
      if (a) a.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      const r = results[selection];
      if (r) {
        location.hash = r.link;
        closeSearch();
      }
    }
  });
  resultList.addEventListener("click", (e) => {
    if (e.target.closest(".resultat")) closeSearch();
  });
  searchBackdrop.addEventListener("click", (e) => {
    if (e.target === searchBackdrop) closeSearch();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      if (searchBackdrop.classList.contains("ouverte")) trapTab(e, searchBackdrop);
      else if (viewerState.open) trapTab(e, viewer);
      return;
    }
    const zone = (e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".zone[tabindex]");
    if (zone) {
      e.preventDefault();
      activateZone(zone);
      return;
    }
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      openSearch();
      return;
    }
    if (e.key === "/" && !inField && !viewerState.open) {
      e.preventDefault();
      openSearch();
      return;
    }
    if (e.key === "Escape") {
      if (searchBackdrop.classList.contains("ouverte")) closeSearch();
      else if (viewerState.open) closeViewer();
      else if (bubble.classList.contains("visible")) hideBubble();
      else document.body.classList.remove("menu-ouvert");
      return;
    }
    if (viewerState.open && viewerState.tour) {
      if (e.key === "ArrowRight") goToStep(viewerState.i + 1);
      if (e.key === "ArrowLeft") goToStep(viewerState.i - 1);
    }
  });

  // ─── Printing (current page or the whole documentation) ───────────────────
  $("#bouton-imprimer").addEventListener("click", () => {
    const everything = currentPage ? window.confirm(t("ui.print.confirm")) : true;
    if (!everything) {
      window.print();
      return;
    }
    const target = $("#impression");
    const outline = D.sections
      .map(
        (s) =>
          `<h3>${esc(s.titre)}</h3><ol>${s.groupes.flatMap((g) => g.pages).map((pid) => `<li>${esc(D.pages[pid].titre)}</li>`).join("")}</ol>`
      )
      .join("");
    target.innerHTML =
      `<section class="page-imprimee article"><h1 class="page-titre">${esc(D.meta.titre)}</h1><p class="page-resume">${esc(D.meta.accroche)}</p><p>${esc(t("ui.print.version", { product: D.meta.produit, version: D.meta.version, date: D.meta.date }))}</p><div class="contenu">${outline}</div></section>` +
      D.ordre
        .map((pid) => {
          const p = D.pages[pid];
          return `<section class="page-imprimee article"><div class="ariane">${esc(sectionsById[p.section].titre)}${p.groupe ? " › " + esc(p.groupe) : ""}${parentOf[p.id] ? " › " + esc(D.pages[parentOf[p.id]].titre_menu || D.pages[parentOf[p.id]].titre) : ""}</div><h1 class="page-titre">${esc(p.titre)}</h1>${p.resume ? `<p class="page-resume">${esc(p.resume)}</p>` : ""}<div class="contenu">${p.html}</div></section>`;
        })
        .join("");
    hydrateImages(target);
    document.body.classList.add("impression-complete");
    const images = $$("img", target);
    Promise.all(images.map((i) => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()))).then(() => {
      window.print();
    });
  });
  window.addEventListener("afterprint", () => {
    if (document.body.classList.contains("impression-complete")) {
      document.body.classList.remove("impression-complete");
      $("#impression").innerHTML = "";
    }
  });

  // ─── Router (#/section, #/page/id, #/page/id~anchor) ──────────────────────
  function route() {
    closeSearch();
    if (viewerState.open) closeViewer();
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const [path, anchor] = h.split("~");
    if (!path) showHome();
    else if (D.pages[path]) showPage(path, anchor);
    else if (sectionsById[path]) showSection(sectionsById[path]);
    else showNotFound(path);
    main.focus({ preventScroll: true });
  }
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
