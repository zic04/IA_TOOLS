# CI of the kit itself (RULES.md): every push and pull request runs the unit, snapshot, end-to-end and security
# tests on Linux, Windows and macOS, plus a dependency audit. ci/github-actions.yml stays the example to copy into
# a documentation project. Actions are pinned by commit (RULES.md § Supply chain).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One run per workflow and pull request: a new push cancels the run it replaces. A push to master gets a group of
# its own (its run id), so no master run is ever cancelled, a pending one neither.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The branch ruleset requires these check names: keep the pattern. Node 24 (active LTS) adds three checks,
    # "tests (<os>, Node 24)", that the ruleset can require too.
    name: tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # A run takes 4 to 12 minutes; a blocked test stops here instead of after GitHub's 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the kit's dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Unit, snapshot and security tests
        run: npm test
        env:
          DOC_KIT_FORBIDDEN_TERMS: ${{ secrets.DOC_KIT_FORBIDDEN_TERMS }}
      - name: End-to-end tests
        run: npm run test:e2e

  security:
    name: security (rules, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Security rules (RULES.md) and ReDoS budget
        run: npm run test:security
      # In this job, whose name the branch ruleset requires: the code checks that need no browser (RULES.md M11).
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Types (TypeScript, from the JSDoc)
        run: npm run typecheck
      - name: Known vulnerabilities of the runtime dependencies
        run: npm audit --omit=dev --audit-level=high
